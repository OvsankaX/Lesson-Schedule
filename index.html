<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
<title>Расписание — летающие рекламные плашки (DVD-эффект)</title>

<style>
  /* ===== ОРИГИНАЛЬНЫЙ СТИЛЬ РАСПИСАНИЯ ===== */
  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    padding: 0;
    font-family: system-ui, Arial, sans-serif;
    background: #121212;
    color: #e5e5e5;
    min-height: 100vh;
    position: relative;
  }

  header {
    text-align: center;
    padding: 18px;
    font-size: 22px;
    background: #1c1c1c;
    border-bottom: 1px solid #2a2a2a;
  }

  .container {
    max-width: 900px;
    margin: 0 auto;
    padding: 14px;
    position: relative;
    z-index: 1;
  }

  .card {
    background: #1c1c1c;
    border-radius: 10px;
    padding: 14px 16px;
    margin-bottom: 12px;
    border: 1px solid #2a2a2a;
  }

  .card .time {
    opacity: 0.7;
    font-size: 14px;
    margin-bottom: 4px;
  }

  .card .subject {
    font-size: 17px;
    font-weight: 500;
  }

  .day-title {
    font-size: 19px;
    margin: 20px 0 10px;
    opacity: 0.85;
  }

  .btns {
    display: flex;
    gap: 10px;
    margin-top: 20px;
    margin-bottom: 20px;
  }

  button {
    flex: 1;
    padding: 14px 0;
    background: #2d2d2d;
    border: none;
    border-radius: 8px;
    color: #e5e5e5;
    font-size: 16px;
    cursor: pointer;
  }

  button:active {
    background: #3a3a3a;
  }

  @media (min-width: 750px) {
    .card { display: none; }
    table { display: table; }
  }

  table {
    width: 100%;
    border-collapse: collapse;
    background: #1c1c1c;
    margin-bottom: 20px;
    border-radius: 10px;
    overflow: hidden;
  }

  th, td {
    padding: 12px;
    border-bottom: 1px solid #2a2a2a;
    text-align: center;
  }

  th {
    background: #222;
    font-weight: 600;
  }

  /* ===== РЕКЛАМНЫЕ ПЛАШКИ (белая обводка) — летающие ===== */
  .ad-float {
    position: fixed;
    background: #0a0a0a;
    border: 3px solid white;
    border-radius: 20px;
    box-shadow: 0 0 20px rgba(255,255,255,0.3);
    z-index: 1000;
    overflow: hidden;
    backdrop-filter: blur(4px);
    max-width: 260px;
    width: auto;
    min-width: 140px;
    will-change: left, top;
    cursor: default;
    transition: opacity 0.2s ease;
  }

  @media (max-width: 700px) {
    .ad-float { max-width: 180px; border-width: 2px; }
    .close-corner { width: 26px; height: 26px; font-size: 16px; }
  }

  .ad-inner { position: relative; display: block; width: 100%; }
  .ad-img { width: 100%; height: auto; display: block; cursor: pointer; object-fit: cover; background: #111; }
  .close-corner {
    position: absolute; top: 4px; right: 6px; background: #cc3333; border: none;
    color: white; font-size: 18px; width: 30px; height: 30px; border-radius: 30px;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    z-index: 20; font-family: monospace; transition: 0.1s;
  }
  .close-corner:active { background: #aa1111; transform: scale(0.95);}
  .ad-float.hidden-temp { display: none; }

  /* Пиксельный распад (белые частицы) */
  .pixel-dust { position: fixed; width: 100%; height: 100%; top: 0; left: 0; pointer-events: none; z-index: 10001; }
  .pixel { position: absolute; background-color: #ffffff; border-radius: 2px; pointer-events: none; animation: flyAway 0.45s ease-out forwards; box-shadow: 0 0 4px rgba(255,255,255,0.8); }
  @keyframes flyAway {
    0% { transform: translate(0, 0) rotate(0deg); opacity: 1; }
    100% { transform: translate(var(--dx), var(--dy)) rotate(360deg); opacity: 0; }
  }

  /* Попап после закрытия 3 реклам */
  .external-redirect-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.85);
    backdrop-filter: blur(8px);
    z-index: 20000;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: system-ui, Arial, sans-serif;
    animation: fadeIn 0.2s;
  }
  .redirect-card {
    background: #1a1a1a;
    border: 2px solid white;
    border-radius: 32px;
    padding: 28px 24px;
    max-width: 350px;
    text-align: center;
    box-shadow: 0 20px 40px rgba(0,0,0,0.5);
  }
  .redirect-card h3 {
    margin: 0 0 12px;
    font-size: 26px;
    color: #fff;
  }
  .redirect-card p {
    margin: 8px 0;
    color: #ccc;
  }
  .redirect-card button {
    background: #2a2e3a;
    border: 1px solid white;
    color: white;
    padding: 12px 24px;
    margin-top: 20px;
    border-radius: 40px;
    font-size: 18px;
    cursor: pointer;
    font-weight: bold;
  }
  .redirect-card button:active { background: #3e4455; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
</style>
</head>
<body>

<header>Дима пьяный украинец</header>

<div class="container">
  <div id="content"></div>
  <div class="btns">
    <button onclick="prevDay()">← Пред.</button>
    <button onclick="toggleAll()" id="toggleBtn">Все дни</button>
    <button onclick="nextDay()">След. →</button>
  </div>
</div>

<script>
  // ========== 1. РАСПИСАНИЕ (оригинал) ==========
  const schedules = {
    "понедельник": ["Разговоры о лудомании", "История", "Физкультура", "Алгебра", "География", "Обществознание", "Иностранный язык"],
    "вторник": ["Литература", "Русский язык", "ОБЖ", "Алгебра", "Физика", "Иностранный язык", "История"],
    "среда": ["Русский язык", "Литература", "География", "Химия", "Информатика", "Физкультура", "Труд"],
    "четверг": ["кейс батл", "Алгебра", "Геометрия", "Физика", "Биология", "Русский язык", "Литература"],
    "пятница": ["Вероятность и статистика", "Геометрия", "История", "Химия", "Биология", "Физика", "Иностранный язык"]
  };
  const times = ["8:30–9:15","9:35–10:20","10:40–11:25","11:50–12:35","12:55–13:40","13:50–14:35","14:40–15:25"];
  const days = ["понедельник","вторник","среда","четверг","пятница"];
  let dayIndex = (() => { let idx = new Date().getDay() - 1; return (idx >= 0 && idx <= 4) ? idx : 0; })();
  let showAll = false;

  function addCell(row, text, isHead) { let cell = document.createElement(isHead ? "th" : "td"); cell.textContent = text; row.appendChild(cell); }
  function renderDayBlock(container, day) {
    let title = document.createElement("div"); title.className = "day-title"; title.textContent = day.charAt(0).toUpperCase() + day.slice(1); container.appendChild(title);
    for (let i = 0; i < schedules[day].length; i++) {
      let card = document.createElement("div"); card.className = "card";
      let tSpan = document.createElement("div"); tSpan.className = "time"; tSpan.textContent = times[i];
      let sSpan = document.createElement("div"); sSpan.className = "subject"; sSpan.textContent = schedules[day][i];
      card.appendChild(tSpan); card.appendChild(sSpan); container.appendChild(card);
    }
    if (window.innerWidth >= 750) {
      let table = document.createElement("table"); let thead = document.createElement("tr");
      addCell(thead, "#", true); addCell(thead, "Время", true); addCell(thead, "Предмет", true); table.appendChild(thead);
      for (let i = 0; i < schedules[day].length; i++) {
        let row = document.createElement("tr"); addCell(row, i + 1, false); addCell(row, times[i], false); addCell(row, schedules[day][i], false); table.appendChild(row);
      }
      container.appendChild(table);
    }
  }
  function renderSchedule() { let root = document.getElementById("content"); root.innerHTML = ""; document.getElementById("toggleBtn").textContent = showAll ? "Один день" : "Все дни"; if (showAll) { for (let d of days) renderDayBlock(root, d); } else { renderDayBlock(root, days[dayIndex]); } }
  window.prevDay = () => { dayIndex = (dayIndex - 1 + days.length) % days.length; showAll = false; renderSchedule(); };
  window.nextDay = () => { dayIndex = (dayIndex + 1) % days.length; showAll = false; renderSchedule(); };
  window.toggleAll = () => { showAll = !showAll; renderSchedule(); };

  // ========== 2. ЛЕТАЮЩИЕ РЕКЛАМНЫЕ ПЛАШКИ (DVD-эффект) ==========
  // Используем три рекламных кампании, но после закрытия 3 плашек — открываем https://ovsankax.github.io/opgrader/
  // никаких тарифных меню, никаких покупок. Просто сайт.
  const adCampaigns = [
    { img: "https://placehold.co/400x200/1a1a2e/ffffff?text=Case+Battle", link: "https://case-battle.red/", alt: "Case Battle" },
    { img: "https://placehold.co/400x200/0f172a/ffffff?text=Upgrader+Pro", link: "https://upgrader.pro/ru", alt: "Upgrader Pro" },
    { img: "https://placehold.co/400x200/2d1b2e/ffffff?text=Госуслуги", link: "https://contract.gosuslugi.ru/", alt: "Госуслуги" }
  ];
  
  let adPanels = [];
  let closedAdsCount = 0;
  let isRedirectBlocked = false;     // чтобы не открывать повторно, если уже открыли сайт
  let animationFrameId = null;
  let redirectOverlayActive = false; // блокируем закрытие новых плашек во время показа попапа
  
  // Обновление позиции одной плашки с отскоком
  function updateAdPosition(ad) {
    if (!ad.element || ad.isClosing) return;
    if (ad.element.style.display === 'none') return;
    if (redirectOverlayActive) return; // пока оверлей — не двигаем, но и не ломаем
    
    let rect = ad.element.getBoundingClientRect();
    let adWidth = rect.width;
    let adHeight = rect.height;
    if (adWidth === 0 || adHeight === 0) return;
    
    let newX = ad.x + ad.vx;
    let newY = ad.y + ad.vy;
    
    // отскок от границ окна с учётом ширины/высоты
    if (newX <= 0) {
      newX = 0;
      ad.vx = Math.abs(ad.vx);
    }
    if (newX + adWidth >= window.innerWidth) {
      newX = window.innerWidth - adWidth;
      ad.vx = -Math.abs(ad.vx);
    }
    if (newY <= 0) {
      newY = 0;
      ad.vy = Math.abs(ad.vy);
    }
    if (newY + adHeight >= window.innerHeight) {
      newY = window.innerHeight - adHeight;
      ad.vy = -Math.abs(ad.vy);
    }
    
    ad.x = newX;
    ad.y = newY;
    ad.element.style.left = ad.x + 'px';
    ad.element.style.top = ad.y + 'px';
  }
  
  // Главный цикл анимации (только когда нет оверлея)
  function startFlyingAnimation() {
    if (animationFrameId) cancelAnimationFrame(animationFrameId);
    function animate() {
      // если активен оверлей редиректа — не двигаем рекламу, но анимация продолжается (чтобы не грузить)
      if (!redirectOverlayActive) {
        for (let ad of adPanels) {
          if (ad && ad.element && !ad.isClosing) {
            updateAdPosition(ad);
          }
        }
      }
      animationFrameId = requestAnimationFrame(animate);
    }
    animate();
  }
  
  // Генерация случайной позиции и скорости
  function getRandomPositionAndDirection(adElement) {
    if (!adElement) return { x: 20, y: 20, vx: 0.9, vy: 0.9 };
    const adWidth = adElement.offsetWidth || 160;
    const adHeight = adElement.offsetHeight || 140;
    const maxX = Math.max(5, window.innerWidth - adWidth - 5);
    const maxY = Math.max(5, window.innerHeight - adHeight - 5);
    let x = Math.random() * maxX;
    let y = Math.random() * maxY;
    // скорость: 0.6 – 1.5 пикселя за кадр, плавное движение
    let vx = (Math.random() * 1.0 + 0.6) * (Math.random() > 0.5 ? 1 : -1);
    let vy = (Math.random() * 1.0 + 0.6) * (Math.random() > 0.5 ? 1 : -1);
    if (Math.abs(vx) < 0.45) vx = vx > 0 ? 0.7 : -0.7;
    if (Math.abs(vy) < 0.45) vy = vy > 0 ? 0.7 : -0.7;
    return { x, y, vx, vy };
  }
  
  function updateAdImage(ad) {
    const campaign = adCampaigns[ad.imageIndex % adCampaigns.length];
    if (ad.imgElement) {
      ad.imgElement.src = campaign.img;
      ad.imgElement.alt = campaign.alt;
      ad.imgElement.onclick = (e) => { e.preventDefault(); window.open(campaign.link, "_blank"); };
    }
  }
  
  // Эффект пиксельного распада
  function pixelExplode(element, callback) {
    if (!element) { if(callback) callback(); return; }
    const rect = element.getBoundingClientRect();
    const width = rect.width, height = rect.height, left = rect.left, top = rect.top;
    if (width === 0 || height === 0) { if(callback) callback(); return; }
    const dustContainer = document.createElement('div'); dustContainer.className = 'pixel-dust'; document.body.appendChild(dustContainer);
    const pixelSize = 8, cols = Math.ceil(width / pixelSize), rows = Math.ceil(height / pixelSize);
    for (let i = 0; i < cols; i++) {
      for (let j = 0; j < rows; j++) {
        const pixel = document.createElement('div'); pixel.className = 'pixel';
        pixel.style.left = (left + i * pixelSize) + 'px'; pixel.style.top = (top + j * pixelSize) + 'px';
        pixel.style.width = pixelSize + 'px'; pixel.style.height = pixelSize + 'px';
        pixel.style.backgroundColor = '#ffffff';
        pixel.style.boxShadow = '0 0 4px rgba(255,255,255,0.8)';
        const angle = Math.random() * Math.PI * 2; const distance = 70 + Math.random() * 140;
        pixel.style.setProperty('--dx', Math.cos(angle) * distance + 'px'); pixel.style.setProperty('--dy', Math.sin(angle) * distance + 'px');
        dustContainer.appendChild(pixel);
        setTimeout(() => { if(pixel && pixel.remove) pixel.remove(); }, 450);
      }
    }
    element.style.visibility = 'hidden'; element.style.opacity = '0';
    setTimeout(() => { 
      if(dustContainer && dustContainer.remove) dustContainer.remove(); 
      if(callback) callback(); 
    }, 250);
  }
  
  // Функция редиректа на целевой сайт после 3 закрытий
  function openTargetWebsite() {
    if (isRedirectBlocked) return;
    isRedirectBlocked = true;
    // Показываем простое уведомление на секунду и открываем сайт (без меню покупок)
    // Создадим краткий попап "Переход на сайт" и откроем ссылку
    const toast = document.createElement('div');
    toast.style.position = 'fixed';
    toast.style.bottom = '30px';
    toast.style.left = '50%';
    toast.style.transform = 'translateX(-50%)';
    toast.style.backgroundColor = '#000000dd';
    toast.style.color = 'white';
    toast.style.padding = '12px 24px';
    toast.style.borderRadius = '40px';
    toast.style.fontSize = '18px';
    toast.style.zIndex = '30000';
    toast.style.backdropFilter = 'blur(8px)';
    toast.style.border = '1px solid white';
    toast.style.fontWeight = 'bold';
    toast.innerText = '🚀 Переход на сайт opgrader...';
    document.body.appendChild(toast);
    setTimeout(() => {
      toast.remove();
    }, 1500);
    // Открываем ссылку в новой вкладке
    window.open('https://ovsankax.github.io/opgrader/', '_blank');
  }
  
  // Анимация закрытия плашки и счётчик
  function closeAdWithAnimation(ad, onComplete) {
    if (!ad || !ad.element || ad.isClosing) { if(onComplete) onComplete(); return; }
    if (redirectOverlayActive) return; // не даём закрывать рекламу, когда висит уведомление
    ad.isClosing = true;
    const element = ad.element;
    element.style.pointerEvents = 'none';
    pixelExplode(element, () => {
      // после взрыва: меняем картинку и перезапускаем в новой позиции
      // увеличиваем счетчик закрытых плашек
      if (!isRedirectBlocked && !redirectOverlayActive) {
        closedAdsCount++;
        // Если закрыто 3 штуки и редирект ещё не был выполнен
        if (closedAdsCount >= 3 && !isRedirectBlocked) {
          // блокируем дальнейшие закрытия на момент перехода
          redirectOverlayActive = true;
          // Покажем аккуратное окно с подтверждением? но по заданию просто открыть сайт. Сделаем красиво, чтобы пользователь понял.
          // Создадим небольшой модал, но без тарифов: просто кнопка "Перейти" или автопереход.
          // Во избежание блокировки всплывающих окон — сделаем кнопку перехода по клику, и дополнительно автоматом через 0.3с?
          // Но по UX: покажем попап "Вы закрыли 3 рекламы, получить бонус", и при клике откроется сайт.
          // Лучше сделать чистый редирект после нажатия (не авто, иначе могут заблокировать браузеры)
          const modal = document.createElement('div');
          modal.className = 'external-redirect-overlay';
          modal.innerHTML = `
            <div class="redirect-card">
              <h3>🎁 Секретная разблокировка</h3>
              <p>Вы закрыли 3 рекламные плашки!</p>
              <p>Нажмите ниже, чтобы перейти на крутой сайт:</p>
              <button id="confirmOpenBtn">🔥 Перейти на opgrader 🔥</button>
              <p style="font-size:12px; margin-top:16px;">Закрой это окно, чтобы продолжить пользоваться расписанием</p>
            </div>
          `;
          document.body.appendChild(modal);
          const confirmBtn = modal.querySelector('#confirmOpenBtn');
          const closeModal = () => {
            modal.remove();
            redirectOverlayActive = false;
            // Восстанавливаем рекламу, которая могла быть скрыта? все нормально, остальные плашки существуют.
            // дополнительно показываем все оставшиеся объявления (они и так видны)
            // Ничего не блокируем дальше
          };
          confirmBtn.addEventListener('click', (e) => {
            e.preventDefault();
            openTargetWebsite();   // открываем сайт
            closeModal();
          });
          // Если кликнуть по фону, окно закроется без перехода (но счетчик уже достигнут, чтобы повторно не спамить)
          modal.addEventListener('click', (e) => {
            if (e.target === modal) {
              closeModal();
            }
          });
          // Запрещаем дальнейшее увеличение счётчика
          isRedirectBlocked = true;
          // Не вызываем колбэк немедленно, чтобы не менять картинку пока модал открыт
          ad.isClosing = false; // чтобы блокировка не висела
          element.remove(); // удаляем совсем элемент, так как он всё равно исчез
          if(onComplete) onComplete();
          return;
        }
      }
      
      // Обычная логика: пересоздаём плашку с новой картинкой и позицией
      element.classList.add('hidden-temp');
      element.style.visibility = 'hidden';
      // Смена рекламного изображения (циклический переход)
      ad.imageIndex = (ad.imageIndex + 1) % adCampaigns.length;
      updateAdImage(ad);
      const newPos = getRandomPositionAndDirection(ad.element);
      ad.x = newPos.x;
      ad.y = newPos.y;
      ad.vx = newPos.vx;
      ad.vy = newPos.vy;
      ad.element.style.left = ad.x + 'px';
      ad.element.style.top = ad.y + 'px';
      element.classList.remove('hidden-temp');
      ad.isClosing = false;
      element.style.visibility = 'visible';
      element.style.opacity = '1';
      element.style.animation = 'none';
      element.offsetHeight;
      element.style.animation = 'popIn 0.2s cubic-bezier(0.34, 1.2, 0.64, 1)';
      element.style.pointerEvents = '';
      if (onComplete) onComplete();
    });
  }
  
  // Создание одной рекламной плашки
  function createAdPanel() {
    const div = document.createElement("div"); div.className = "ad-float";
    const inner = document.createElement("div"); inner.className = "ad-inner";
    const img = document.createElement("img"); img.className = "ad-img";
    const closeBtn = document.createElement("button"); closeBtn.className = "close-corner"; closeBtn.textContent = "✖";
    inner.appendChild(img); inner.appendChild(closeBtn); div.appendChild(inner); document.body.appendChild(div);
    
    const initPos = getRandomPositionAndDirection(div);
    div.style.left = initPos.x + 'px';
    div.style.top = initPos.y + 'px';
    
    const adObj = {
      element: div,
      imgElement: img,
      closeBtn,
      imageIndex: Math.floor(Math.random() * adCampaigns.length),
      isClosing: false,
      x: initPos.x,
      y: initPos.y,
      vx: initPos.vx,
      vy: initPos.vy
    };
    updateAdImage(adObj);
    
    closeBtn.addEventListener("click", (e) => {
      e.stopPropagation();
      if (adObj.isClosing) return;
      if (redirectOverlayActive) return; // нельзя закрывать когда висит оверлей
      closeAdWithAnimation(adObj, null);
    });
    return adObj;
  }
  
  // Скрыть/показать все объявления (не используется для удаления, но оставим на всякий)
  function hideAllAds() {
    for (let ad of adPanels) {
      if (ad && ad.element) ad.element.style.display = 'none';
    }
  }
  function showAllAds() {
    for (let ad of adPanels) {
      if (ad && ad.element) ad.element.style.display = '';
    }
  }
  
  // Инициализация 5 летающих плашек
  function initAds() {
    for (let ad of adPanels) { if(ad && ad.element) ad.element.remove(); }
    adPanels = [];
    closedAdsCount = 0;
    isRedirectBlocked = false;
    redirectOverlayActive = false;
    for (let i = 0; i < 5; i++) { 
      adPanels.push(createAdPanel()); 
    }
    startFlyingAnimation();
  }
  
  // обработчик ресайза: корректируем положение плашек, чтобы не вылетали за пределы
  window.addEventListener("resize", () => {
    if(!redirectOverlayActive) {
      for(let ad of adPanels) {
        if(!ad.element) continue;
        let maxX = window.innerWidth - ad.element.offsetWidth;
        let maxY = window.innerHeight - ad.element.offsetHeight;
        if (ad.x > maxX) ad.x = Math.max(0, maxX);
        if (ad.y > maxY) ad.y = Math.max(0, maxY);
        ad.element.style.left = ad.x + 'px';
        ad.element.style.top = ad.y + 'px';
        if (ad.x <= 0) ad.vx = Math.abs(ad.vx);
        if (ad.x + ad.element.offsetWidth >= window.innerWidth) ad.vx = -Math.abs(ad.vx);
        if (ad.y <= 0) ad.vy = Math.abs(ad.vy);
        if (ad.y + ad.element.offsetHeight >= window.innerHeight) ad.vy = -Math.abs(ad.vy);
      }
    }
    renderSchedule();
  });
  
  // Запуск всего
  renderSchedule();
  initAds();
</script>

</body>
