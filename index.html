<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
<title>Расписание — летающие рекламные плашки (DVD-эффект)</title>

<style>
  /* ===== ОРИГИНАЛЬНЫЙ СТИЛЬ РАСПИСАНИЯ ===== */
  * { box-sizing: border-box; }
  body { margin: 0; padding: 0; font-family: system-ui, Arial, sans-serif; background: #121212; color: #e5e5e5; min-height: 100vh; position: relative; }
  header { text-align: center; padding: 18px; font-size: 22px; background: #1c1c1c; border-bottom: 1px solid #2a2a2a; }
  .container { max-width: 900px; margin: 0 auto; padding: 14px; position: relative; z-index: 1; }
  .card { background: #1c1c1c; border-radius: 10px; padding: 14px 16px; margin-bottom: 12px; border: 1px solid #2a2a2a; }
  .card .time { opacity: 0.7; font-size: 14px; margin-bottom: 4px; }
  .card .subject { font-size: 17px; font-weight: 500; }
  .day-title { font-size: 19px; margin: 20px 0 10px; opacity: 0.85; }
  .btns { display: flex; gap: 10px; margin-top: 20px; margin-bottom: 20px; }
  button { flex: 1; padding: 14px 0; background: #2d2d2d; border: none; border-radius: 8px; color: #e5e5e5; font-size: 16px; cursor: pointer; }
  button:active { background: #3a3a3a; }
  @media (min-width: 750px) { .card { display: none; } table { display: table; } }
  table { width: 100%; border-collapse: collapse; background: #1c1c1c; margin-bottom: 20px; border-radius: 10px; overflow: hidden; }
  th, td { padding: 12px; border-bottom: 1px solid #2a2a2a; text-align: center; }
  th { background: #222; font-weight: 600; }

  /* ===== РЕКЛАМНЫЕ ПЛАШКИ (ориг) ===== */
  .ad-float { position: fixed; background: #0a0a0a; border: 3px solid white; border-radius: 20px; box-shadow: 0 0 20px rgba(255,255,255,0.3); z-index: 1000; overflow: hidden; backdrop-filter: blur(4px); max-width: 260px; width: auto; min-width: 140px; will-change: left, top; cursor: default; }
  .ad-inner { position: relative; display: block; width: 100%; }
  .ad-img { width: 100%; height: auto; display: block; cursor: pointer; object-fit: cover; }
  .close-corner { position: absolute; top: 4px; right: 6px; background: #cc3333; border: none; color: white; font-size: 18px; width: 30px; height: 30px; border-radius: 30px; cursor: pointer; display: flex; align-items: center; justify-content: center; z-index: 20; font-family: monospace; }
  .ad-float.hidden-temp { display: none; }

  /* Пиксельный распад */
  .pixel-dust { position: fixed; width: 100%; height: 100%; top: 0; left: 0; pointer-events: none; z-index: 10001; }
  .pixel { position: absolute; background-color: #ffffff; border-radius: 2px; pointer-events: none; animation: flyAway 0.4s ease-out forwards; box-shadow: 0 0 4px rgba(255,255,255,0.8); }
  @keyframes flyAway { 0% { transform: translate(0, 0) rotate(0deg); opacity: 1; } 100% { transform: translate(var(--dx), var(--dy)) rotate(360deg); opacity: 0; } }

  /* ТАРИФЫ (ориг) */
  .tariff-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #0a0c12; z-index: 20000; overflow-y: auto; padding: 20px; backdrop-filter: blur(10px); animation: fadeIn 0.3s; }
  .tariff-container { max-width: 600px; margin: 0 auto; }
  .tariff-title { font-size: 28px; text-align: center; margin: 20px 0; color: #ffffff; text-transform: uppercase; letter-spacing: 2px; }
  .tariff-card { background: #1a1e2a; border-radius: 24px; padding: 20px; margin-bottom: 20px; border: 2px solid #ffffff; }
  .buy-btn { background: #1a1e2a; border: 2px solid white; color: white; padding: 12px 20px; border-radius: 40px; font-size: 18px; cursor: pointer; width: 100%; margin-top: 10px; }
  .order-form { background: #0f111a; border-radius: 24px; padding: 20px; border: 1px solid #333; }
  .order-form input, .order-form select { width: 100%; padding: 12px; margin: 8px 0; background: #1e2230; border: 1px solid #3a3e50; color: white; border-radius: 12px; }
  .invoice { background: #0a0c16; padding: 16px; border-radius: 16px; margin: 15px 0; border: 1px solid #333; }
  .invoice-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #2a2e3e; color: #dddddd; }

  /* ===== НОВАЯ ЛУДОМАНИЯ (ФИОЛЕТОВАЯ ТЕМА) ===== */
  .kill-ads-btn { position: fixed; top: 10px; left: 10px; z-index: 9999; background: #000; border: 1px solid #fff; color: #fff; padding: 8px 12px; font-size: 12px; cursor: pointer; text-transform: uppercase; border-radius: 5px; }
  .kill-ads-btn span { text-decoration: line-through; color: #ff4444; margin-right: 4px; }

  #ludo-screen { position: fixed; inset: 0; background: #0f0f0f; z-index: 10500; display: none; flex-direction: column; align-items: center; padding: 20px; overflow-y: auto; }
  .wheel-container { position: relative; width: 260px; height: 260px; border: 8px solid #222; border-radius: 50%; background: #1a1a1a; margin: 20px 0; overflow: hidden; flex-shrink: 0; }
  .wheel-fill { position: absolute; bottom: 0; width: 100%; background: #8a2be2; opacity: 0.8; transition: height 0.3s ease; z-index: 1; }
  .wheel-percent { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 44px; font-weight: 900; color: #fff; text-shadow: 0 0 10px #000; z-index: 5; pointer-events: none; }
  
  #spinner-arrow-wrap { position: absolute; inset: 0; z-index: 6; transition: transform 3s cubic-bezier(0.15, 0, 0.15, 1); }
  .arrow-line { position: absolute; top: 10px; left: 50%; width: 4px; height: 40px; background: #fff; transform: translateX(-50%); border-radius: 2px; box-shadow: 0 0 10px #fff; }

  .chance-btns { display: flex; gap: 10px; margin-bottom: 20px; }
  .chance-btn { background: #1a1a1a; border: 2px solid #333; color: #fff; padding: 10px 18px; border-radius: 8px; cursor: pointer; transition: 0.2s; }
  .chance-btn.active { border-color: #8a2be2; background: #25103d; }

  #upgrade-btn { background: #8a2be2; color: #fff; border: none; padding: 16px 50px; font-size: 20px; border-radius: 50px; cursor: pointer; font-weight: bold; text-transform: uppercase; box-shadow: 0 0 20px rgba(138, 43, 226, 0.5); transition: 0.3s; }
  #upgrade-btn:hover { box-shadow: 0 0 30px rgba(138, 43, 226, 0.8); transform: scale(1.05); }
  #upgrade-btn:disabled { background: #444; box-shadow: none; transform: none; cursor: not-allowed; }

  .inventory-wrap { width: 100%; max-width: 500px; background: #161616; border: 2px solid #333; padding: 15px; border-radius: 15px; margin-top: 20px; }
  .inventory-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 10px; }
  .inv-item { background: #222; border: 2px solid #333; padding: 10px; border-radius: 10px; text-align: center; cursor: pointer; transition: 0.2s; min-height: 90px; display: flex; flex-direction: column; justify-content: center; }
  .inv-item.selected { border-color: #8a2be2; background: #25103d; box-shadow: inset 0 0 10px rgba(138, 43, 226, 0.3); }
  .item-name { font-size: 11px; margin-bottom: 5px; color: #aaa; }
  .item-price { font-size: 15px; font-weight: bold; color: #fff; }
</style>
</head>
<body>

<button class="kill-ads-btn" onclick="destroyAdsSequence()"><span>AD</span> откл рекламу</button>

<header id="main-header">Дима пьяный украинец</header>

<div class="container" id="main-container">
  <div id="content"></div>
  <div class="btns">
    <button onclick="prevDay()">← Пред.</button>
    <button onclick="toggleAll()" id="toggleBtn">Все дни</button>
    <button onclick="nextDay()">След. →</button>
  </div>
</div>

<div id="ludo-screen">
  <div class="tariff-title" style="color:#8a2be2; margin-bottom:10px;">ЛУДОМАНИЯ UPGRADER</div>
  
  <div class="wheel-container">
    <div id="spinner-arrow-wrap"><div class="arrow-line"></div></div>
    <div class="wheel-fill" id="fill-level"></div>
    <div class="wheel-percent" id="display-percent">50%</div>
  </div>

  <div class="chance-btns">
    <button class="chance-btn" onclick="setChance(50)" id="btn50">50%</button>
    <button class="chance-btn" onclick="setChance(20)" id="btn20">20%</button>
    <button class="chance-btn" onclick="setChance(10)" id="btn10">10%</button>
  </div>

  <button id="upgrade-btn" onclick="startUpgrade()">ПРОКАЧАТЬ</button>

  <div class="inventory-wrap">
    <div style="font-size: 12px; margin-bottom: 10px; opacity: 0.5;">ИНВЕНТАРЬ:</div>
    <div class="inventory-grid" id="inv-grid"></div>
  </div>
  
  <div style="margin-top: 30px; opacity: 0.3; font-size: 10px; cursor:pointer;" onclick="location.reload()">НАЗАД К УЧЕБЕ</div>
</div>

<script>
  // ========== РАСПИСАНИЕ (ОРИГИНАЛ) ==========
  const schedules = {"понедельник": ["Разговоры о лудомании", "История", "Физкультура", "Алгебра", "География", "Обществознание", "Иностранный язык"],"вторник": ["Литература", "Русский язык", "ОБЖ", "Алгебра", "Физика", "Иностранный язык", "История"],"среда": ["Русский язык", "Литература", "География", "Химия", "Информатика", "Физкультура", "Труд"],"четверг": ["кейс батл", "Алгебра", "Геометрия", "Физика", "Биология", "Русский язык", "Литература"],"пятница": ["Вероятность и статистика", "Геометрия", "История", "Химия", "Биология", "Физика", "Иностранный язык"]};
  const times = ["8:30–9:15","9:35–10:20","10:40–11:25","11:50–12:35","12:55–13:40","13:50–14:35","14:40–15:25"];
  const days = ["понедельник","вторник","среда","четверг","пятница"];
  let dayIndex = (() => { let idx = new Date().getDay() - 1; return (idx >= 0 && idx <= 4) ? idx : 0; })();
  let showAll = false;

  function addCell(row, text, isHead) { let cell = document.createElement(isHead ? "th" : "td"); cell.textContent = text; row.appendChild(cell); }
  function renderDayBlock(container, day) {
    let title = document.createElement("div"); title.className = "day-title"; title.textContent = day.charAt(0).toUpperCase() + day.slice(1); container.appendChild(title);
    for (let i = 0; i < schedules[day].length; i++) {
      let card = document.createElement("div"); card.className = "card";
      card.innerHTML = `<div class="time">${times[i]}</div><div class="subject">${schedules[day][i]}</div>`;
      container.appendChild(card);
    }
    if (window.innerWidth >= 750) {
      let table = document.createElement("table"); let thead = document.createElement("tr");
      addCell(thead, "#", true); addCell(thead, "Время", true); addCell(thead, "Предмет", true); table.appendChild(thead);
      for (let i = 0; i < schedules[day].length; i++) {
        let row = document.createElement("tr"); addCell(row, i + 1, false); addCell(row, times[i], false); addCell(row, schedules[day][i], false); table.appendChild(row);
      }
      container.appendChild(table);
    }
  }
  function renderSchedule() { let root = document.getElementById("content"); root.innerHTML = ""; document.getElementById("toggleBtn").textContent = showAll ? "Один день" : "Все дни"; if (showAll) { for (let d of days) renderDayBlock(root, d); } else { renderDayBlock(root, days[dayIndex]); } }
  window.prevDay = () => { dayIndex = (dayIndex - 1 + days.length) % days.length; showAll = false; renderSchedule(); };
  window.nextDay = () => { dayIndex = (dayIndex + 1) % days.length; showAll = false; renderSchedule(); };
  window.toggleAll = () => { showAll = !showAll; renderSchedule(); };

  // ========== РЕКЛАМА (ОРИГИНАЛ) ==========
  const adCampaigns = [{ img: "images/casebattle.png", link: "https://case-battle.red/", alt: "Case Battle" },{ img: "images/upgrader.png", link: "https://upgrader.pro/ru", alt: "Upgrader Pro" },{ img: "images/gosuslugi.png", link: "https://contract.gosuslugi.ru/", alt: "Госуслуги" }];
  let adPanels = [];
  let closedAdsCount = 0;
  let tariffOverlayActive = false;

  function updateAdPosition(ad) {
    if (!ad.element || ad.isClosing || ad.element.style.display === 'none') return;
    let rect = ad.element.getBoundingClientRect();
    let newX = ad.x + ad.vx, newY = ad.y + ad.vy;
    if (newX <= 0 || newX + rect.width >= window.innerWidth) ad.vx *= -1;
    if (newY <= 0 || newY + rect.height >= window.innerHeight) ad.vy *= -1;
    ad.x += ad.vx; ad.y += ad.vy;
    ad.element.style.left = ad.x + 'px'; ad.element.style.top = ad.y + 'px';
  }

  function startFlyingAnimation() {
    function animate() {
      for (let ad of adPanels) if (!tariffOverlayActive) updateAdPosition(ad);
      requestAnimationFrame(animate);
    }
    animate();
  }

  function createAdPanel() {
    const div = document.createElement("div"); div.className = "ad-float";
    div.innerHTML = `<div class="ad-inner"><img class="ad-img" src="${adCampaigns[0].img}"><button class="close-corner">✖</button></div>`;
    document.body.appendChild(div);
    const adObj = { element: div, x: Math.random()*100, y: Math.random()*100, vx: 1.5, vy: 1.5, isClosing: false };
    div.querySelector('.close-corner').onclick = () => {
      closedAdsCount++;
      div.remove();
      if(closedAdsCount >= 3) showTariffMenu();
    };
    return adObj;
  }

  // ========== ЛУДОМАНИЯ (НОВАЯ МЕХАНИКА) ==========
  const itemNames = ["Сифилис", "Твои яйца", "Мама", "Девственность", "Сиськи", "Геморрой", "Грибок", "ВИЧ+", "Кровь", "Шиза", "Очко", "Запор"];
  let inventory = [];
  let selectedIdx = null;
  let currentChance = 50;
  let isSpinning = false;

  function destroyAdsSequence() {
    const dust = document.createElement('div'); dust.className = 'pixel-dust'; document.body.appendChild(dust);
    for(let i=0; i<150; i++){
      const p = document.createElement('div'); p.className = 'pixel';
      p.style.left = Math.random()*100+'%'; p.style.top = Math.random()*100+'%';
      p.style.width = '12px'; p.style.height = '12px';
      p.style.setProperty('--dx', (Math.random()-0.5)*1200+'px');
      p.style.setProperty('--dy', (Math.random()-0.5)*1200+'px');
      dust.appendChild(p);
    }
    setTimeout(() => {
      document.getElementById('main-header').style.display = 'none';
      document.getElementById('main-container').style.display = 'none';
      document.querySelectorAll('.ad-float').forEach(a => a.remove());
      document.querySelector('.kill-ads-btn').style.display = 'none';
      document.getElementById('ludo-screen').style.display = 'flex';
      initLudo();
    }, 450);
  }

  function initLudo() {
    inventory = [
      { name: itemNames[Math.floor(Math.random()*itemNames.length)], price: Math.floor(Math.random()*250)+20 },
      { name: itemNames[Math.floor(Math.random()*itemNames.length)], price: Math.floor(Math.random()*250)+20 },
      { name: itemNames[Math.floor(Math.random()*itemNames.length)], price: Math.floor(Math.random()*250)+20 }
    ];
    setChance(50);
    renderInv();
  }

  function renderInv() {
    const grid = document.getElementById('inv-grid'); grid.innerHTML = '';
    inventory.forEach((it, i) => {
      const div = document.createElement('div');
      div.className = `inv-item ${selectedIdx === i ? 'selected' : ''}`;
      div.onclick = () => { if(!isSpinning) { selectedIdx = i; renderInv(); } };
      div.innerHTML = `<div class="item-name">${it.name}</div><div class="item-price">${it.price} ₴</div>`;
      grid.appendChild(div);
    });
  }

  function setChance(c) {
    if(isSpinning) return;
    currentChance = c;
    document.getElementById('display-percent').innerText = c + '%';
    document.getElementById('fill-level').style.height = c + '%';
    [10,20,50].forEach(v => document.getElementById('btn'+v).classList.remove('active'));
    document.getElementById('btn'+c).classList.add('active');
  }

  function startUpgrade() {
    if(selectedIdx === null || isSpinning) return;
    isSpinning = true;
    document.getElementById('upgrade-btn').disabled = true;

    const wrap = document.getElementById('spinner-arrow-wrap');
    wrap.style.transition = 'none';
    wrap.style.transform = 'rotate(0deg)';

    setTimeout(() => {
      const totalDeg = 1800 + Math.floor(Math.random()*360);
      wrap.style.transition = 'transform 3s cubic-bezier(0.15, 0, 0.15, 1)';
      wrap.style.transform = `rotate(${totalDeg}deg)`;

      setTimeout(() => {
        const finalDeg = totalDeg % 360;
        // Расчет: фиолетовая зона внизу. 0 град - стрелка вверх.
        // Фиолетовая зона при шансе 50% занимает низ (от 90 до 270 град примерно)
        // Но по твоей логике затирки: просто шанс.
        const win = Math.random()*100 <= currentChance;

        if(win) {
          const it = inventory[selectedIdx];
          it.price = Math.round(it.price * (100/currentChance));
          it.name = itemNames[Math.floor(Math.random()*itemNames.length)] + "+";
          alert("КРАСАВА! ПРОКАЧАЛ!");
          // Добавляем новый предмет при победе
          inventory.push({ name: itemNames[Math.floor(Math.random()*itemNames.length)], price: Math.floor(Math.random()*100)+10 });
        } else {
          alert("ПРОЕБАЛ! ПРЕДМЕТ СГОРЕЛ.");
          inventory.splice(selectedIdx, 1);
          selectedIdx = null;
        }

        if(inventory.length === 0) {
          alert("ТЫ БОМЖ. На косарь, купи се че нить.");
          initLudo();
        }

        isSpinning = false;
        document.getElementById('upgrade-btn').disabled = false;
        renderInv();
      }, 3100);
    }, 50);
  }

  // Запуск
  renderSchedule();
  for(let i=0; i<3; i++) adPanels.push(createAdPanel());
  startFlyingAnimation();
</script>
</body>
</html>
