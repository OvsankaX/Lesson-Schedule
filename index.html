<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
<title>Расписание — реклама с анимацией распада</title>

<style>
  /* ===== ОРИГИНАЛЬНЫЙ СТИЛЬ РАСПИСАНИЯ (НЕ СДВИГАЕТСЯ) ===== */
  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    padding: 0;
    font-family: system-ui, Arial, sans-serif;
    background: #121212;
    color: #e5e5e5;
    min-height: 100vh;
    position: relative;
  }

  header {
    text-align: center;
    padding: 18px;
    font-size: 22px;
    background: #1c1c1c;
    border-bottom: 1px solid #2a2a2a;
  }

  /* ЦЕНТРИРУЕМ ТАБЛИЦУ — ВСЕГДА ПО СЕРЕДИНЕ */
  .container {
    max-width: 900px;
    margin: 0 auto;
    padding: 14px;
    position: relative;
    z-index: 1;
    background: transparent;
  }

  .card {
    background: #1c1c1c;
    border-radius: 10px;
    padding: 14px 16px;
    margin-bottom: 12px;
    border: 1px solid #2a2a2a;
  }

  .card .time {
    opacity: 0.7;
    font-size: 14px;
    margin-bottom: 4px;
  }

  .card .subject {
    font-size: 17px;
    font-weight: 500;
  }

  .day-title {
    font-size: 19px;
    margin: 20px 0 10px;
    opacity: 0.85;
  }

  .btns {
    display: flex;
    gap: 10px;
    margin-top: 20px;
    margin-bottom: 20px;
  }

  button {
    flex: 1;
    padding: 14px 0;
    background: #2d2d2d;
    border: none;
    border-radius: 8px;
    color: #e5e5e5;
    font-size: 16px;
    cursor: pointer;
  }

  button:active {
    background: #3a3a3a;
  }

  @media (min-width: 750px) {
    .card { display: none; }
    table { display: table; }
  }

  table {
    width: 100%;
    border-collapse: collapse;
    background: #1c1c1c;
    margin-bottom: 20px;
    border-radius: 10px;
    overflow: hidden;
  }

  th, td {
    padding: 12px;
    border-bottom: 1px solid #2a2a2a;
    text-align: center;
  }

  th {
    background: #222;
    font-weight: 600;
  }

  /* ===== РЕКЛАМНЫЕ ПЛАШКИ (РАНДОМНЫЕ ПОЗИЦИИ + АНИМАЦИИ) ===== */
  .ad-float {
    position: fixed;
    background: #0a0a0a;
    border: 3px solid white;
    border-radius: 20px;
    box-shadow: 0 0 20px rgba(255,255,200,0.4);
    z-index: 10000;
    overflow: hidden;
    cursor: default;
    backdrop-filter: blur(4px);
    max-width: 260px;
    width: auto;
    min-width: 140px;
    will-change: transform, opacity;
    /* Анимация появления */
    animation: popIn 0.2s cubic-bezier(0.34, 1.2, 0.64, 1);
  }

  /* Анимация выстрела-появления */
  @keyframes popIn {
    0% {
      transform: scale(0.2) rotate(-10deg);
      opacity: 0;
    }
    80% {
      transform: scale(1.1) rotate(2deg);
    }
    100% {
      transform: scale(1) rotate(0deg);
      opacity: 1;
    }
  }

  /* Анимация схлопывания (scale to 0) */
  .ad-float.closing-scale {
    animation: scaleOut 0.15s ease-in forwards !important;
    pointer-events: none;
  }

  @keyframes scaleOut {
    0% {
      transform: scale(1);
      opacity: 1;
    }
    100% {
      transform: scale(0);
      opacity: 0;
    }
  }

  /* Пиксельный распад — для упоротости */
  .pixel-dust {
    position: fixed;
    width: 100%;
    height: 100%;
    top: 0;
    left: 0;
    pointer-events: none;
    z-index: 10001;
  }
  
  .pixel {
    position: absolute;
    background-color: #fff;
    border-radius: 2px;
    pointer-events: none;
    animation: flyAway 0.4s ease-out forwards;
    box-shadow: 0 0 5px rgba(255,100,0,0.8);
  }
  
  @keyframes flyAway {
    0% {
      transform: translate(0, 0) rotate(0deg);
      opacity: 1;
    }
    100% {
      transform: translate(var(--dx), var(--dy)) rotate(360deg);
      opacity: 0;
    }
  }

  @media (max-width: 700px) {
    .ad-float {
      max-width: 180px;
      border-width: 2px;
    }
    .close-corner {
      width: 26px;
      height: 26px;
      font-size: 16px;
    }
  }

  .ad-inner {
    position: relative;
    display: block;
    width: 100%;
  }

  .ad-img {
    width: 100%;
    height: auto;
    display: block;
    cursor: pointer;
    object-fit: cover;
  }

  .close-corner {
    position: absolute;
    top: 4px;
    right: 6px;
    background: #cc3333;
    border: none;
    color: white;
    font-size: 18px;
    font-weight: bold;
    width: 30px;
    height: 30px;
    border-radius: 30px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 0 4px black;
    z-index: 20;
    font-family: monospace;
    transition: 0.05s linear;
  }

  .close-corner:active {
    background: #ff6666;
  }

  .ad-float.hidden-temp {
    display: none;
  }
</style>
</head>
<body>

<header>Дима пьяный украинец</header>

<div class="container">
  <div id="content"></div>
  <div class="btns">
    <button onclick="prevDay()">← Пред.</button>
    <button onclick="toggleAll()" id="toggleBtn">Все дни</button>
    <button onclick="nextDay()">След. →</button>
  </div>
</div>

<script>
  // ========== РАСПИСАНИЕ ==========
  const schedules = {
    "понедельник": ["Разговоры о какашках", "История", "Физкультура", "Алгебра", "География", "Обществознание", "Иностранный язык"],
    "вторник": ["Литература", "Русский язык", "ОБЖ", "Алгебра", "Физика", "Иностранный язык", "История"],
    "среда": ["Русский язык", "Литература", "География", "Химия", "Информатика", "Физкультура", "Труд"],
    "четверг": ["Говно фуууу", "Алгебра", "Геометрия", "Физика", "Биология", "Русский язык", "Литература"],
    "пятница": ["Вероятность и статистика", "Геометрия", "История", "Химия", "Биология", "Физика", "Иностранный язык"]
  };
  const times = ["8:30–9:15","9:35–10:20","10:40–11:25","11:50–12:35","12:55–13:40","13:50–14:35","14:40–15:25"];
  const days = ["понедельник","вторник","среда","четверг","пятница"];
  let dayIndex = (() => {
    let idx = new Date().getDay() - 1;
    return (idx >= 0 && idx <= 4) ? idx : 0;
  })();
  let showAll = false;

  function addCell(row, text, isHead) {
    let cell = document.createElement(isHead ? "th" : "td");
    cell.textContent = text;
    row.appendChild(cell);
  }

  function renderDayBlock(container, day) {
    let title = document.createElement("div");
    title.className = "day-title";
    title.textContent = day.charAt(0).toUpperCase() + day.slice(1);
    container.appendChild(title);
    for (let i = 0; i < schedules[day].length; i++) {
      let card = document.createElement("div");
      card.className = "card";
      let tSpan = document.createElement("div");
      tSpan.className = "time";
      tSpan.textContent = times[i];
      let sSpan = document.createElement("div");
      sSpan.className = "subject";
      sSpan.textContent = schedules[day][i];
      card.appendChild(tSpan);
      card.appendChild(sSpan);
      container.appendChild(card);
    }
    if (window.innerWidth >= 750) {
      let table = document.createElement("table");
      let thead = document.createElement("tr");
      addCell(thead, "#", true);
      addCell(thead, "Время", true);
      addCell(thead, "Предмет", true);
      table.appendChild(thead);
      for (let i = 0; i < schedules[day].length; i++) {
        let row = document.createElement("tr");
        addCell(row, i + 1, false);
        addCell(row, times[i], false);
        addCell(row, schedules[day][i], false);
        table.appendChild(row);
      }
      container.appendChild(table);
    }
  }

  function renderSchedule() {
    let root = document.getElementById("content");
    root.innerHTML = "";
    document.getElementById("toggleBtn").textContent = showAll ? "Один день" : "Все дни";
    if (showAll) {
      for (let d of days) renderDayBlock(root, d);
    } else {
      renderDayBlock(root, days[dayIndex]);
    }
  }

  window.prevDay = () => { dayIndex = (dayIndex - 1 + days.length) % days.length; showAll = false; renderSchedule(); };
  window.nextDay = () => { dayIndex = (dayIndex + 1) % days.length; showAll = false; renderSchedule(); };
  window.toggleAll = () => { showAll = !showAll; renderSchedule(); };

  // ========== РЕКЛАМА: РАЗЛЕТ НА ПИКСЕЛИ ИЛИ SCALE (УПОРОТО) ==========
  const adCampaigns = [
    { img: "images/casebattle.png",   link: "https://case-battle.red/",     alt: "Case Battle" },
    { img: "images/upgrader.png",     link: "https://upgrader.pro/ru",      alt: "Upgrader Pro" },
    { img: "images/gosuslugi.png",    link: "https://contract.gosuslugi.ru/", alt: "Госуслуги" }
  ];

  const AD_COUNT = 5;
  let adPanels = [];

  // Получить случайную позицию
  function getRandomPosition(adElement) {
    if (!adElement) return { left: 20, top: 20 };
    const rect = adElement.getBoundingClientRect();
    const adWidth = rect.width || 180;
    const adHeight = rect.height || 140;
    const maxX = Math.max(20, window.innerWidth - adWidth - 20);
    const maxY = Math.max(20, window.innerHeight - adHeight - 20);
    let left = Math.random() * maxX;
    let top = Math.random() * maxY;
    if (Math.random() > 0.7) left = 10;
    if (Math.random() > 0.8) left = window.innerWidth - adWidth - 10;
    if (Math.random() > 0.85) top = 10;
    if (Math.random() > 0.85) top = window.innerHeight - adHeight - 10;
    left = Math.min(Math.max(5, left), window.innerWidth - adWidth - 5);
    top = Math.min(Math.max(5, top), window.innerHeight - adHeight - 5);
    return { left, top };
  }

  function relocateAd(ad) {
    if (!ad || !ad.element) return;
    const pos = getRandomPosition(ad.element);
    ad.element.style.left = pos.left + "px";
    ad.element.style.top = pos.top + "px";
    ad.element.style.right = "auto";
    ad.element.style.bottom = "auto";
  }

  function updateAdImage(ad) {
    const campaign = adCampaigns[ad.imageIndex % adCampaigns.length];
    if (ad.imgElement) {
      ad.imgElement.src = campaign.img;
      ad.imgElement.alt = campaign.alt;
      ad.imgElement.onclick = (e) => {
        e.preventDefault();
        e.stopPropagation();
        window.open(campaign.link, "_blank");
      };
    }
  }

  // Эффект пиксельного распада (как в PowerPoint)
  function pixelExplode(element, callback) {
    if (!element) {
      if (callback) callback();
      return;
    }
    const rect = element.getBoundingClientRect();
    const width = rect.width;
    const height = rect.height;
    const left = rect.left;
    const top = rect.top;
    
    // Создаём контейнер для пикселей
    const dustContainer = document.createElement('div');
    dustContainer.className = 'pixel-dust';
    document.body.appendChild(dustContainer);
    
    const pixelSize = 8; // размер пикселя
    const cols = Math.ceil(width / pixelSize);
    const rows = Math.ceil(height / pixelSize);
    const totalPixels = cols * rows;
    let pixelsCreated = 0;
    
    // Делаем элемент временно прозрачным, но не удаляем, чтобы пиксели сняли копию
    const originalVisibility = element.style.visibility;
    const originalOpacity = element.style.opacity;
    element.style.visibility = 'hidden';
    element.style.opacity = '0';
    
    for (let i = 0; i < cols; i++) {
      for (let j = 0; j < rows; j++) {
        const pixel = document.createElement('div');
        pixel.className = 'pixel';
        const x = left + i * pixelSize;
        const y = top + j * pixelSize;
        pixel.style.left = x + 'px';
        pixel.style.top = y + 'px';
        pixel.style.width = pixelSize + 'px';
        pixel.style.height = pixelSize + 'px';
        // случайный цвет на основе исходной плашки (берём из бекграунда)
        pixel.style.backgroundColor = `#ffffff`;
        pixel.style.boxShadow = '0 0 3px orange';
        // случайное направление разлета
        const angle = Math.random() * Math.PI * 2;
        const distance = 80 + Math.random() * 150;
        const dx = Math.cos(angle) * distance;
        const dy = Math.sin(angle) * distance;
        pixel.style.setProperty('--dx', dx + 'px');
        pixel.style.setProperty('--dy', dy + 'px');
        dustContainer.appendChild(pixel);
        pixelsCreated++;
        
        // удаляем пиксели после анимации
        setTimeout(() => {
          if (pixel && pixel.remove) pixel.remove();
        }, 450);
      }
    }
    
    // Удаляем контейнер через полсекунды
    setTimeout(() => {
      if (dustContainer && dustContainer.remove) dustContainer.remove();
    }, 500);
    
    // Вызываем коллбэк после начала анимации
    setTimeout(() => {
      if (callback) callback();
    }, 50);
  }
  
  // Быстрое схлопывание scale (альтернатива)
  function scaleOutAndRemove(element, callback) {
    if (!element) {
      if (callback) callback();
      return;
    }
    element.classList.add('closing-scale');
    setTimeout(() => {
      if (callback) callback();
    }, 150);
  }

  // Глобальный флаг: использовать ли пиксельный распад (True = ультра упорото, false = scale)
  let usePixelExplode = true;  // можно по желанию переключить, оставлю true для кайфа

  // МГНОВЕННОЕ ЗАКРЫТИЕ с анимацией распада/схлопывания
  function closeAdWithAnimation(ad, onComplete) {
    if (!ad || !ad.element) {
      if (onComplete) onComplete();
      return;
    }
    const element = ad.element;
    // Отключаем клики на время анимации
    element.style.pointerEvents = 'none';
    // Запоминаем, что плашка закрывается (чтобы повторно не кликнули)
    if (ad.isClosing) return;
    ad.isClosing = true;
    
    const afterAnimation = () => {
      // Полностью скрываем и меняем картинку
      element.classList.add('hidden-temp');
      element.style.visibility = 'hidden';
      element.style.opacity = '0';
      element.classList.remove('closing-scale');
      // Сбрасываем стили для следующего появления
      element.style.pointerEvents = '';
      
      // Меняем картинку на следующую (цикл)
      ad.imageIndex = (ad.imageIndex + 1) % adCampaigns.length;
      updateAdImage(ad);
      
      // Случайное новое место
      relocateAd(ad);
      
      // Убираем классы анимации
      element.classList.remove('hidden-temp');
      // Убираем флаг
      ad.isClosing = false;
      // Показываем с анимацией появления
      element.style.visibility = 'visible';
      element.style.opacity = '1';
      // Перезапуск анимации появления
      element.style.animation = 'none';
      element.offsetHeight; // рефлоу
      element.style.animation = 'popIn 0.2s cubic-bezier(0.34, 1.2, 0.64, 1)';
      
      if (onComplete) onComplete();
    };
    
    // Выбираем эффект: пиксели или скейл
    if (usePixelExplode) {
      pixelExplode(element, afterAnimation);
      // Дополнительно скрываем оригинал почти мгновенно, чтобы пиксели были видны
      element.style.visibility = 'hidden';
      element.style.opacity = '0';
      // НО afterAnimation сработает через небольшую задержку, где обновим данные
      setTimeout(() => {
        if (!ad.isClosing) return;
        afterAnimation();
      }, 200);
    } else {
      scaleOutAndRemove(element, afterAnimation);
    }
  }

  // Создание плашки
  function createAdPanel() {
    const div = document.createElement("div");
    div.className = "ad-float";
    
    const inner = document.createElement("div");
    inner.className = "ad-inner";
    
    const img = document.createElement("img");
    img.className = "ad-img";
    
    const closeBtn = document.createElement("button");
    closeBtn.className = "close-corner";
    closeBtn.textContent = "✖";
    
    inner.appendChild(img);
    inner.appendChild(closeBtn);
    div.appendChild(inner);
    document.body.appendChild(div);
    
    const startIdx = Math.floor(Math.random() * adCampaigns.length);
    const adObj = {
      element: div,
      imgElement: img,
      closeBtn: closeBtn,
      imageIndex: startIdx,
      isClosing: false
    };
    
    updateAdImage(adObj);
    relocateAd(adObj);
    
    // КЛИК ПО КРЕСТИКУ — МГНОВЕННО ЗАКРЫВАЕТСЯ С АНИМАЦИЕЙ
    closeBtn.addEventListener("click", (e) => {
      e.stopPropagation();
      if (adObj.isClosing) return; // уже анимируем
      closeAdWithAnimation(adObj);
    });
    
    return adObj;
  }
  
  function relocateAllAds() {
    for (let ad of adPanels) {
      if (ad && ad.element && !ad.isClosing) {
        relocateAd(ad);
      }
    }
  }
  
  function initAds() {
    // удаляем старые
    for (let ad of adPanels) {
      if (ad && ad.element) ad.element.remove();
    }
    adPanels = [];
    for (let i = 0; i < AD_COUNT; i++) {
      const newAd = createAdPanel();
      adPanels.push(newAd);
    }
  }
  
  // Ресайз: переставляем плашки
  let resizeTimeout = null;
  window.addEventListener("resize", () => {
    if (resizeTimeout) clearTimeout(resizeTimeout);
    resizeTimeout = setTimeout(() => {
      relocateAllAds();
      renderSchedule();
    }, 150);
  });
  
  // Периодическое перемещение плашек (каждые 25 секунд для веселья)
  setInterval(() => {
    for (let ad of adPanels) {
      if (ad && ad.element && !ad.isClosing) {
        relocateAd(ad);
        // добавим лёгкий эффект "встряски"
        ad.element.style.animation = 'none';
        ad.element.offsetHeight;
        ad.element.style.animation = 'popIn 0.2s cubic-bezier(0.34, 1.2, 0.64, 1)';
      }
    }
  }, 25000);
  
  // Запуск
  renderSchedule();
  initAds();
  
  console.log("🔥 Супер упоротая реклама: разлетается на пиксели (или скейл), появляется с выстрелом, закрывается мгновенно!");
</script>

</body>
</html>
