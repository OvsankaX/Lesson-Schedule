<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
<title>Расписание — Лудомания Edition</title>

<style>
  /* ===== ОРИГИНАЛЬНЫЙ СТИЛЬ ===== */
  * { box-sizing: border-box; }
  body { margin: 0; padding: 0; font-family: system-ui, Arial, sans-serif; background: #121212; color: #e5e5e5; min-height: 100vh; position: relative; overflow-x: hidden; }
  header { text-align: center; padding: 18px; font-size: 22px; background: #1c1c1c; border-bottom: 1px solid #2a2a2a; }
  .container { max-width: 900px; margin: 0 auto; padding: 14px; position: relative; z-index: 1; }
  .card { background: #1c1c1c; border-radius: 10px; padding: 14px 16px; margin-bottom: 12px; border: 1px solid #2a2a2a; }
  .card .time { opacity: 0.7; font-size: 14px; margin-bottom: 4px; }
  .card .subject { font-size: 17px; font-weight: 500; }
  .day-title { font-size: 19px; margin: 20px 0 10px; opacity: 0.85; }
  .btns { display: flex; gap: 10px; margin-top: 20px; margin-bottom: 20px; }
  button { flex: 1; padding: 14px 0; background: #2d2d2d; border: none; border-radius: 8px; color: #e5e5e5; font-size: 16px; cursor: pointer; }
  button:active { background: #3a3a3a; }
  
  table { width: 100%; border-collapse: collapse; background: #1c1c1c; margin-bottom: 20px; border-radius: 10px; overflow: hidden; display: none; }
  th, td { padding: 12px; border-bottom: 1px solid #2a2a2a; text-align: center; }
  th { background: #222; }
  @media (min-width: 750px) { .card { display: none; } table { display: table; } }

  /* ===== НОВАЯ КНОПКА ОТКЛЮЧЕНИЯ РЕКЛАМЫ ===== */
  .kill-ads-btn {
    position: fixed; top: 10px; left: 10px; z-index: 9999;
    background: #000; border: 1px solid #fff; color: #fff;
    padding: 8px 12px; font-size: 12px; cursor: pointer; border-radius: 4px;
    text-transform: uppercase; font-weight: bold;
  }
  .kill-ads-btn span { text-decoration: line-through; color: #ff4444; margin-right: 5px; }

  /* Рекламные плашки */
  .ad-float { position: fixed; background: #0a0a0a; border: 3px solid white; border-radius: 20px; z-index: 1000; overflow: hidden; max-width: 260px; will-change: left, top; }
  .ad-inner { position: relative; }
  .ad-img { width: 100%; height: auto; display: block; cursor: pointer; }
  .close-corner { position: absolute; top: 4px; right: 6px; background: #cc3333; border: none; color: white; width: 30px; height: 30px; border-radius: 30px; cursor: pointer; }

  /* Пиксельный распад */
  .pixel-dust { position: fixed; width: 100%; height: 100%; top: 0; left: 0; pointer-events: none; z-index: 11000; }
  .pixel { position: absolute; background-color: #ffffff; border-radius: 2px; animation: flyAway 0.5s ease-out forwards; }
  @keyframes flyAway { 0% { opacity: 1; } 100% { transform: translate(var(--dx), var(--dy)); opacity: 0; } }

  /* ===== ОКНО ЛУДОМАНИИ (UPGRADER) ===== */
  #ludo-screen {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: #0f0f0f; z-index: 10500; display: none; flex-direction: column; align-items: center; padding: 20px; overflow-y: auto;
  }
  .ludo-title { color: #fff; font-size: 24px; margin-bottom: 20px; text-transform: uppercase; letter-spacing: 2px; }
  
  /* Рулетка */
  .wheel-container {
    position: relative; width: 250px; height: 250px;
    border-radius: 50%; border: 8px solid #222;
    background: #1a1a1a; margin-bottom: 30px; overflow: hidden;
    display: flex; align-items: center; justify-content: center;
  }
  .wheel-fill {
    position: absolute; bottom: 0; left: 0; width: 100%;
    background: #8a2be2; /* Фиолетовый */
    height: 0%; transition: height 0.3s ease;
    z-index: 1; opacity: 0.6;
  }
  .wheel-percent { position: relative; z-index: 3; font-size: 40px; font-weight: 800; color: #fff; text-shadow: 0 0 10px #000; }
  .wheel-arrow {
    position: absolute; top: -15px; left: 50%; transform: translateX(-50%);
    width: 0; height: 0; border-left: 15px solid transparent; border-right: 15px solid transparent;
    border-top: 25px solid #fff; z-index: 10;
  }
  #spinner-arrow {
    position: absolute; width: 100%; height: 100%; top: 0; left: 0; z-index: 5;
    transition: transform 3s cubic-bezier(0.15, 0, 0.15, 1);
  }
  .pointer-dot {
    position: absolute; top: 10px; left: 50%; margin-left: -5px;
    width: 10px; height: 10px; background: #fff; border-radius: 50%; box-shadow: 0 0 10px #fff;
  }

  /* Кнопки процентов */
  .chance-btns { display: flex; gap: 10px; margin-bottom: 20px; }
  .chance-btn {
    background: #1a1a1a; border: 2px solid #333; color: #fff;
    padding: 10px 20px; border-radius: 5px; cursor: pointer; transition: 0.2s;
  }
  .chance-btn.active { border-color: #8a2be2; background: #25103d; }

  #upgrade-btn {
    background: #8a2be2; color: #fff; border: none; padding: 15px 60px;
    font-size: 20px; border-radius: 50px; cursor: pointer; margin-bottom: 30px;
    font-weight: bold; text-transform: uppercase; box-shadow: 0 0 20px rgba(138, 43, 226, 0.4);
  }
  #upgrade-btn:disabled { background: #444; cursor: not-allowed; box-shadow: none; }

  /* Инвентарь */
  .inventory-title { align-self: flex-start; margin-bottom: 10px; font-size: 14px; opacity: 0.6; }
  .inventory {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
    gap: 10px; width: 100%; max-width: 600px; background: #161616; padding: 15px; border-radius: 10px;
  }
  .inv-item {
    background: #222; border: 2px solid #333; padding: 10px; border-radius: 8px;
    text-align: center; cursor: pointer; transition: 0.2s; min-height: 80px;
    display: flex; flex-direction: column; justify-content: center;
  }
  .inv-item.selected { border-color: #8a2be2; background: #25103d; box-shadow: inset 0 0 10px rgba(138, 43, 226, 0.3); }
  .item-name { font-size: 11px; margin-bottom: 5px; word-wrap: break-word; }
  .item-price { font-size: 14px; font-weight: bold; color: #fff; }

  /* Утилиты */
  .hidden { display: none !important; }
</style>
</head>
<body>

<button class="kill-ads-btn" onclick="destroyAds()"><span>AD</span> откл рекламу</button>

<header>Дима пьяный украинец</header>

<div class="container" id="main-content">
  <div id="content"></div>
  <div class="btns">
    <button onclick="prevDay()">← Пред.</button>
    <button onclick="toggleAll()" id="toggleBtn">Все дни</button>
    <button onclick="nextDay()">След. →</button>
  </div>
</div>

<!-- ЭКРАН ЛУДОМАНИИ -->
<div id="ludo-screen">
  <div class="ludo-title">Апгрейдер Биомусора</div>
  
  <div class="wheel-container">
    <div class="wheel-arrow"></div>
    <div id="spinner-arrow"><div class="pointer-dot"></div></div>
    <div class="wheel-fill" id="fill-level"></div>
    <div class="wheel-percent" id="display-percent">50%</div>
  </div>

  <div class="chance-btns">
    <button class="chance-btn" onclick="setChance(50)">50%</button>
    <button class="chance-btn" onclick="setChance(20)">20%</button>
    <button class="chance-btn" onclick="setChance(10)">10%</button>
  </div>

  <button id="upgrade-btn" onclick="startUpgrade()">ПРОКАЧАТЬ</button>

  <div class="inventory-title">ТВОЙ ИНВЕНТАРЬ (ВЫБЕРИ ПРЕДМЕТ):</div>
  <div class="inventory" id="inventory-grid">
    <!-- Предметы вставляются кодом -->
  </div>
  
  <div style="margin-top: 30px; opacity: 0.3; font-size: 10px;" onclick="location.reload()">Вернуться к расписанию</div>
</div>

<script>
  // ========== БАЗОВАЯ ЛОГИКА (БЕЗ ИЗМЕНЕНИЙ) ==========
  const schedules = {
    "понедельник": ["Разговоры о лудомании", "История", "Физкультура", "Алгебра", "География", "Обществознание", "Иностранный язык"],
    "вторник": ["Литература", "Русский язык", "ОБЖ", "Алгебра", "Физика", "Иностранный язык", "История"],
    "среда": ["Русский язык", "Литература", "География", "Химия", "Информатика", "Физкультура", "Труд"],
    "четверг": ["кейс батл", "Алгебра", "Геометрия", "Физика", "Биология", "Русский язык", "Литература"],
    "пятница": ["Вероятность и статистика", "Геометрия", "История", "Химия", "Биология", "Физика", "Иностранный язык"]
  };
  const times = ["8:30–9:15","9:35–10:20","10:40–11:25","11:50–12:35","12:55–13:40","13:50–14:35","14:40–15:25"];
  const days = ["понедельник","вторник","среда","четверг","пятница"];
  let dayIndex = 0;
  let showAll = false;

  function renderDayBlock(container, day) {
    let title = document.createElement("div"); title.className = "day-title"; title.textContent = day.charAt(0).toUpperCase() + day.slice(1); container.appendChild(title);
    for (let i = 0; i < schedules[day].length; i++) {
      let card = document.createElement("div"); card.className = "card";
      card.innerHTML = `<div class="time">${times[i]}</div><div class="subject">${schedules[day][i]}</div>`;
      container.appendChild(card);
    }
    if (window.innerWidth >= 750) {
      let t = document.createElement("table");
      t.innerHTML = `<tr><th>#</th><th>Время</th><th>Предмет</th></tr>` + 
        schedules[day].map((s, i) => `<tr><td>${i+1}</td><td>${times[i]}</td><td>${s}</td></tr>`).join('');
      container.appendChild(t);
    }
  }
  function renderSchedule() {
    let root = document.getElementById("content"); root.innerHTML = "";
    if (showAll) days.forEach(d => renderDayBlock(root, d));
    else renderDayBlock(root, days[dayIndex]);
  }
  window.prevDay = () => { dayIndex = (dayIndex - 1 + 5) % 5; renderSchedule(); };
  window.nextDay = () => { dayIndex = (dayIndex + 1) % 5; renderSchedule(); };
  window.toggleAll = () => { showAll = !showAll; renderSchedule(); };

  // ========== РЕКЛАМА И ЭФФЕКТЫ ==========
  function fullScreenExplosion(callback) {
    const dustContainer = document.createElement('div');
    dustContainer.className = 'pixel-dust';
    document.body.appendChild(dustContainer);
    const pSize = 15;
    for (let i = 0; i < window.innerWidth; i += pSize*2) {
      for (let j = 0; j < window.innerHeight; j += pSize*2) {
        const p = document.createElement('div');
        p.className = 'pixel';
        p.style.left = i + 'px'; p.style.top = j + 'px';
        p.style.width = pSize + 'px'; p.style.height = pSize + 'px';
        const angle = Math.random() * Math.PI * 2;
        const dist = 300 + Math.random() * 500;
        p.style.setProperty('--dx', Math.cos(angle) * dist + 'px');
        p.style.setProperty('--dy', Math.sin(angle) * dist + 'px');
        dustContainer.appendChild(p);
      }
    }
    setTimeout(() => { dustContainer.remove(); if(callback) callback(); }, 600);
  }

  function destroyAds() {
    fullScreenExplosion(() => {
      document.querySelector('.container').classList.add('hidden');
      document.querySelector('header').classList.add('hidden');
      document.querySelectorAll('.ad-float').forEach(a => a.remove());
      document.querySelector('.kill-ads-btn').remove();
      document.getElementById('ludo-screen').style.display = 'flex';
      initLudo();
    });
  }

  // ========== ЛУДОМАНИЯ (UPGRADER) ==========
  const itemNames = ["Сифилис", "Геморрой", "Твои яйца", "Девственность", "Мамкин кошелек", "ВИЧ+", "Кровь из глаз", "Огромные соски", "Гнилые зубы", "Молочница", "Грибок", "Шиза"];
  let inventory = [];
  let selectedItemIndex = null;
  let currentChance = 50;
  let isSpinning = false;

  function initLudo() {
    inventory = [
      { name: itemNames[Math.floor(Math.random()*itemNames.length)], price: Math.floor(Math.random()*250) + 50 },
      { name: itemNames[Math.floor(Math.random()*itemNames.length)], price: Math.floor(Math.random()*250) + 50 },
      { name: itemNames[Math.floor(Math.random()*itemNames.length)], price: Math.floor(Math.random()*250) + 50 }
    ];
    setChance(50);
    renderInventory();
  }

  function renderInventory() {
    const grid = document.getElementById('inventory-grid');
    grid.innerHTML = '';
    inventory.forEach((item, idx) => {
      const div = document.createElement('div');
      div.className = `inv-item ${selectedItemIndex === idx ? 'selected' : ''}`;
      div.onclick = () => { if(!isSpinning) { selectedItemIndex = idx; renderInventory(); } };
      div.innerHTML = `<div class="item-name">${item.name}</div><div class="item-price">${item.price} ₴</div>`;
      grid.appendChild(div);
    });
  }

  function setChance(val) {
    if(isSpinning) return;
    currentChance = val;
    document.getElementById('display-percent').textContent = val + '%';
    document.getElementById('fill-level').style.height = val + '%';
    document.querySelectorAll('.chance-btn').forEach(b => {
      b.classList.toggle('active', parseInt(b.textContent) === val);
    });
  }

  function startUpgrade() {
    if(selectedItemIndex === null || isSpinning) return;
    isSpinning = true;
    document.getElementById('upgrade-btn').disabled = true;

    const arrow = document.getElementById('spinner-arrow');
    arrow.style.transition = 'none';
    arrow.style.transform = 'rotate(0deg)';
    
    setTimeout(() => {
      const randomDeg = 1800 + Math.floor(Math.random() * 360);
      arrow.style.transition = 'transform 3s cubic-bezier(0.15, 0, 0.15, 1)';
      arrow.style.transform = `rotate(${randomDeg}deg)`;

      setTimeout(() => {
        const finalDeg = randomDeg % 360;
        // Т.к. фиолетовая область заполняется снизу вверх, это область от 180 (середина низа)
        // Но для простоты: шанс — это вероятность.
        const win = Math.random() * 100 <= currentChance;

        if(win) {
          const item = inventory[selectedItemIndex];
          const multiplier = (100 / currentChance).toFixed(1);
          item.price = Math.round(item.price * multiplier);
          item.name = itemNames[Math.floor(Math.random()*itemNames.length)] + " (X)";
          alert(`ВЫИГРЫШ! Предмет теперь стоит ${item.price} ₴`);
        } else {
          alert("ПРОЕБАЛ! Предмет удален.");
          inventory.splice(selectedItemIndex, 1);
          selectedItemIndex = null;
        }

        if(inventory.length === 0) {
          alert("Ты всё просрал. Даем новый мусор.");
          initLudo();
        }

        isSpinning = false;
        document.getElementById('upgrade-btn').disabled = false;
        renderInventory();
      }, 3100);
    }, 50);
  }

  // Старт
  renderSchedule();
  // (Здесь был бы код рекламных плашек из твоего оригинала)
</script>
</body>
</html>
