<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
<title>Расписание — абсурдные тарифы</title>

<style>
  /* ===== ОРИГИНАЛЬНЫЙ СТИЛЬ РАСПИСАНИЯ ===== */
  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    padding: 0;
    font-family: system-ui, Arial, sans-serif;
    background: #121212;
    color: #e5e5e5;
    min-height: 100vh;
    position: relative;
  }

  header {
    text-align: center;
    padding: 18px;
    font-size: 22px;
    background: #1c1c1c;
    border-bottom: 1px solid #2a2a2a;
  }

  .container {
    max-width: 900px;
    margin: 0 auto;
    padding: 14px;
    position: relative;
    z-index: 1;
  }

  .card {
    background: #1c1c1c;
    border-radius: 10px;
    padding: 14px 16px;
    margin-bottom: 12px;
    border: 1px solid #2a2a2a;
  }

  .card .time {
    opacity: 0.7;
    font-size: 14px;
    margin-bottom: 4px;
  }

  .card .subject {
    font-size: 17px;
    font-weight: 500;
  }

  .day-title {
    font-size: 19px;
    margin: 20px 0 10px;
    opacity: 0.85;
  }

  .btns {
    display: flex;
    gap: 10px;
    margin-top: 20px;
    margin-bottom: 20px;
  }

  button {
    flex: 1;
    padding: 14px 0;
    background: #2d2d2d;
    border: none;
    border-radius: 8px;
    color: #e5e5e5;
    font-size: 16px;
    cursor: pointer;
  }

  button:active {
    background: #3a3a3a;
  }

  @media (min-width: 750px) {
    .card { display: none; }
    table { display: table; }
  }

  table {
    width: 100%;
    border-collapse: collapse;
    background: #1c1c1c;
    margin-bottom: 20px;
    border-radius: 10px;
    overflow: hidden;
  }

  th, td {
    padding: 12px;
    border-bottom: 1px solid #2a2a2a;
    text-align: center;
  }

  th {
    background: #222;
    font-weight: 600;
  }

  /* ===== РЕКЛАМНЫЕ ПЛАШКИ (как были) ===== */
  .ad-float {
    position: fixed;
    background: #0a0a0a;
    border: 3px solid white;
    border-radius: 20px;
    box-shadow: 0 0 20px rgba(255,255,200,0.4);
    z-index: 1000;
    overflow: hidden;
    backdrop-filter: blur(4px);
    max-width: 260px;
    width: auto;
    min-width: 140px;
    will-change: transform, opacity;
    animation: popIn 0.2s cubic-bezier(0.34, 1.2, 0.64, 1);
  }

  @keyframes popIn {
    0% { transform: scale(0.2) rotate(-10deg); opacity: 0; }
    80% { transform: scale(1.1) rotate(2deg); }
    100% { transform: scale(1) rotate(0deg); opacity: 1; }
  }

  .ad-float.closing-scale {
    animation: scaleOut 0.15s ease-in forwards !important;
    pointer-events: none;
  }

  @keyframes scaleOut {
    0% { transform: scale(1); opacity: 1; }
    100% { transform: scale(0); opacity: 0; }
  }

  @media (max-width: 700px) {
    .ad-float { max-width: 180px; border-width: 2px; }
    .close-corner { width: 26px; height: 26px; font-size: 16px; }
  }

  .ad-inner { position: relative; display: block; width: 100%; }
  .ad-img { width: 100%; height: auto; display: block; cursor: pointer; object-fit: cover; }
  .close-corner {
    position: absolute; top: 4px; right: 6px; background: #cc3333; border: none;
    color: white; font-size: 18px; width: 30px; height: 30px; border-radius: 30px;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    z-index: 20; font-family: monospace;
  }
  .ad-float.hidden-temp { display: none; }

  /* Пиксельный распад (белые частицы) */
  .pixel-dust { position: fixed; width: 100%; height: 100%; top: 0; left: 0; pointer-events: none; z-index: 10001; }
  .pixel { position: absolute; background-color: #ffffff; border-radius: 2px; pointer-events: none; animation: flyAway 0.4s ease-out forwards; box-shadow: 0 0 4px rgba(255,255,255,0.8); }
  @keyframes flyAway {
    0% { transform: translate(0, 0) rotate(0deg); opacity: 1; }
    100% { transform: translate(var(--dx), var(--dy)) rotate(360deg); opacity: 0; }
  }

  /* ===== МЕНЮ ТАРИФОВ (fullscreen, поверх всего) ===== */
  .tariff-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: #0a0c12;
    z-index: 20000;
    overflow-y: auto;
    padding: 20px;
    backdrop-filter: blur(10px);
    animation: fadeIn 0.3s;
  }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  
  .tariff-container {
    max-width: 600px;
    margin: 0 auto;
  }
  .tariff-title {
    font-size: 28px;
    text-align: center;
    margin: 20px 0;
    color: #ffaa66;
    text-transform: uppercase;
  }
  .tariff-card {
    background: #1a1e2a;
    border-radius: 24px;
    padding: 20px;
    margin-bottom: 20px;
    border: 1px solid #ffaa66;
    transition: 0.1s;
  }
  .tariff-name {
    font-size: 26px;
    font-weight: bold;
    color: #ffcc88;
  }
  .tariff-price {
    font-size: 32px;
    margin: 10px 0;
    color: #ffaa66;
  }
  .tariff-features {
    list-style: none;
    padding: 0;
    margin: 15px 0;
  }
  .tariff-features li {
    padding: 6px 0;
    border-bottom: 1px solid #2a2e3a;
  }
  .buy-btn {
    background: #6a3e1a;
    border: none;
    color: white;
    padding: 12px 20px;
    border-radius: 40px;
    font-size: 18px;
    cursor: pointer;
    width: 100%;
    margin-top: 10px;
  }
  .close-tariff {
    text-align: center;
    margin-top: 40px;
    padding-bottom: 30px;
    color: #888;
    cursor: pointer;
    font-size: 16px;
  }
  .close-tariff:hover { color: #ff8888; }

  /* Форма оформления */
  .order-form {
    background: #0f111a;
    border-radius: 24px;
    padding: 20px;
    margin-top: 10px;
  }
  .order-form input, .order-form select {
    width: 100%;
    padding: 12px;
    margin: 8px 0;
    background: #1e2230;
    border: 1px solid #3a3e50;
    color: white;
    border-radius: 12px;
  }
  .invoice {
    background: #0a0c16;
    padding: 16px;
    border-radius: 16px;
    margin: 15px 0;
  }
  .invoice-row {
    display: flex;
    justify-content: space-between;
    padding: 8px 0;
    border-bottom: 1px solid #2a2e3e;
  }
  .total-row {
    font-weight: bold;
    font-size: 20px;
    color: #ffaa66;
    border-top: 2px solid #ffaa66;
    margin-top: 8px;
    padding-top: 12px;
  }
</style>
</head>
<body>

<header>Дима пьяный украинец</header>

<div class="container">
  <div id="content"></div>
  <div class="btns">
    <button onclick="prevDay()">← Пред.</button>
    <button onclick="toggleAll()" id="toggleBtn">Все дни</button>
    <button onclick="nextDay()">След. →</button>
  </div>
</div>

<script>
  // ========== РАСПИСАНИЕ ==========
  const schedules = {
    "понедельник": ["Разговоры о какашках", "История", "Физкультура", "Алгебра", "География", "Обществознание", "Иностранный язык"],
    "вторник": ["Литература", "Русский язык", "ОБЖ", "Алгебра", "Физика", "Иностранный язык", "История"],
    "среда": ["Русский язык", "Литература", "География", "Химия", "Информатика", "Физкультура", "Труд"],
    "четверг": ["Говно фуууу", "Алгебра", "Геометрия", "Физика", "Биология", "Русский язык", "Литература"],
    "пятница": ["Вероятность и статистика", "Геометрия", "История", "Химия", "Биология", "Физика", "Иностранный язык"]
  };
  const times = ["8:30–9:15","9:35–10:20","10:40–11:25","11:50–12:35","12:55–13:40","13:50–14:35","14:40–15:25"];
  const days = ["понедельник","вторник","среда","четверг","пятница"];
  let dayIndex = (() => { let idx = new Date().getDay() - 1; return (idx >= 0 && idx <= 4) ? idx : 0; })();
  let showAll = false;

  function addCell(row, text, isHead) { let cell = document.createElement(isHead ? "th" : "td"); cell.textContent = text; row.appendChild(cell); }
  function renderDayBlock(container, day) {
    let title = document.createElement("div"); title.className = "day-title"; title.textContent = day.charAt(0).toUpperCase() + day.slice(1); container.appendChild(title);
    for (let i = 0; i < schedules[day].length; i++) {
      let card = document.createElement("div"); card.className = "card";
      let tSpan = document.createElement("div"); tSpan.className = "time"; tSpan.textContent = times[i];
      let sSpan = document.createElement("div"); sSpan.className = "subject"; sSpan.textContent = schedules[day][i];
      card.appendChild(tSpan); card.appendChild(sSpan); container.appendChild(card);
    }
    if (window.innerWidth >= 750) {
      let table = document.createElement("table"); let thead = document.createElement("tr");
      addCell(thead, "#", true); addCell(thead, "Время", true); addCell(thead, "Предмет", true); table.appendChild(thead);
      for (let i = 0; i < schedules[day].length; i++) {
        let row = document.createElement("tr"); addCell(row, i + 1, false); addCell(row, times[i], false); addCell(row, schedules[day][i], false); table.appendChild(row);
      }
      container.appendChild(table);
    }
  }
  function renderSchedule() { let root = document.getElementById("content"); root.innerHTML = ""; document.getElementById("toggleBtn").textContent = showAll ? "Один день" : "Все дни"; if (showAll) { for (let d of days) renderDayBlock(root, d); } else { renderDayBlock(root, days[dayIndex]); } }
  window.prevDay = () => { dayIndex = (dayIndex - 1 + days.length) % days.length; showAll = false; renderSchedule(); };
  window.nextDay = () => { dayIndex = (dayIndex + 1) % days.length; showAll = false; renderSchedule(); };
  window.toggleAll = () => { showAll = !showAll; renderSchedule(); };

  // ========== РЕКЛАМА С АНИМАЦИЕЙ ==========
  const adCampaigns = [
    { img: "images/casebattle.png", link: "https://case-battle.red/", alt: "Case Battle" },
    { img: "images/upgrader.png", link: "https://upgrader.pro/ru", alt: "Upgrader Pro" },
    { img: "images/gosuslugi.png", link: "https://contract.gosuslugi.ru/", alt: "Госуслуги" }
  ];
  let adPanels = [];
  let closedAdsCount = 0;  // счётчик закрытых реклам
  let tariffOverlayActive = false;

  function getRandomPosition(adElement) {
    if (!adElement) return { left: 20, top: 20 };
    const rect = adElement.getBoundingClientRect();
    const adWidth = rect.width || 180, adHeight = rect.height || 140;
    const maxX = Math.max(20, window.innerWidth - adWidth - 20), maxY = Math.max(20, window.innerHeight - adHeight - 20);
    let left = Math.random() * maxX, top = Math.random() * maxY;
    if (Math.random() > 0.7) left = 10;
    if (Math.random() > 0.8) left = window.innerWidth - adWidth - 10;
    if (Math.random() > 0.85) top = 10;
    if (Math.random() > 0.85) top = window.innerHeight - adHeight - 10;
    left = Math.min(Math.max(5, left), window.innerWidth - adWidth - 5);
    top = Math.min(Math.max(5, top), window.innerHeight - adHeight - 5);
    return { left, top };
  }
  function relocateAd(ad) { if (!ad || !ad.element) return; const pos = getRandomPosition(ad.element); ad.element.style.left = pos.left + "px"; ad.element.style.top = pos.top + "px"; ad.element.style.right = "auto"; ad.element.style.bottom = "auto"; }
  function updateAdImage(ad) { const campaign = adCampaigns[ad.imageIndex % adCampaigns.length]; if (ad.imgElement) { ad.imgElement.src = campaign.img; ad.imgElement.alt = campaign.alt; ad.imgElement.onclick = (e) => { e.preventDefault(); window.open(campaign.link, "_blank"); }; } }

  function pixelExplode(element, callback) {
    if (!element) { if(callback) callback(); return; }
    const rect = element.getBoundingClientRect();
    const width = rect.width, height = rect.height, left = rect.left, top = rect.top;
    const dustContainer = document.createElement('div'); dustContainer.className = 'pixel-dust'; document.body.appendChild(dustContainer);
    const pixelSize = 8, cols = Math.ceil(width / pixelSize), rows = Math.ceil(height / pixelSize);
    for (let i = 0; i < cols; i++) {
      for (let j = 0; j < rows; j++) {
        const pixel = document.createElement('div'); pixel.className = 'pixel';
        pixel.style.left = (left + i * pixelSize) + 'px'; pixel.style.top = (top + j * pixelSize) + 'px';
        pixel.style.width = pixelSize + 'px'; pixel.style.height = pixelSize + 'px';
        pixel.style.backgroundColor = '#ffffff'; pixel.style.boxShadow = '0 0 4px rgba(255,255,255,0.8)';
        const angle = Math.random() * Math.PI * 2; const distance = 80 + Math.random() * 150;
        pixel.style.setProperty('--dx', Math.cos(angle) * distance + 'px'); pixel.style.setProperty('--dy', Math.sin(angle) * distance + 'px');
        dustContainer.appendChild(pixel);
        setTimeout(() => { if(pixel && pixel.remove) pixel.remove(); }, 450);
      }
    }
    element.style.visibility = 'hidden'; element.style.opacity = '0';
    setTimeout(() => { if(dustContainer && dustContainer.remove) dustContainer.remove(); if(callback) callback(); }, 200);
  }

  function closeAdWithAnimation(ad, onComplete) {
    if (!ad || !ad.element || ad.isClosing) { if(onComplete) onComplete(); return; }
    ad.isClosing = true;
    const element = ad.element;
    element.style.pointerEvents = 'none';
    pixelExplode(element, () => {
      element.classList.add('hidden-temp');
      element.style.visibility = 'hidden';
      ad.imageIndex = (ad.imageIndex + 1) % adCampaigns.length;
      updateAdImage(ad);
      relocateAd(ad);
      element.classList.remove('hidden-temp');
      ad.isClosing = false;
      element.style.visibility = 'visible';
      element.style.opacity = '1';
      element.style.animation = 'none';
      element.offsetHeight;
      element.style.animation = 'popIn 0.2s cubic-bezier(0.34, 1.2, 0.64, 1)';
      element.style.pointerEvents = '';
      if (onComplete) onComplete();
    });
  }

  function createAdPanel() {
    const div = document.createElement("div"); div.className = "ad-float";
    const inner = document.createElement("div"); inner.className = "ad-inner";
    const img = document.createElement("img"); img.className = "ad-img";
    const closeBtn = document.createElement("button"); closeBtn.className = "close-corner"; closeBtn.textContent = "✖";
    inner.appendChild(img); inner.appendChild(closeBtn); div.appendChild(inner); document.body.appendChild(div);
    const adObj = { element: div, imgElement: img, closeBtn, imageIndex: Math.floor(Math.random() * adCampaigns.length), isClosing: false };
    updateAdImage(adObj); relocateAd(adObj);
    closeBtn.addEventListener("click", (e) => {
      e.stopPropagation();
      if (adObj.isClosing || tariffOverlayActive) return;
      // увеличиваем счётчик закрытых реклам
      closedAdsCount++;
      closeAdWithAnimation(adObj, () => {
        if (closedAdsCount >= 3 && !tariffOverlayActive) {
          showTariffMenu();
        }
      });
    });
    return adObj;
  }

  function showTariffMenu() {
    if (tariffOverlayActive) return;
    tariffOverlayActive = true;
    // скрываем все рекламные плашки на время
    for (let ad of adPanels) { if (ad && ad.element) ad.element.style.display = 'none'; }
    const overlay = document.createElement('div'); overlay.className = 'tariff-overlay';
    overlay.innerHTML = `
      <div class="tariff-container">
        <div class="tariff-title">💸 VIP ТАРИФЫ ДЛЯ ИЗБРАННЫХ 💸</div>
        <div class="tariff-card" data-tariff="premium">
          <div class="tariff-name">🚀 ПАЦАНСКИЙ ПРЕМИУМ</div>
          <div class="tariff-price">₴ 99 999</div>
          <ul class="tariff-features">
            <li>✅ Доступ к расписанию на 1 секунду вперёд</li>
            <li>✅ Личный гуру "Дима пьяный украинец"</li>
            <li>✅ Бесплатная доставка воздуха с гор</li>
            <li>✅ Наклейка "Я лох" на лоб</li>
          </ul>
          <button class="buy-btn" data-price="99999" data-name="ПАЦАНСКИЙ ПРЕМИУМ">КУПИТЬ ЗА 99 999 ₴</button>
        </div>
        <div class="tariff-card" data-tariff="ultra">
          <div class="tariff-name">👑 КОРОЛЬ КОМЕДИ КЛАБА</div>
          <div class="tariff-price">₴ 499 999</div>
          <ul class="tariff-features">
            <li>✅ Все фишки премиума + обещание не ржать</li>
            <li>✅ Реклама будет закрываться за тебя (через 3 года)</li>
            <li>✅ Личный скилл "отмазка для школы"</li>
            <li>✅ Фирменный галстук из папье-маше</li>
          </ul>
          <button class="buy-btn" data-price="499999" data-name="КОРОЛЬ КОМЕДИ КЛАБА">КУПИТЬ ЗА 499 999 ₴</button>
        </div>
        <div class="tariff-card" data-tariff="god">
          <div class="tariff-name">⚡ БОЖЕСТВЕННЫЙ ЧЕРВЬ</div>
          <div class="tariff-price">₴ 1 337 000</div>
          <ul class="tariff-features">
            <li>✅ Учителя будут здороваться первыми</li>
            <li>✅ Твои оценки превратятся в мемы</li>
            <li>✅ Персональный танец с бубном на перемене</li>
            <li>✅ Бессрочная гарантия на "ничего"</li>
          </ul>
          <button class="buy-btn" data-price="1337000" data-name="БОЖЕСТВЕННЫЙ ЧЕРВЬ">КУПИТЬ ЗА 1 337 000 ₴</button>
        </div>
        <div class="close-tariff" id="closeTariffBtn">❌ нет, спасибо, я бедный ❌</div>
      </div>
    `;
    document.body.appendChild(overlay);
    
    // обработка кнопок "Купить"
    overlay.querySelectorAll('.buy-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        const price = parseInt(btn.dataset.price);
        const name = btn.dataset.name;
        showOrderForm(overlay, price, name);
      });
    });
    const closeBtnEl = overlay.querySelector('#closeTariffBtn');
    closeBtnEl.addEventListener('click', () => {
      overlay.remove();
      tariffOverlayActive = false;
      // возвращаем рекламу обратно
      for (let ad of adPanels) { if (ad && ad.element) ad.element.style.display = ''; }
      closedAdsCount = 0; // сброс счётчика, чтобы не спамить окном
    });
  }

  function showOrderForm(overlay, basePrice, tariffName) {
    // очищаем внутри, показываем форму оформления
    const container = overlay.querySelector('.tariff-container');
    container.innerHTML = `
      <div class="tariff-title">📝 ОФОРМЛЕНИЕ ТАРИФА "${tariffName}"</div>
      <div class="order-form">
        <input type="text" id="fullName" placeholder="ФИО (как в паспорте)" value="Дима Пьяный Українець">
        <input type="text" id="passport" placeholder="Серия и номер паспорта" value="УК 123456">
        <input type="text" id="phone" placeholder="Телефон (обязательно)" value="+380 99 420 6969">
        <input type="text" id="address" placeholder="Адрес прописки (любой)" value="вул. Гетьмана Мазепи, 666">
        <select id="delivery">
          <option value="Курьером в зубы + 500₴">Курьером в зубы (+500₴)</option>
          <option value="Почтой Украины + 200₴">Почтой Украины (+200₴)</option>
          <option value="Телепортация (ещё нет) + 9999₴">Телепортация (+9999₴)</option>
        </select>
        <button id="nextToInvoiceBtn" style="background:#ff8844; margin-top:20px;">👉 ПЕРЕЙТИ К ОПЛАТЕ 👈</button>
      </div>
      <div class="close-tariff" id="backToTariffs">◀ Назад к тарифам</div>
    `;
    const backBtn = container.querySelector('#backToTariffs');
    backBtn.addEventListener('click', () => {
      overlay.remove();
      showTariffMenu();  // заново открываем тарифы (рекурсия)
    });
    const nextBtn = container.querySelector('#nextToInvoiceBtn');
    nextBtn.addEventListener('click', () => {
      const deliverySelect = document.getElementById('delivery');
      let deliveryCost = 0;
      let deliveryText = "";
      switch(deliverySelect.value) {
        case "Курьером в зубы + 500₴": deliveryCost = 500; deliveryText = "Курьером в зубы"; break;
        case "Почтой Украины + 200₴": deliveryCost = 200; deliveryText = "Почтой Украины"; break;
        case "Телепортация (ещё нет) + 9999₴": deliveryCost = 9999; deliveryText = "Телепортация"; break;
        default: deliveryCost=0;
      }
      // комиссии за "повод"
      const commissions = [
        { name: "Комиссия за 'заповіт Бандери'", percent: 15 },
        { name: "Сбор за 'причина — просто так'", percent: 12 },
        { name: "Налог на кринж", percent: 8 },
        { name: "Плата за воздух (экологический)", percent: 5 }
      ];
      let total = basePrice + deliveryCost;
      let commissionRows = [];
      for (let comm of commissions) {
        let amount = Math.round(total * comm.percent / 100);
        commissionRows.push({ name: comm.name, amount: amount, percent: comm.percent });
        total += amount;
      }
      // итого с учётом всех комиссий
      total = Math.round(total);
      
      // Формируем чек
      let invoiceHtml = `<div class="invoice"><div class="invoice-row"><span>💰 Тариф "${tariffName}"</span><span>${basePrice.toLocaleString()} ₴</span></div>`;
      invoiceHtml += `<div class="invoice-row"><span>🚚 Доставка: ${deliveryText}</span><span>+${deliveryCost.toLocaleString()} ₴</span></div>`;
      for (let cr of commissionRows) {
        invoiceHtml += `<div class="invoice-row"><span>${cr.name} (${cr.percent}%)</span><span>+${cr.amount.toLocaleString()} ₴</span></div>`;
      }
      invoiceHtml += `<div class="invoice-row total-row"><span>🐷 ИТОГО К ОПЛАТЕ</span><span>${total.toLocaleString()} ₴</span></div>`;
      invoiceHtml += `<div style="font-size:12px; opacity:0.6; margin-top:12px;">Комиссия за "просто потому что" уже включена</div></div>`;
      invoiceHtml += `<button id="payFinalBtn" style="background:#6a3e1a; width:100%; padding:14px; border-radius:40px; font-size:18px;">💳 ОПЛАТИТЬ 💳</button>`;
      
      container.innerHTML = `
        <div class="tariff-title">🧾 ЧЕК НА ОПЛАТУ</div>
        ${invoiceHtml}
        <div class="close-tariff" id="backToForm" style="margin-top:20px;">◀ Редактировать данные</div>
      `;
      const backForm = container.querySelector('#backToForm');
      backForm.addEventListener('click', () => { showOrderForm(overlay, basePrice, tariffName); });
      const payBtn = container.querySelector('#payFinalBtn');
      payBtn.addEventListener('click', () => {
        window.open("https://sovcombank.ru/apply/credit/city-spb/", "_blank");
        // после перехода не закрываем оверлей, просто открываем вкладку
      });
    });
  }

  function initAds() {
    for (let ad of adPanels) { if(ad && ad.element) ad.element.remove(); }
    adPanels = [];
    closedAdsCount = 0;
    for (let i = 0; i < 5; i++) { adPanels.push(createAdPanel()); }
  }

  window.addEventListener("resize", () => { if(!tariffOverlayActive) for(let ad of adPanels) relocateAd(ad); renderSchedule(); });
  renderSchedule();
  initAds();
</script>

</body>
</html>
