<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
<title>Расписание — старый дизайн</title>

<style>
  /* оригинальный стиль из первого сообщения с минимальными правками */
  body {
    margin: 0;
    padding: 0;
    font-family: system-ui, Arial, sans-serif;
    background: #121212;
    color: #e5e5e5;
  }

  header {
    text-align: center;
    padding: 18px;
    font-size: 22px;
    background: #1c1c1c;
    border-bottom: 1px solid #2a2a2a;
  }

  .container {
    max-width: 900px;
    margin: 0 auto;
    padding: 14px;
  }

  /* карточки (мобильный стиль) */
  .card {
    background: #1c1c1c;
    border-radius: 10px;
    padding: 14px 16px;
    margin-bottom: 12px;
    border: 1px solid #2a2a2a;
  }

  .card .time {
    opacity: 0.7;
    font-size: 14px;
    margin-bottom: 4px;
  }

  .card .subject {
    font-size: 17px;
    font-weight: 500;
  }

  .day-title {
    font-size: 19px;
    margin: 20px 0 10px;
    opacity: 0.85;
  }

  /* кнопки навигации */
  .btns {
    display: flex;
    gap: 10px;
    margin-top: 20px;
    margin-bottom: 20px;
  }

  button {
    flex: 1;
    padding: 14px 0;
    background: #2d2d2d;
    border: none;
    border-radius: 8px;
    color: #e5e5e5;
    font-size: 16px;
    cursor: pointer;
  }

  button:active {
    background: #3a3a3a;
  }

  /* таблица для ПК (как в оригинале) */
  @media (min-width: 750px) {
    .card {
      display: none;
    }
    table {
      display: table;
    }
  }
  
  table {
    width: 100%;
    border-collapse: collapse;
    background: #1c1c1c;
    margin-bottom: 20px;
    border-radius: 10px;
    overflow: hidden;
  }

  th, td {
    padding: 12px;
    border-bottom: 1px solid #2a2a2a;
    text-align: center;
  }

  th {
    background: #222;
    font-weight: 600;
  }

  /* ======= РЕКЛАМНЫЕ БЛОКИ (как просили) ======= */
  /* Для ПК — сбоку, фиксированный */
  .ad-sidebar {
    position: fixed;
    right: 16px;
    top: 50%;
    transform: translateY(-50%);
    width: 200px;
    background: #1c1c1c;
    border: 1px solid #3a3a3a;
    border-radius: 16px;
    padding: 12px;
    text-align: center;
    z-index: 1000;
    box-shadow: 0 4px 20px rgba(0,0,0,0.5);
  }

  .ad-sidebar .ad-img {
    width: 100%;
    border-radius: 12px;
    cursor: pointer;
    display: block;
    margin-bottom: 10px;
    background: #2a2a2a;
  }

  .ad-sidebar .close-ad-btn {
    background: #4a4a4a;
    border: none;
    color: white;
    padding: 6px 0;
    width: 100%;
    border-radius: 30px;
    font-size: 13px;
    cursor: pointer;
  }

  /* мобильная реклама — снизу */
  .ad-bottom {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background: #0f0f0f;
    border-top: 2px solid #ff8c42;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 12px;
    padding: 10px 16px;
    z-index: 1100;
    flex-wrap: wrap;
  }

  .ad-bottom .ad-img {
    height: 60px;
    width: auto;
    max-width: 160px;
    border-radius: 12px;
    cursor: pointer;
    border: 1px solid #3a3a3a;
  }

  .ad-bottom .close-ad-btn {
    background: #aa2e2e;
    border: none;
    color: white;
    padding: 6px 18px;
    border-radius: 40px;
    font-weight: bold;
    font-size: 13px;
    cursor: pointer;
  }

  /* Адаптивность: на широких экранах прячем нижнюю рекламу, на узких — боковую */
  @media (min-width: 1000px) {
    .ad-bottom {
      display: none;
    }
    .ad-sidebar {
      display: block;
    }
  }

  @media (max-width: 999px) {
    .ad-sidebar {
      display: none;
    }
    .ad-bottom {
      display: flex;
    }
    body {
      padding-bottom: 90px;
    }
  }

  /* отступ контента чтобы не перекрывало рекламу */
  @media (min-width: 1000px) {
    .container {
      margin-right: 240px;
    }
  }
</style>
</head>
<body>

<header>Дима пьяный украинец</header>

<div class="container">
  <div id="content"></div>
  <div class="btns">
    <button onclick="prevDay()">← Пред.</button>
    <button onclick="toggleAll()" id="toggleBtn">Все дни</button>
    <button onclick="nextDay()">След. →</button>
  </div>
</div>

<!-- Реклама для ПК (сбоку) -->
<div id="adSidebar" class="ad-sidebar">
  <img id="sidebarAdImg" class="ad-img" src="" alt="Реклама">
  <button id="closeSidebarBtn" class="close-ad-btn">✖ Закрыть</button>
</div>

<!-- Реклама для телефонов (снизу) -->
<div id="adBottomBar" class="ad-bottom">
  <img id="bottomAdImg" class="ad-img" src="" alt="Реклама">
  <button id="closeBottomBtn" class="close-ad-btn">✖ Закрыть</button>
</div>

<script>
  // ---------- РАСПИСАНИЕ (ОРИГИНАЛЬНЫЕ ДАННЫЕ) ----------
  var schedules = {
    "понедельник": ["Разговоры о какашках", "История", "Физкультура", "Алгебра", "География", "Обществознание", "Иностранный язык"],
    "вторник": ["Литература", "Русский язык", "ОБЖ", "Алгебра", "Физика", "Иностранный язык", "История"],
    "среда": ["Русский язык", "Литература", "География", "Химия", "Информатика", "Физкультура", "Труд"],
    "четверг": ["Говно фуууу", "Алгебра", "Геометрия", "Физика", "Биология", "Русский язык", "Литература"],
    "пятница": ["Вероятность и статистика", "Геометрия", "История", "Химия", "Биология", "Физика", "Иностранный язык"]
  };

  var times = [
    "8:30–9:15",
    "9:35–10:20",
    "10:40–11:25",
    "11:50–12:35",
    "12:55–13:40",
    "13:50–14:35",
    "14:40–15:25"
  ];

  var days = ["понедельник","вторник","среда","четверг","пятница"];
  var dayIndex = new Date().getDay() - 1;
  if (dayIndex < 0 || dayIndex > 4) dayIndex = 0;
  var showAll = false;

  // ---------- РЕНДЕР (полностью оригинальная логика + таблица/карточки) ----------
  function render() {
    var root = document.getElementById("content");
    root.innerHTML = "";
    document.getElementById("toggleBtn").textContent = showAll ? "Один день" : "Все дни";

    if (showAll) {
      for (var d = 0; d < days.length; d++) {
        renderDayBlock(root, days[d]);
      }
    } else {
      renderDayBlock(root, days[dayIndex]);
    }
  }

  function renderDayBlock(root, day) {
    var title = document.createElement("div");
    title.className = "day-title";
    title.textContent = day.charAt(0).toUpperCase() + day.slice(1);
    root.appendChild(title);

    // карточки (мобильные)
    for (var i = 0; i < schedules[day].length; i++) {
      var card = document.createElement("div");
      card.className = "card";
      var t = document.createElement("div");
      t.className = "time";
      t.textContent = times[i];
      var s = document.createElement("div");
      s.className = "subject";
      s.textContent = schedules[day][i];
      card.appendChild(t);
      card.appendChild(s);
      root.appendChild(card);
    }

    // таблица для ПК (отображается при ширине >=750, как в оригинале)
    if (window.innerWidth >= 750) {
      var table = document.createElement("table");
      var head = document.createElement("tr");
      addCell(head, "#", true);
      addCell(head, "Время", true);
      addCell(head, "Предмет", true);
      table.appendChild(head);
      for (var i = 0; i < schedules[day].length; i++) {
        var row = document.createElement("tr");
        addCell(row, i + 1, false);
        addCell(row, times[i], false);
        addCell(row, schedules[day][i], false);
        table.appendChild(row);
      }
      root.appendChild(table);
    }
  }

  function addCell(row, text, head) {
    var c = document.createElement(head ? "th" : "td");
    c.textContent = text;
    row.appendChild(c);
  }

  // ---------- НАВИГАЦИЯ ----------
  window.prevDay = function() {
    dayIndex = (dayIndex - 1 + days.length) % days.length;
    showAll = false;
    render();
  };
  window.nextDay = function() {
    dayIndex = (dayIndex + 1) % days.length;
    showAll = false;
    render();
  };
  window.toggleAll = function() {
    showAll = !showAll;
    render();
  };

  // ---------- РЕКЛАМА (ЦИКЛ С ЗАДЕРЖКОЙ 1с, на ПК кнопка не работает) ----------
  // три рекламных объявления (картинки-заглушки + ссылки)
  const adCampaigns = [
    {
      imgUrl: "https://placehold.co/600x400/2c2e3a/FFA559?text=CASE+BATTLE&font=montserrat",
      link: "https://case-battle.red/",
      alt: "Case Battle"
    },
    {
      imgUrl: "https://placehold.co/600x400/2e2a44/70D6FF?text=UPGRADER.PRO&font=montserrat",
      link: "https://upgrader.pro/ru",
      alt: "Upgrader Pro"
    },
    {
      imgUrl: "https://placehold.co/600x400/1d3b3f/FFC857?text=ГОСУСЛУГИ&font=montserrat",
      link: "https://contract.gosuslugi.ru/",
      alt: "Госуслуги"
    }
  ];

  let currentAdIndex = 0;
  let timeoutId = null;

  const bottomImg = document.getElementById("bottomAdImg");
  const bottomCloseBtn = document.getElementById("closeBottomBtn");
  const sidebarImg = document.getElementById("sidebarAdImg");
  const sidebarCloseBtn = document.getElementById("closeSidebarBtn");

  // --- обновление мобильной рекламы ---
  function updateMobileAd(index) {
    if (!bottomImg) return;
    const ad = adCampaigns[index % adCampaigns.length];
    bottomImg.src = ad.imgUrl;
    bottomImg.alt = ad.alt;
    bottomImg.onclick = (e) => {
      e.preventDefault();
      window.open(ad.link, "_blank");
    };
  }

  // --- эффект: пропадает на 1 секунду, потом новая картинка (зациклено) ---
  function cycleMobileAd() {
    if (!bottomImg) return;
    // прячем картинку (делаем прозрачной, но сохраняем размер)
    bottomImg.style.transition = "opacity 0.1s";
    bottomImg.style.opacity = "0";
    if (timeoutId) clearTimeout(timeoutId);
    timeoutId = setTimeout(() => {
      currentAdIndex = (currentAdIndex + 1) % adCampaigns.length;
      updateMobileAd(currentAdIndex);
      bottomImg.style.opacity = "1";
      timeoutId = null;
    }, 1000);
  }

  // инициализация мобильной рекламы
  if (bottomImg) {
    updateMobileAd(0);
    bottomImg.style.opacity = "1";
  }
  // кнопка закрыть для телефонов — запускает цикл смены
  if (bottomCloseBtn) {
    bottomCloseBtn.addEventListener("click", function() {
      cycleMobileAd();
    });
  }

  // ---------- ПК РЕКЛАМА (сбоку) — кнопка НЕ РАБОТАЕТ, только первая статичная реклама ----------
  if (sidebarImg) {
    const staticAd = adCampaigns[0];
    sidebarImg.src = staticAd.imgUrl;
    sidebarImg.alt = staticAd.alt;
    sidebarImg.onclick = (e) => {
      e.preventDefault();
      window.open(staticAd.link, "_blank");
    };
  }
  // кнопка закрытия на ПК — не делает ничего согласно тз
  if (sidebarCloseBtn) {
    sidebarCloseBtn.addEventListener("click", function(e) {
      e.preventDefault();
      // абсолютно никакого действия (не работает)
      console.log("ПК: кнопка закрыть не активна (по заданию)");
    });
  }

  // запускаем расписание
  render();
</script>

</body>
</html>
