<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
<title>Расписание — летающие рекламные плашки + рулетка</title>

<style>
  /* ===== ОРИГИНАЛЬНЫЙ СТИЛЬ РАСПИСАНИЯ ===== */
  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    padding: 0;
    font-family: system-ui, Arial, sans-serif;
    background: #121212;
    color: #e5e5e5;
    min-height: 100vh;
    position: relative;
  }

  header {
    text-align: center;
    padding: 18px;
    font-size: 22px;
    background: #1c1c1c;
    border-bottom: 1px solid #2a2a2a;
  }

  .container {
    max-width: 900px;
    margin: 0 auto;
    padding: 14px;
    position: relative;
    z-index: 1;
  }

  .card {
    background: #1c1c1c;
    border-radius: 10px;
    padding: 14px 16px;
    margin-bottom: 12px;
    border: 1px solid #2a2a2a;
  }

  .card .time {
    opacity: 0.7;
    font-size: 14px;
    margin-bottom: 4px;
  }

  .card .subject {
    font-size: 17px;
    font-weight: 500;
  }

  .day-title {
    font-size: 19px;
    margin: 20px 0 10px;
    opacity: 0.85;
  }

  .btns {
    display: flex;
    gap: 10px;
    margin-top: 20px;
    margin-bottom: 20px;
  }

  button {
    flex: 1;
    padding: 14px 0;
    background: #2d2d2d;
    border: none;
    border-radius: 8px;
    color: #e5e5e5;
    font-size: 16px;
    cursor: pointer;
  }

  button:active {
    background: #3a3a3a;
  }

  @media (min-width: 750px) {
    .card { display: none; }
    table { display: table; }
  }

  table {
    width: 100%;
    border-collapse: collapse;
    background: #1c1c1c;
    margin-bottom: 20px;
    border-radius: 10px;
    overflow: hidden;
  }

  th, td {
    padding: 12px;
    border-bottom: 1px solid #2a2a2a;
    text-align: center;
  }

  th {
    background: #222;
    font-weight: 600;
  }

  /* ===== РЕКЛАМНЫЕ ПЛАШКИ (белая обводка) — летающие ===== */
  .ad-float {
    position: fixed;
    background: #0a0a0a;
    border: 3px solid white;
    border-radius: 20px;
    box-shadow: 0 0 20px rgba(255,255,255,0.3);
    z-index: 1000;
    overflow: hidden;
    backdrop-filter: blur(4px);
    max-width: 260px;
    width: auto;
    min-width: 140px;
    will-change: left, top;
    cursor: default;
  }

  @media (max-width: 700px) {
    .ad-float { max-width: 180px; border-width: 2px; }
    .close-corner { width: 26px; height: 26px; font-size: 16px; }
  }

  .ad-inner { position: relative; display: block; width: 100%; }
  .ad-img { width: 100%; height: auto; display: block; cursor: pointer; object-fit: cover; }
  .close-corner {
    position: absolute; top: 4px; right: 6px; background: #cc3333; border: none;
    color: white; font-size: 18px; width: 30px; height: 30px; border-radius: 30px;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    z-index: 20; font-family: monospace;
  }
  .ad-float.hidden-temp { display: none; }

  /* Пиксельный распад (белые частицы) */
  .pixel-dust { position: fixed; width: 100%; height: 100%; top: 0; left: 0; pointer-events: none; z-index: 10001; }
  .pixel { position: absolute; border-radius: 2px; pointer-events: none; animation: flyAway 0.4s ease-out forwards; }
  @keyframes flyAway {
    0% { transform: translate(0, 0) rotate(0deg); opacity: 1; }
    100% { transform: translate(var(--dx), var(--dy)) rotate(360deg); opacity: 0; }
  }

  /* ===== МЕНЮ ТАРИФОВ (ЧЁРНО-БЕЛЫЙ СТИЛЬ) ===== */
  .tariff-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: #0a0c12;
    z-index: 20000;
    overflow-y: auto;
    padding: 20px;
    backdrop-filter: blur(10px);
    animation: fadeIn 0.3s;
  }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  
  .tariff-container {
    max-width: 600px;
    margin: 0 auto;
  }
  .tariff-title {
    font-size: 28px;
    text-align: center;
    margin: 20px 0;
    color: #ffffff;
    text-transform: uppercase;
    letter-spacing: 2px;
  }
  .tariff-card {
    background: #1a1e2a;
    border-radius: 24px;
    padding: 20px;
    margin-bottom: 20px;
    border: 2px solid #ffffff;
    transition: 0.1s;
  }
  .tariff-name {
    font-size: 26px;
    font-weight: bold;
    color: #ffffff;
  }
  .tariff-price {
    font-size: 32px;
    margin: 10px 0;
    color: #ffffff;
  }
  .tariff-features {
    list-style: none;
    padding: 0;
    margin: 15px 0;
  }
  .tariff-features li {
    padding: 6px 0;
    border-bottom: 1px solid #2a2e3a;
    color: #dddddd;
  }
  .buy-btn {
    background: #1a1e2a;
    border: 2px solid white;
    color: white;
    padding: 12px 20px;
    border-radius: 40px;
    font-size: 18px;
    cursor: pointer;
    width: 100%;
    margin-top: 10px;
    transition: 0.1s;
  }
  .buy-btn:active {
    background: #2a2e3a;
  }
  .close-tariff {
    text-align: center;
    margin-top: 40px;
    padding-bottom: 30px;
    color: #888;
    cursor: pointer;
    font-size: 16px;
  }
  .close-tariff:hover { color: #ffffff; }

  /* Форма оформления */
  .order-form {
    background: #0f111a;
    border-radius: 24px;
    padding: 20px;
    margin-top: 10px;
    border: 1px solid #333;
  }
  .order-form input, .order-form select {
    width: 100%;
    padding: 12px;
    margin: 8px 0;
    background: #1e2230;
    border: 1px solid #3a3e50;
    color: white;
    border-radius: 12px;
  }
  .order-form input:focus, .order-form select:focus {
    outline: none;
    border-color: white;
  }
  .invoice {
    background: #0a0c16;
    padding: 16px;
    border-radius: 16px;
    margin: 15px 0;
    border: 1px solid #333;
  }
  .invoice-row {
    display: flex;
    justify-content: space-between;
    padding: 8px 0;
    border-bottom: 1px solid #2a2e3e;
    color: #dddddd;
  }
  .total-row {
    font-weight: bold;
    font-size: 20px;
    color: #ffffff;
    border-top: 2px solid #ffffff;
    margin-top: 8px;
    padding-top: 12px;
  }
  #nextToInvoiceBtn {
    background: #2a2e3a;
    border: 2px solid #555;
    color: #888;
    cursor: not-allowed;
    opacity: 0.6;
    transition: 0.1s;
  }
  #nextToInvoiceBtn.active {
    background: #1a1e2a;
    border: 2px solid white;
    color: white;
    cursor: pointer;
    opacity: 1;
  }

  /* ===== КНОПКА ОТКЛЮЧЕНИЯ РЕКЛАМЫ ===== */
  .ad-killer {
    position: fixed;
    top: 20px;
    left: 20px;
    background: #111;
    border: 2px solid white;
    border-radius: 40px;
    padding: 8px 18px 8px 14px;
    z-index: 9999;
    display: flex;
    align-items: center;
    gap: 8px;
    cursor: pointer;
    backdrop-filter: blur(4px);
    font-weight: bold;
    box-shadow: 0 0 8px rgba(255,255,255,0.3);
  }
  .ad-killer .strike {
    font-size: 22px;
    font-weight: 800;
    color: #ff4444;
    text-decoration: line-through;
    text-decoration-thickness: 3px;
  }
  .ad-killer .label {
    font-size: 13px;
    color: white;
    font-family: monospace;
  }
  .ad-killer:active {
    transform: scale(0.95);
  }
</style>
</head>
<body>

<!-- КНОПКА ОТКЛЮЧЕНИЯ РЕКЛАМЫ -->
<div id="adKillerBtn" class="ad-killer">
  <span class="strike">AD</span>
  <span class="label">откл рекламу</span>
</div>

<header>Дима пьяный украинец</header>

<div class="container">
  <div id="content"></div>
  <div class="btns">
    <button onclick="prevDay()">← Пред.</button>
    <button onclick="toggleAll()" id="toggleBtn">Все дни</button>
    <button onclick="nextDay()">След. →</button>
  </div>
</div>

<script>
  // ========== РАСПИСАНИЕ ==========
  const schedules = {
    "понедельник": ["Разговоры о лудомании", "История", "Физкультура", "Алгебра", "География", "Обществознание", "Иностранный язык"],
    "вторник": ["Литература", "Русский язык", "ОБЖ", "Алгебра", "Физика", "Иностранный язык", "История"],
    "среда": ["Русский язык", "Литература", "География", "Химия", "Информатика", "Физкультура", "Труд"],
    "четверг": ["кейс батл", "Алгебра", "Геометрия", "Физика", "Биология", "Русский язык", "Литература"],
    "пятница": ["Вероятность и статистика", "Геометрия", "История", "Химия", "Биология", "Физика", "Иностранный язык"]
  };
  const times = ["8:30–9:15","9:35–10:20","10:40–11:25","11:50–12:35","12:55–13:40","13:50–14:35","14:40–15:25"];
  const days = ["понедельник","вторник","среда","четверг","пятница"];
  let dayIndex = (() => { let idx = new Date().getDay() - 1; return (idx >= 0 && idx <= 4) ? idx : 0; })();
  let showAll = false;

  function addCell(row, text, isHead) { let cell = document.createElement(isHead ? "th" : "td"); cell.textContent = text; row.appendChild(cell); }
  function renderDayBlock(container, day) {
    let title = document.createElement("div"); title.className = "day-title"; title.textContent = day.charAt(0).toUpperCase() + day.slice(1); container.appendChild(title);
    for (let i = 0; i < schedules[day].length; i++) {
      let card = document.createElement("div"); card.className = "card";
      let tSpan = document.createElement("div"); tSpan.className = "time"; tSpan.textContent = times[i];
      let sSpan = document.createElement("div"); sSpan.className = "subject"; sSpan.textContent = schedules[day][i];
      card.appendChild(tSpan); card.appendChild(sSpan); container.appendChild(card);
    }
    if (window.innerWidth >= 750) {
      let table = document.createElement("table"); let thead = document.createElement("tr");
      addCell(thead, "#", true); addCell(thead, "Время", true); addCell(thead, "Предмет", true); table.appendChild(thead);
      for (let i = 0; i < schedules[day].length; i++) {
        let row = document.createElement("tr"); addCell(row, i + 1, false); addCell(row, times[i], false); addCell(row, schedules[day][i], false); table.appendChild(row);
      }
      container.appendChild(table);
    }
  }
  function renderSchedule() { let root = document.getElementById("content"); root.innerHTML = ""; document.getElementById("toggleBtn").textContent = showAll ? "Один день" : "Все дни"; if (showAll) { for (let d of days) renderDayBlock(root, d); } else { renderDayBlock(root, days[dayIndex]); } }
  window.prevDay = () => { dayIndex = (dayIndex - 1 + days.length) % days.length; showAll = false; renderSchedule(); };
  window.nextDay = () => { dayIndex = (dayIndex + 1) % days.length; showAll = false; renderSchedule(); };
  window.toggleAll = () => { showAll = !showAll; renderSchedule(); };

  // ========== ЛЕТАЮЩИЕ РЕКЛАМНЫЕ ПЛАШКИ (DVD-эффект) ==========
  const adCampaigns = [
    { img: "images/casebattle.png", link: "https://case-battle.red/", alt: "Case Battle" },
    { img: "images/upgrader.png", link: "https://upgrader.pro/ru", alt: "Upgrader Pro" },
    { img: "images/gosuslugi.png", link: "https://contract.gosuslugi.ru/", alt: "Госуслуги" }
  ];
  
  let adPanels = [];
  let closedAdsCount = 0;
  let tariffOverlayActive = false;
  let animationFrameId = null;
  
  function updateAdPosition(ad) {
    if (!ad.element || ad.isClosing) return;
    if (ad.element.style.display === 'none') return;
    
    let rect = ad.element.getBoundingClientRect();
    let adWidth = rect.width;
    let adHeight = rect.height;
    
    let newX = ad.x + ad.vx;
    let newY = ad.y + ad.vy;
    
    if (newX <= 0) { newX = 0; ad.vx = Math.abs(ad.vx); }
    if (newX + adWidth >= window.innerWidth) { newX = window.innerWidth - adWidth; ad.vx = -Math.abs(ad.vx); }
    if (newY <= 0) { newY = 0; ad.vy = Math.abs(ad.vy); }
    if (newY + adHeight >= window.innerHeight) { newY = window.innerHeight - adHeight; ad.vy = -Math.abs(ad.vy); }
    
    ad.x = newX;
    ad.y = newY;
    ad.element.style.left = ad.x + 'px';
    ad.element.style.top = ad.y + 'px';
  }
  
  function startFlyingAnimation() {
    if (animationFrameId) cancelAnimationFrame(animationFrameId);
    function animate() {
      for (let ad of adPanels) {
        if (ad && ad.element && !tariffOverlayActive && !ad.isClosing) {
          updateAdPosition(ad);
        }
      }
      animationFrameId = requestAnimationFrame(animate);
    }
    animate();
  }
  
  function getRandomPositionAndDirection(adElement) {
    if (!adElement) return { x: 20, y: 20, vx: 0.8, vy: 0.8 };
    const adWidth = adElement.offsetWidth || 180;
    const adHeight = adElement.offsetHeight || 140;
    const maxX = Math.max(10, window.innerWidth - adWidth - 10);
    const maxY = Math.max(10, window.innerHeight - adHeight - 10);
    let x = Math.random() * maxX;
    let y = Math.random() * maxY;
    let vx = (Math.random() * 1.0 + 0.5) * (Math.random() > 0.5 ? 1 : -1);
    let vy = (Math.random() * 1.0 + 0.5) * (Math.random() > 0.5 ? 1 : -1);
    if (Math.abs(vx) < 0.4) vx = vx > 0 ? 0.6 : -0.6;
    if (Math.abs(vy) < 0.4) vy = vy > 0 ? 0.6 : -0.6;
    return { x, y, vx, vy };
  }
  
  function updateAdImage(ad) {
    const campaign = adCampaigns[ad.imageIndex % adCampaigns.length];
    if (ad.imgElement) {
      ad.imgElement.src = campaign.img;
      ad.imgElement.alt = campaign.alt;
      ad.imgElement.onclick = (e) => { e.preventDefault(); window.open(campaign.link, "_blank"); };
    }
  }
  
  function pixelExplode(element, callback) {
    if (!element) { if(callback) callback(); return; }
    const rect = element.getBoundingClientRect();
    const width = rect.width, height = rect.height, left = rect.left, top = rect.top;
    const dustContainer = document.createElement('div'); dustContainer.className = 'pixel-dust'; document.body.appendChild(dustContainer);
    const pixelSize = 8, cols = Math.ceil(width / pixelSize), rows = Math.ceil(height / pixelSize);
    for (let i = 0; i < cols; i++) {
      for (let j = 0; j < rows; j++) {
        const pixel = document.createElement('div'); pixel.className = 'pixel';
        pixel.style.left = (left + i * pixelSize) + 'px'; pixel.style.top = (top + j * pixelSize) + 'px';
        pixel.style.width = pixelSize + 'px'; pixel.style.height = pixelSize + 'px';
        pixel.style.backgroundColor = '#ffffff';
        pixel.style.boxShadow = '0 0 4px rgba(255,255,255,0.8)';
        const angle = Math.random() * Math.PI * 2; const distance = 80 + Math.random() * 150;
        pixel.style.setProperty('--dx', Math.cos(angle) * distance + 'px'); pixel.style.setProperty('--dy', Math.sin(angle) * distance + 'px');
        dustContainer.appendChild(pixel);
        setTimeout(() => { if(pixel && pixel.remove) pixel.remove(); }, 450);
      }
    }
    element.style.visibility = 'hidden'; element.style.opacity = '0';
    setTimeout(() => { if(dustContainer && dustContainer.remove) dustContainer.remove(); if(callback) callback(); }, 200);
  }
  
  function closeAdWithAnimation(ad, onComplete) {
    if (!ad || !ad.element || ad.isClosing) { if(onComplete) onComplete(); return; }
    ad.isClosing = true;
    const element = ad.element;
    element.style.pointerEvents = 'none';
    pixelExplode(element, () => {
      element.classList.add('hidden-temp');
      element.style.visibility = 'hidden';
      ad.imageIndex = (ad.imageIndex + 1) % adCampaigns.length;
      updateAdImage(ad);
      const newPos = getRandomPositionAndDirection(ad.element);
      ad.x = newPos.x;
      ad.y = newPos.y;
      ad.vx = newPos.vx;
      ad.vy = newPos.vy;
      ad.element.style.left = ad.x + 'px';
      ad.element.style.top = ad.y + 'px';
      element.classList.remove('hidden-temp');
      ad.isClosing = false;
      element.style.visibility = 'visible';
      element.style.opacity = '1';
      element.style.animation = 'none';
      element.offsetHeight;
      element.style.animation = 'popIn 0.2s cubic-bezier(0.34, 1.2, 0.64, 1)';
      element.style.pointerEvents = '';
      if (onComplete) onComplete();
    });
  }
  
  function createAdPanel() {
    const div = document.createElement("div"); div.className = "ad-float";
    const inner = document.createElement("div"); inner.className = "ad-inner";
    const img = document.createElement("img"); img.className = "ad-img";
    const closeBtn = document.createElement("button"); closeBtn.className = "close-corner"; closeBtn.textContent = "✖";
    inner.appendChild(img); inner.appendChild(closeBtn); div.appendChild(inner); document.body.appendChild(div);
    
    const initPos = getRandomPositionAndDirection(div);
    div.style.left = initPos.x + 'px';
    div.style.top = initPos.y + 'px';
    
    const adObj = {
      element: div,
      imgElement: img,
      closeBtn,
      imageIndex: Math.floor(Math.random() * adCampaigns.length),
      isClosing: false,
      x: initPos.x,
      y: initPos.y,
      vx: initPos.vx,
      vy: initPos.vy
    };
    updateAdImage(adObj);
    
    closeBtn.addEventListener("click", (e) => {
      e.stopPropagation();
      if (adObj.isClosing || tariffOverlayActive) return;
      closedAdsCount++;
      closeAdWithAnimation(adObj, () => {
        if (closedAdsCount >= 3 && !tariffOverlayActive) {
          showTariffMenu();
        }
      });
    });
    return adObj;
  }
  
  function hideAllAds() {
    for (let ad of adPanels) {
      if (ad && ad.element) ad.element.style.display = 'none';
    }
  }
  function showAllAds() {
    for (let ad of adPanels) {
      if (ad && ad.element) ad.element.style.display = '';
    }
  }
  function killAllAdsPermanently() {
    for (let ad of adPanels) {
      if (ad && ad.element) ad.element.remove();
    }
    adPanels = [];
    if (animationFrameId) cancelAnimationFrame(animationFrameId);
  }
  
  // ========== ТАРИФЫ (полная версия) ==========
  function showTariffMenu() {
    if (tariffOverlayActive) return;
    tariffOverlayActive = true;
    hideAllAds();
    
    const overlay = document.createElement('div'); overlay.className = 'tariff-overlay';
    overlay.innerHTML = `
      <div class="tariff-container">
        <div class="tariff-title">💸 VIP ТАРИФЫ ДЛЯ ПИЗДАТЫХ 💸</div>
        <div class="tariff-card" data-tariff="premium">
          <div class="tariff-name">🚀 ZA SVO</div>
          <div class="tariff-price">₴ 99 999</div>
          <ul class="tariff-features">
            <li>✅ Доступ к расписанию</li>
            <li>✅ Личный "Дима пьяный украинец"</li>
            <li>✅ Ваня воздухан</li>
            <li>✅ Клеймо еблана</li>
          </ul>
          <button class="buy-btn" data-price="99999" data-name="ZA SVO">КУПИТЬ ЗА 99 999 ₴</button>
        </div>
        <div class="tariff-card" data-tariff="ultra">
          <div class="tariff-name">👑 КОРОЛЬ ВОЗДУХА</div>
          <div class="tariff-price">₴ 499 999</div>
          <ul class="tariff-features">
            <li>✅ Все фишки премиума</li>
            <li>✅ Реклама будет закрываться за тебя (может быть)</li>
            <li>✅ Огромные ЯЙЦА</li>
            <li>✅ Кейс батл не будет давать диме</li>
          </ul>
          <button class="buy-btn" data-price="499999" data-name="КОРОЛЬ ВОЗДУХА">КУПИТЬ ЗА 499 999 ₴</button>
        </div>
        <div class="tariff-card" data-tariff="god">
          <div class="tariff-name">⚡ У МЕНЯ ЧЕРВИ В ГЛАЗАХ</div>
          <div class="tariff-price">₴ 1 337 000</div>
          <ul class="tariff-features">
            <li>✅ Тимошина пожрет говна</li>
            <li>✅ Бонуска в кб +10%</li>
            <li>✅ Стальные яйки</li>
            <li>✅ Бессрочная гарантия на </li>
          </ul>
          <button class="buy-btn" data-price="1337000" data-name="У МЕНЯ ЧЕРВИ В ГЛАЗАХ">КУПИТЬ ЗА 1 337 000 ₴</button>
        </div>
        <div class="close-tariff" id="closeTariffBtn">❌ нет, спасибо, я бедный ❌</div>
      </div>
    `;
    document.body.appendChild(overlay);
    
    overlay.querySelectorAll('.buy-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        const price = parseInt(btn.dataset.price);
        const name = btn.dataset.name;
        showOrderForm(overlay, price, name);
      });
    });
    const closeBtnEl = overlay.querySelector('#closeTariffBtn');
    closeBtnEl.addEventListener('click', () => {
      overlay.remove();
      tariffOverlayActive = false;
      showAllAds();
      closedAdsCount = 0;
    });
  }
  
  function showOrderForm(overlay, basePrice, tariffName) {
    const container = overlay.querySelector('.tariff-container');
    container.innerHTML = `
      <div class="tariff-title">📝 ОФОРМЛЕНИЕ ТАРИФА "${tariffName}"</div>
      <div class="order-form">
        <input type="text" id="fullName" placeholder="ФИО (как в паспорте)">
        <input type="text" id="passport" placeholder="Серия и номер паспорта">
        <input type="text" id="phone" placeholder="Телефон (обязательно)">
        <input type="text" id="address" placeholder="Адрес прописки">
        <select id="delivery">
          <option value="0">Курьером в зубы (+500₴)</option>
          <option value="1">Почтой Украины (+200₴)</option>
          <option value="2">Телепортация (ещё нет) (+9999₴)</option>
        </select>
        <button id="nextToInvoiceBtn" disabled>👉 ПЕРЕЙТИ К ОПЛАТЕ 👈</button>
      </div>
      <div class="close-tariff" id="backToTariffs">◀ Назад к тарифам</div>
    `;
    
    const fullNameInput = document.getElementById('fullName');
    const passportInput = document.getElementById('passport');
    const phoneInput = document.getElementById('phone');
    const addressInput = document.getElementById('address');
    const nextBtn = document.getElementById('nextToInvoiceBtn');
    
    function checkFormComplete() {
      const allFilled = fullNameInput.value.trim() !== '' &&
                        passportInput.value.trim() !== '' &&
                        phoneInput.value.trim() !== '' &&
                        addressInput.value.trim() !== '';
      nextBtn.disabled = !allFilled;
      if (allFilled) nextBtn.classList.add('active');
      else nextBtn.classList.remove('active');
    }
    
    fullNameInput.addEventListener('input', checkFormComplete);
    passportInput.addEventListener('input', checkFormComplete);
    phoneInput.addEventListener('input', checkFormComplete);
    addressInput.addEventListener('input', checkFormComplete);
    checkFormComplete();
    
    const backBtn = container.querySelector('#backToTariffs');
    backBtn.addEventListener('click', () => {
      overlay.remove();
      showTariffMenu();
    });
    
    nextBtn.addEventListener('click', () => {
      if (nextBtn.disabled) return;
      const deliverySelect = document.getElementById('delivery');
      let deliveryCost = 0, deliveryText = "";
      switch(deliverySelect.value) {
        case "0": deliveryCost = 500; deliveryText = "Курьером в зубы"; break;
        case "1": deliveryCost = 200; deliveryText = "Почтой Украины"; break;
        case "2": deliveryCost = 9999; deliveryText = "Телепортация"; break;
      }
      const commissions = [
        { name: "Комиссия за что-то", percent: 15 },
        { name: "Сбор Кирушэ на депозит", percent: 12 },
        { name: "Налог", percent: 8 },
        { name: "Плата за воздух", percent: 5 }
      ];
      let total = basePrice + deliveryCost;
      let commissionRows = [];
      for (let comm of commissions) {
        let amount = Math.round(total * comm.percent / 100);
        commissionRows.push({ name: comm.name, amount: amount, percent: comm.percent });
        total += amount;
      }
      total = Math.round(total);
      
      let invoiceHtml = `<div class="invoice"><div class="invoice-row"><span>💰 Тариф "${tariffName}"</span><span>${basePrice.toLocaleString()} ₴</span></div>`;
      invoiceHtml += `<div class="invoice-row"><span>🚚 Доставка: ${deliveryText}</span><span>+${deliveryCost.toLocaleString()} ₴</span></div>`;
      for (let cr of commissionRows) {
        invoiceHtml += `<div class="invoice-row"><span>${cr.name} (${cr.percent}%)</span><span>+${cr.amount.toLocaleString()} ₴</span></div>`;
      }
      invoiceHtml += `<div class="invoice-row total-row"><span>🐷 ИТОГО К ОПЛАТЕ</span><span>${total.toLocaleString()} ₴</span></div>`;
      invoiceHtml += `<div style="font-size:12px; opacity:0.6; margin-top:12px;">Комиссия за что-то уже включена</div></div>`;
      invoiceHtml += `<button id="payFinalBtn" style="background:#1a1e2a; border:2px solid white; color:white; width:100%; padding:14px; border-radius:40px; font-size:18px;">💳 ОПЛАТИТЬ 💳</button>`;
      
      container.innerHTML = `
        <div class="tariff-title">🧾 ЧЕК НА ОПЛАТУ</div>
        ${invoiceHtml}
        <div class="close-tariff" id="backToForm" style="margin-top:20px;">◀ Редактировать данные</div>
      `;
      const backForm = container.querySelector('#backToForm');
      backForm.addEventListener('click', () => { showOrderForm(overlay, basePrice, tariffName); });
      const payBtn = container.querySelector('#payFinalBtn');
      payBtn.addEventListener('click', () => {
        window.open("https://sovcombank.ru/apply/credit/city-spb/", "_blank");
      });
    });
  }
  
  // ========== ВЗРЫВ ЭКРАНА (ЧЁРНЫМИ ПИКСЕЛЯМИ) И РУЛЕТКА ==========
  function explodeToRoulette() {
    const dust = document.createElement('div');
    dust.className = 'pixel-dust';
    document.body.appendChild(dust);
    
    const w = window.innerWidth, h = window.innerHeight;
    const pixelSize = 12;
    const cols = Math.ceil(w / pixelSize);
    const rows = Math.ceil(h / pixelSize);
    
    for (let i = 0; i < cols; i++) {
      for (let j = 0; j < rows; j++) {
        const pixel = document.createElement('div');
        pixel.className = 'pixel';
        pixel.style.left = (i * pixelSize) + 'px';
        pixel.style.top = (j * pixelSize) + 'px';
        pixel.style.width = pixelSize + 'px';
        pixel.style.height = pixelSize + 'px';
        pixel.style.backgroundColor = '#000000';
        const angle = Math.random() * Math.PI * 2;
        const distance = 100 + Math.random() * 200;
        pixel.style.setProperty('--dx', Math.cos(angle) * distance + 'px');
        pixel.style.setProperty('--dy', Math.sin(angle) * distance + 'px');
        dust.appendChild(pixel);
        setTimeout(() => { if(pixel && pixel.remove) pixel.remove(); }, 500);
      }
    }
    
    setTimeout(() => {
      document.body.innerHTML = '';
      document.body.style.background = '#000';
      showRouletteGame();
    }, 350);
  }
  
  // ========== РУЛЕТКА (КЕЙС БАТЛ СТИЛЬ, ЧЁРНО-БЕЛАЯ) ==========
  let inventory = [
    { name: "Твои яйки", price: 50 },
    { name: "Мама", price: 10 },
    { name: "Сифилис", price: 100 }
  ];
  let selectedItemIdx = 0;
  let currentMultiplier = 2; // 2, 5, 10
  let spinning = false;
  let arrowAngle = 0;
  let animFrameArrow = null;
  
  function getChancePercent(mult) {
    if (mult === 2) return 50;
    if (mult === 5) return 20;
    if (mult === 10) return 10;
    return 50;
  }
  
  function drawFillCanvas(percent) {
    const canvas = document.getElementById("fillCanvas");
    if (!canvas) return;
    const ctx = canvas.getContext("2d");
    const w = canvas.width = 260;
    const h = canvas.height = 260;
    ctx.clearRect(0, 0, w, h);
    const angle = (percent / 100) * 360;
    const startAngle = -90;
    const endAngle = startAngle + angle;
    ctx.beginPath();
    ctx.moveTo(130, 130);
    ctx.arc(130, 130, 120, startAngle * Math.PI / 180, endAngle * Math.PI / 180);
    ctx.fillStyle = "#ffffff";
    ctx.fill();
    ctx.beginPath();
    ctx.arc(130, 130, 120, endAngle * Math.PI / 180, (startAngle + 360) * Math.PI / 180);
    ctx.fillStyle = "#1a1a1a";
    ctx.fill();
    ctx.strokeStyle = "#000";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(130, 130, 120, 0, 2 * Math.PI);
    ctx.stroke();
    ctx.fillStyle = "#000";
    ctx.font = "bold 26px monospace";
    ctx.fillText(percent + "%", 98, 155);
  }
  
  function drawArrow(angleDeg) {
    const canvas = document.getElementById("arrowCanvas");
    if (!canvas) return;
    const ctx = canvas.getContext("2d");
    const w = canvas.width = 260;
    const h = canvas.height = 260;
    ctx.clearRect(0, 0, w, h);
    ctx.save();
    ctx.translate(130, 130);
    ctx.rotate(angleDeg * Math.PI / 180);
    ctx.beginPath();
    ctx.moveTo(0, -110);
    ctx.lineTo(-12, -30);
    ctx.lineTo(0, -40);
    ctx.lineTo(12, -30);
    ctx.fillStyle = "#ffffff";
    ctx.fill();
    ctx.beginPath();
    ctx.arc(0, 0, 20, 0, 2 * Math.PI);
    ctx.fillStyle = "#222";
    ctx.fill();
    ctx.strokeStyle = "white";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(0, 0, 20, 0, 2 * Math.PI);
    ctx.stroke();
    ctx.restore();
  }
  
  async function spinAndGetResult() {
    if (spinning) return;
    spinning = true;
    const resultMsg = document.getElementById("resultMsg");
    resultMsg.innerHTML = "🎲 Крутим... 🎲";
    
    await new Promise(r => setTimeout(r, 300));
    
    const chance = getChancePercent(currentMultiplier);
    const win = Math.random() * 100 <= chance;
    const betItem = inventory[selectedItemIdx];
    const winAmount = betItem.price * currentMultiplier;
    
    const spins = 8 + Math.random() * 6;
    const finalAngle = Math.random() * 360;
    const totalAngle = spins * 360 + finalAngle;
    const startA = arrowAngle;
    const duration = 1800;
    const startTime = performance.now();
    
    await new Promise((resolve) => {
      function stepAnim(now) {
        let t = Math.min(1, (now - startTime) / duration);
        let easeOut = 1 - Math.pow(1 - t, 2.5);
        let ang = startA + totalAngle * easeOut;
        arrowAngle = ang % 360;
        drawArrow(arrowAngle);
        if (t < 1) requestAnimationFrame(stepAnim);
        else resolve();
      }
      requestAnimationFrame(stepAnim);
    });
    
    if (win) {
      const newItem = { name: betItem.name, price: winAmount };
      inventory.push(newItem);
      resultMsg.innerHTML = `🎉 МАЛАДЕЦ! ВЫ ВЫИГРАЛИ ${winAmount}₴ (${betItem.name} x${currentMultiplier}) 🎉\n➕ Предмет добавлен в инвентарь`;
      renderInventory();
    } else {
      if (inventory.length > 1) {
        inventory.splice(selectedItemIdx, 1);
        if (selectedItemIdx >= inventory.length) selectedItemIdx = 0;
      } else {
        inventory[0].price = Math.max(1, Math.floor(inventory[0].price / 2));
      }
      resultMsg.innerHTML = `😭 НЕ БЕДА! ВЫ ПРОИГРАЛИ ${betItem.price}₴ (${betItem.name}) 😭`;
      renderInventory();
    }
    spinning = false;
  }
  
  function renderInventory() {
    const container = document.getElementById("inventoryItems");
    if (!container) return;
    container.innerHTML = inventory.map((item, idx) => `
      <div class="item-card ${selectedItemIdx === idx ? 'selected' : ''}" data-idx="${idx}">
        <div class="item-name">${item.name}</div>
        <div class="item-price">${item.price} ₴</div>
      </div>
    `).join('');
    document.querySelectorAll('.item-card').forEach(card => {
      card.addEventListener('click', () => {
        selectedItemIdx = parseInt(card.dataset.idx);
        renderInventory();
        const chance = getChancePercent(currentMultiplier);
        document.getElementById("resultMsg").innerHTML = `Выбрано: ${inventory[selectedItemIdx].name} (${inventory[selectedItemIdx].price}₴) | Множитель x${currentMultiplier} | Шанс ${chance}%`;
      });
    });
  }
  
  function showRouletteGame() {
    const container = document.createElement('div');
    container.className = 'roulette-overlay';
    container.style.position = 'fixed';
    container.style.top = '0';
    container.style.left = '0';
    container.style.width = '100%';
    container.style.height = '100%';
    container.style.background = '#0a0a0a';
    container.style.zIndex = '30000';
    container.style.display = 'flex';
    container.style.justifyContent = 'center';
    container.style.alignItems = 'center';
    container.style.fontFamily = 'monospace';
    container.innerHTML = `
      <div style="background: #111; border: 2px solid white; border-radius: 48px; padding: 24px; width: 520px; max-width: 92vw; text-align: center;">
        <div style="position: relative; width: 260px; height: 260px; margin: 0 auto 20px;">
          <canvas id="fillCanvas" width="260" height="260" style="position: absolute; top:0; left:0;"></canvas>
          <canvas id="arrowCanvas" width="260" height="260" style="position: absolute; top:0; left:0;"></canvas>
        </div>
        <div style="display: flex; gap: 16px; justify-content: center; margin: 15px 0;">
          <button class="mult-btn" data-mult="2" style="background: #1a1a1a; border: 1px solid white; padding: 8px 24px; border-radius: 40px; cursor: pointer; font-weight: bold;">x2 (50%)</button>
          <button class="mult-btn" data-mult="5" style="background: #1a1a1a; border: 1px solid white; padding: 8px 24px; border-radius: 40px; cursor: pointer; font-weight: bold;">x5 (20%)</button>
          <button class="mult-btn" data-mult="10" style="background: #1a1a1a; border: 1px solid white; padding: 8px 24px; border-radius: 40px; cursor: pointer; font-weight: bold;">x10 (10%)</button>
        </div>
        <button id="spinBtn" style="background: white; color: black; font-weight: bold; font-size: 22px; padding: 12px 24px; border: none; border-radius: 60px; cursor: pointer; width: 80%; margin: 10px 0;">🎡 КРУТИТЬ 🎡</button>
        <div style="background: #1a1a1a; border-radius: 32px; padding: 16px; margin: 20px 0 10px; border: 1px solid #333;">
          <div style="font-size: 14px; color: #aaa; margin-bottom: 12px;">🎒 ИНВЕНТАРЬ (выбери предмет)</div>
          <div id="inventoryItems" style="display: flex; gap: 12px; justify-content: space-between;"></div>
        </div>
        <div id="resultMsg" style="background: #0a0a0a; border-radius: 30px; padding: 12px; margin-top: 16px; font-size: 15px; min-height: 70px;">Выберите предмет и множитель</div>
      </div>
    `;
    document.body.appendChild(container);
    
    drawFillCanvas(50);
    arrowAngle = 0;
    drawArrow(0);
    selectedItemIdx = 0;
    renderInventory();
    
    document.querySelectorAll('.mult-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        currentMultiplier = parseInt(btn.dataset.mult);
        document.querySelectorAll('.mult-btn').forEach(b => b.style.background = '#1a1a1a');
        btn.style.background = 'white';
        btn.style.color = 'black';
        drawFillCanvas(getChancePercent(currentMultiplier));
        const chance = getChancePercent(currentMultiplier);
        document.getElementById("resultMsg").innerHTML = `Выбрано: ${inventory[selectedItemIdx].name} (${inventory[selectedItemIdx].price}₴) | Множитель x${currentMultiplier} | Шанс ${chance}%`;
      });
    });
    document.querySelector('.mult-btn[data-mult="2"]').style.background = 'white';
    document.querySelector('.mult-btn[data-mult="2"]').style.color = 'black';
    drawFillCanvas(50);
    
    document.getElementById("spinBtn").addEventListener("click", () => {
      if (spinning) return;
      if (inventory.length === 0) {
        document.getElementById("resultMsg").innerHTML = "❌ Инвентарь пуст! Обновите страницу";
        return;
      }
      spinAndGetResult();
    });
    document.getElementById("resultMsg").innerHTML = `Выбрано: ${inventory[0].name} (${inventory[0].price}₴) | Множитель x2 | Шанс 50%`;
  }
  
  // ========== ЗАПУСК ==========
  function initAds() {
    for (let ad of adPanels) { if(ad && ad.element) ad.element.remove(); }
    adPanels = [];
    closedAdsCount = 0;
    for (let i = 0; i < 5; i++) { 
      adPanels.push(createAdPanel()); 
    }
    startFlyingAnimation();
  }
  
  // КНОПКА ОТКЛЮЧЕНИЯ РЕКЛАМЫ
  const killBtn = document.getElementById('adKillerBtn');
  killBtn.addEventListener('click', () => {
    killAllAdsPermanently();
    killBtn.remove();
    explodeToRoulette();
  });
  
  window.addEventListener("resize", () => {
    if(!tariffOverlayActive) {
      for(let ad of adPanels) {
        let maxX = window.innerWidth - ad.element.offsetWidth;
        let maxY = window.innerHeight - ad.element.offsetHeight;
        if (ad.x > maxX) ad.x = Math.max(0, maxX);
        if (ad.y > maxY) ad.y = Math.max(0, maxY);
        ad.element.style.left = ad.x + 'px';
        ad.element.style.top = ad.y + 'px';
        if (ad.x <= 0) ad.vx = Math.abs(ad.vx);
        if (ad.x + ad.element.offsetWidth >= window.innerWidth) ad.vx = -Math.abs(ad.vx);
        if (ad.y <= 0) ad.vy = Math.abs(ad.vy);
        if (ad.y + ad.element.offsetHeight >= window.innerHeight) ad.vy = -Math.abs(ad.vy);
      }
    }
    renderSchedule();
  });
  
  renderSchedule();
  initAds();
</script>
