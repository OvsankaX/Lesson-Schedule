<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
<title>Расписание — упоротая реклама</title>

<style>
  /* ОРИГИНАЛЬНЫЙ СТИЛЬ (как в первой версии, без смещений) */
  body {
    margin: 0;
    padding: 0;
    font-family: system-ui, Arial, sans-serif;
    background: #121212;
    color: #e5e5e5;
  }

  header {
    text-align: center;
    padding: 18px;
    font-size: 22px;
    background: #1c1c1c;
    border-bottom: 1px solid #2a2a2a;
  }

  .container {
    max-width: 900px;
    margin: 0 auto;
    padding: 14px;
  }

  .card {
    background: #1c1c1c;
    border-radius: 10px;
    padding: 14px 16px;
    margin-bottom: 12px;
    border: 1px solid #2a2a2a;
  }

  .card .time {
    opacity: 0.7;
    font-size: 14px;
    margin-bottom: 4px;
  }

  .card .subject {
    font-size: 17px;
    font-weight: 500;
  }

  .day-title {
    font-size: 19px;
    margin: 20px 0 10px;
    opacity: 0.85;
  }

  .btns {
    display: flex;
    gap: 10px;
    margin-top: 20px;
  }

  button {
    flex: 1;
    padding: 14px 0;
    background: #2d2d2d;
    border: none;
    border-radius: 8px;
    color: #e5e5e5;
    font-size: 16px;
    cursor: pointer;
  }

  /* таблица — оригинальная, без левых отступов */
  @media (min-width: 750px) {
    .card { display: none; }
    table { display: table; }
  }

  table {
    width: 100%;
    border-collapse: collapse;
    background: #1c1c1c;
    margin-bottom: 20px;
    border-radius: 10px;
    overflow: hidden;
  }

  th, td {
    padding: 12px;
    border-bottom: 1px solid #2a2a2a;
    text-align: center;
  }

  th {
    background: #222;
    font-weight: 600;
  }

  /* ============= РЕКЛАМА — УПОРОТАЯ ============= */
  /* ПК — плашка сбоку, закрывается целиком, картинка на всю ширину, кнопка-крестик */
  .ad-sidebar {
    position: fixed;
    right: 20px;
    top: 50%;
    transform: translateY(-50%);
    width: 240px;
    background: #0a0a0a;
    border-radius: 20px;
    border: 2px solid #ff6600;
    box-shadow: 0 0 20px rgba(255,100,0,0.5);
    z-index: 1000;
    overflow: hidden;
    transition: all 0.2s;
  }

  .ad-sidebar .img-wrapper {
    position: relative;
    display: block;
  }

  .ad-sidebar .ad-img {
    width: 100%;
    height: auto;
    display: block;
    cursor: pointer;
  }

  .ad-sidebar .close-corner {
    position: absolute;
    top: 6px;
    right: 8px;
    background: #aa2222;
    border: none;
    color: white;
    font-size: 18px;
    font-weight: bold;
    width: 32px;
    height: 32px;
    border-radius: 30px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 0 6px black;
    z-index: 10;
  }

  /* Мобильная реклама — на всю ширину низа, картинка растянута упорото */
  .ad-bottom {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background: #000000cc;
    backdrop-filter: blur(4px);
    z-index: 1100;
    transition: 0.2s;
    border-top: 3px solid #ff8800;
  }

  .ad-bottom .img-wrapper {
    position: relative;
    width: 100%;
    display: block;
  }

  .ad-bottom .ad-img {
    width: 100%;
    height: auto;
    max-height: 140px;
    object-fit: cover;
    display: block;
    cursor: pointer;
  }

  .ad-bottom .close-corner {
    position: absolute;
    top: 6px;
    right: 10px;
    background: #cc3333;
    border: none;
    color: white;
    font-size: 22px;
    font-weight: bold;
    width: 38px;
    height: 38px;
    border-radius: 40px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 0 4px black;
    z-index: 15;
  }

  /* адаптив: скрываем/показываем нужный блок */
  @media (min-width: 1000px) {
    .ad-bottom { display: none; }
    .ad-sidebar { display: block; }
  }

  @media (max-width: 999px) {
    .ad-sidebar { display: none; }
    .ad-bottom { display: block; }
    body {
      padding-bottom: 150px;
    }
  }

  /* отступ для контента — чтобы не налезало на рекламу на ПК */
  @media (min-width: 1000px) {
    .container {
      margin-right: 280px;
    }
  }
</style>
</head>
<body>

<header>Дима пьяный украинец</header>

<div class="container">
  <div id="content"></div>
  <div class="btns">
    <button onclick="prevDay()">← Пред.</button>
    <button onclick="toggleAll()" id="toggleBtn">Все дни</button>
    <button onclick="nextDay()">След. →</button>
  </div>
</div>

<!-- РЕКЛАМА ДЛЯ ПК (сбоку, закрывается целиком, картинка растянута) -->
<div id="pcAdBlock" class="ad-sidebar" style="display: none;">
  <div class="img-wrapper">
    <img id="pcAdImg" class="ad-img" src="" alt="Реклама">
    <button id="pcCloseBtn" class="close-corner">✖</button>
  </div>
</div>

<!-- РЕКЛАМА ДЛЯ ТЕЛЕФОНОВ (снизу, на всю ширину, крестик углу) -->
<div id="mobileAdBlock" class="ad-bottom" style="display: none;">
  <div class="img-wrapper">
    <img id="mobileAdImg" class="ad-img" src="" alt="Реклама">
    <button id="mobileCloseBtn" class="close-corner">✖</button>
  </div>
</div>

<script>
  // ---------- РАСПИСАНИЕ ----------
  const schedules = {
    "понедельник": ["Разговоры о какашках", "История", "Физкультура", "Алгебра", "География", "Обществознание", "Иностранный язык"],
    "вторник": ["Литература", "Русский язык", "ОБЖ", "Алгебра", "Физика", "Иностранный язык", "История"],
    "среда": ["Русский язык", "Литература", "География", "Химия", "Информатика", "Физкультура", "Труд"],
    "четверг": ["Говно фуууу", "Алгебра", "Геометрия", "Физика", "Биология", "Русский язык", "Литература"],
    "пятница": ["Вероятность и статистика", "Геометрия", "История", "Химия", "Биология", "Физика", "Иностранный язык"]
  };
  const times = ["8:30–9:15","9:35–10:20","10:40–11:25","11:50–12:35","12:55–13:40","13:50–14:35","14:40–15:25"];
  const days = ["понедельник","вторник","среда","четверг","пятница"];
  let dayIndex = (() => {
    let idx = new Date().getDay() - 1;
    return (idx >= 0 && idx <= 4) ? idx : 0;
  })();
  let showAll = false;

  function addCell(row, text, head) {
    let c = document.createElement(head ? "th" : "td");
    c.textContent = text;
    row.appendChild(c);
  }

  function renderDayBlock(root, day) {
    let title = document.createElement("div");
    title.className = "day-title";
    title.textContent = day.charAt(0).toUpperCase() + day.slice(1);
    root.appendChild(title);
    // карточки
    for (let i = 0; i < schedules[day].length; i++) {
      let card = document.createElement("div");
      card.className = "card";
      let t = document.createElement("div");
      t.className = "time";
      t.textContent = times[i];
      let s = document.createElement("div");
      s.className = "subject";
      s.textContent = schedules[day][i];
      card.appendChild(t);
      card.appendChild(s);
      root.appendChild(card);
    }
    // таблица для широких экранов
    if (window.innerWidth >= 750) {
      let table = document.createElement("table");
      let head = document.createElement("tr");
      addCell(head, "#", true);
      addCell(head, "Время", true);
      addCell(head, "Предмет", true);
      table.appendChild(head);
      for (let i = 0; i < schedules[day].length; i++) {
        let row = document.createElement("tr");
        addCell(row, i + 1, false);
        addCell(row, times[i], false);
        addCell(row, schedules[day][i], false);
        table.appendChild(row);
      }
      root.appendChild(table);
    }
  }

  function render() {
    let root = document.getElementById("content");
    root.innerHTML = "";
    document.getElementById("toggleBtn").textContent = showAll ? "Один день" : "Все дни";
    if (showAll) {
      for (let d of days) renderDayBlock(root, d);
    } else {
      renderDayBlock(root, days[dayIndex]);
    }
  }

  window.prevDay = () => { dayIndex = (dayIndex - 1 + days.length) % days.length; showAll = false; render(); };
  window.nextDay = () => { dayIndex = (dayIndex + 1) % days.length; showAll = false; render(); };
  window.toggleAll = () => { showAll = !showAll; render(); };

  // ========== РЕКЛАМА: ЛОКАЛЬНЫЕ ФАЙЛЫ (ПАПКА images/) ==========
  // Три рекламных объявления: картинка из папки images + ссылка
  const adCampaigns = [
    { img: "images/casebattle.png",   link: "https://case-battle.red/",   alt: "Case Battle" },
    { img: "images/upgrader.png",     link: "https://upgrader.pro/ru",    alt: "Upgrader Pro" },
    { img: "images/gosuslugi.png",    link: "https://contract.gosuslugi.ru/", alt: "Госуслуги" }
  ];

  let currentAdIdx = 0;
  let adVisible = true;      // видна ли плашка рекламы
  let closeTimer = null;

  // DOM-элементы
  const pcBlock = document.getElementById("pcAdBlock");
  const mobileBlock = document.getElementById("mobileAdBlock");
  const pcImg = document.getElementById("pcAdImg");
  const mobileImg = document.getElementById("mobileAdImg");
  const pcClose = document.getElementById("pcCloseBtn");
  const mobileClose = document.getElementById("mobileCloseBtn");

  // функция обновления картинок и ссылок (индекс)
  function updateAdVisuals(index) {
    const ad = adCampaigns[index % adCampaigns.length];
    if (pcImg) {
      pcImg.src = ad.img;
      pcImg.alt = ad.alt;
      pcImg.onclick = (e) => { e.preventDefault(); window.open(ad.link, "_blank"); };
    }
    if (mobileImg) {
      mobileImg.src = ad.img;
      mobileImg.alt = ad.alt;
      mobileImg.onclick = (e) => { e.preventDefault(); window.open(ad.link, "_blank"); };
    }
  }

  // скрыть рекламу целиком (обе плашки по видимости)
  function hideAdBlocks() {
    if (pcBlock) pcBlock.style.display = "none";
    if (mobileBlock) mobileBlock.style.display = "none";
    adVisible = false;
  }

  function showAdBlocks() {
    // показываем соответсвующий блок в зависимости от ширины
    const isWide = window.innerWidth >= 1000;
    if (isWide) {
      if (pcBlock) pcBlock.style.display = "block";
      if (mobileBlock) mobileBlock.style.display = "none";
    } else {
      if (mobileBlock) mobileBlock.style.display = "block";
      if (pcBlock) pcBlock.style.display = "none";
    }
    adVisible = true;
  }

  // Главная механика: при нажатии на крестик
  // - плашка пропадает целиком
  // - через 1 секунду появляется НОВАЯ картинка (следующая по циклу)
  // - плашка показывается заново
  function onCloseAd() {
    if (closeTimer) clearTimeout(closeTimer);
    // прячем полностью
    hideAdBlocks();
    // через 1 секунду меняем картинку на следующую и показываем блок
    closeTimer = setTimeout(() => {
      currentAdIdx = (currentAdIdx + 1) % adCampaigns.length;
      updateAdVisuals(currentAdIdx);
      showAdBlocks();
      closeTimer = null;
    }, 1000);
  }

  // при загрузке страницы определяем видимость, показываем с первой картинкой
  function initAdByWidth() {
    const isWide = window.innerWidth >= 1000;
    if (isWide) {
      if (pcBlock) pcBlock.style.display = "block";
      if (mobileBlock) mobileBlock.style.display = "none";
    } else {
      if (mobileBlock) mobileBlock.style.display = "block";
      if (pcBlock) pcBlock.style.display = "none";
    }
    adVisible = true;
    updateAdVisuals(currentAdIdx);
  }

  // обработчики крестиков
  if (pcClose) pcClose.addEventListener("click", onCloseAd);
  if (mobileClose) mobileClose.addEventListener("click", onCloseAd);

  // следим за ресайзом, чтобы на пк показать сайдбар, на телефоне — нижнюю рекламу 
  window.addEventListener("resize", () => {
    if (!adVisible) return;   // если скрыта по таймеру, не трогаем
    const isWide = window.innerWidth >= 1000;
    if (isWide) {
      if (pcBlock) pcBlock.style.display = "block";
      if (mobileBlock) mobileBlock.style.display = "none";
    } else {
      if (mobileBlock) mobileBlock.style.display = "block";
      if (pcBlock) pcBlock.style.display = "none";
    }
  });

  // запуск
  render();
  initAdByWidth();
</script>

</body>
</html>
