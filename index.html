<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
<title>Расписание — Кейс Батл рулетка (чёрно-белая)</title>

<style>
  * {
    box-sizing: border-box;
    user-select: none;
  }
  body {
    margin: 0;
    padding: 0;
    font-family: system-ui, 'Segoe UI', monospace;
    background: #121212;
    color: #e5e5e5;
    min-height: 100vh;
  }
  header {
    text-align: center;
    padding: 18px;
    font-size: 22px;
    background: #1c1c1c;
    border-bottom: 1px solid #2a2a2a;
  }
  .container {
    max-width: 900px;
    margin: 0 auto;
    padding: 14px;
  }
  .card {
    background: #1c1c1c;
    border-radius: 10px;
    padding: 14px 16px;
    margin-bottom: 12px;
    border: 1px solid #2a2a2a;
  }
  .card .time { opacity: 0.7; font-size: 14px; margin-bottom: 4px; }
  .card .subject { font-size: 17px; font-weight: 500; }
  .day-title { font-size: 19px; margin: 20px 0 10px; opacity: 0.85; }
  .btns { display: flex; gap: 10px; margin: 20px 0; }
  button { flex: 1; padding: 14px 0; background: #2d2d2d; border: none; border-radius: 8px; color: #e5e5e5; font-size: 16px; cursor: pointer; }
  @media (min-width: 750px) { .card { display: none; } table { display: table; } }
  table { width: 100%; border-collapse: collapse; background: #1c1c1c; border-radius: 10px; overflow: hidden; }
  th, td { padding: 12px; border-bottom: 1px solid #2a2a2a; text-align: center; }
  th { background: #222; }

  /* рекламные плашки */
  .ad-float {
    position: fixed; background: #0a0a0a; border: 3px solid white; border-radius: 20px;
    box-shadow: 0 0 20px rgba(255,255,255,0.3); z-index: 1000; overflow: hidden;
    backdrop-filter: blur(4px); max-width: 260px; min-width: 140px;
  }
  .ad-inner { position: relative; }
  .ad-img { width: 100%; display: block; cursor: pointer; }
  .close-corner {
    position: absolute; top: 4px; right: 6px; background: #cc3333; border: none;
    color: white; font-size: 18px; width: 30px; height: 30px; border-radius: 30px;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
  }
  .pixel-dust { position: fixed; width: 100%; height: 100%; top: 0; left: 0; pointer-events: none; z-index: 10001; }
  .pixel { position: absolute; background-color: #000; border-radius: 2px; pointer-events: none; animation: fly 0.5s ease-out forwards; }
  @keyframes fly { 0% { transform: translate(0,0) rotate(0deg); opacity: 1; } 100% { transform: translate(var(--dx), var(--dy)) rotate(360deg); opacity: 0; } }

  /* кнопка отключения */
  .ad-killer {
    position: fixed; top: 20px; left: 20px; background: #111; border: 2px solid white;
    border-radius: 40px; padding: 8px 18px; z-index: 9999; display: flex; gap: 8px;
    cursor: pointer; backdrop-filter: blur(4px); font-weight: bold;
  }
  .ad-killer .strike { font-size: 22px; color: #ff4444; text-decoration: line-through; text-decoration-thickness: 3px; }
  
  /* рулетка (чёрно-белая) */
  .roulette-overlay {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #0a0a0a;
    z-index: 30000; display: flex; justify-content: center; align-items: center;
    font-family: monospace;
  }
  .roulette-card {
    background: #111; border: 2px solid white; border-radius: 48px; padding: 24px;
    width: 520px; max-width: 92vw; text-align: center;
    box-shadow: 0 0 40px rgba(255,255,255,0.2);
  }
  .wheel-area {
    position: relative; width: 260px; height: 260px; margin: 0 auto 20px;
  }
  canvas {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    border-radius: 50%; box-shadow: 0 0 0 3px white;
  }
  #arrowCanvas {
    z-index: 10;
  }
  .multipliers { display: flex; gap: 16px; justify-content: center; margin: 15px 0; }
  .mult-btn {
    background: #1a1a1a; border: 1px solid white; padding: 8px 24px; border-radius: 40px;
    cursor: pointer; font-weight: bold; font-size: 18px; color: white;
  }
  .mult-btn.active { background: white; color: black; }
  .spin-btn {
    background: white; color: black; font-weight: bold; font-size: 22px;
    padding: 12px 24px; border: none; border-radius: 60px; cursor: pointer; width: 80%; margin: 10px 0;
  }
  .inventory-panel {
    background: #1a1a1a; border-radius: 32px; padding: 16px; margin: 20px 0 10px;
    border: 1px solid #333;
  }
  .inventory-title { font-size: 14px; color: #aaa; margin-bottom: 12px; }
  .inventory-items { display: flex; gap: 12px; justify-content: space-between; }
  .item-card {
    background: #0a0a0a; border: 1px solid #444; border-radius: 20px; padding: 12px;
    flex: 1; cursor: pointer; transition: 0.1s;
  }
  .item-card.selected { background: #2a2a2a; border: 2px solid white; }
  .item-name { font-weight: bold; font-size: 16px; }
  .item-price { font-size: 13px; color: #ffaa66; margin-top: 6px; }
  .result-area {
    background: #0a0a0a; border-radius: 30px; padding: 12px; margin-top: 16px;
    font-size: 15px; min-height: 70px;
  }
  button:active { transform: scale(0.97); }
</style>
</head>
<body>

<div id="adKillerBtn" class="ad-killer"><span class="strike">AD</span><span>откл рекламу</span></div>
<header>Дима пьяный украинец</header>
<div class="container"><div id="content"></div><div class="btns"><button onclick="prevDay()">← Пред.</button><button onclick="toggleAll()">Все дни</button><button onclick="nextDay()">След. →</button></div></div>

<script>
  // ========== РАСПИСАНИЕ ==========
  const schedules = {
    "понедельник": ["Разговоры о лудомании", "История", "Физкультура", "Алгебра", "География", "Обществознание", "Иностранный язык"],
    "вторник": ["Литература", "Русский язык", "ОБЖ", "Алгебра", "Физика", "Иностранный язык", "История"],
    "среда": ["Русский язык", "Литература", "География", "Химия", "Информатика", "Физкультура", "Труд"],
    "четверг": ["кейс батл", "Алгебра", "Геометрия", "Физика", "Биология", "Русский язык", "Литература"],
    "пятница": ["Вероятность и статистика", "Геометрия", "История", "Химия", "Биология", "Физика", "Иностранный язык"]
  };
  const times = ["8:30–9:15","9:35–10:20","10:40–11:25","11:50–12:35","12:55–13:40","13:50–14:35","14:40–15:25"];
  const days = ["понедельник","вторник","среда","четверг","пятница"];
  let dayIndex = (() => { let idx = new Date().getDay() - 1; return (idx >= 0 && idx <= 4) ? idx : 0; })();
  let showAll = false;
  function addCell(r,t,h){let c=document.createElement(h?"th":"td");c.textContent=t;r.appendChild(c);}
  function renderDayBlock(cont,day){
    let title=document.createElement("div");title.className="day-title";title.textContent=day[0].toUpperCase()+day.slice(1);cont.appendChild(title);
    for(let i=0;i<schedules[day].length;i++){
      let card=document.createElement("div");card.className="card";
      let tSpan=document.createElement("div");tSpan.className="time";tSpan.textContent=times[i];
      let sSpan=document.createElement("div");sSpan.className="subject";sSpan.textContent=schedules[day][i];
      card.appendChild(tSpan);card.appendChild(sSpan);cont.appendChild(card);
    }
    if(window.innerWidth>=750){
      let table=document.createElement("table");let tr=document.createElement("tr");
      addCell(tr,"#",1);addCell(tr,"Время",1);addCell(tr,"Предмет",1);table.appendChild(tr);
      for(let i=0;i<schedules[day].length;i++){let row=document.createElement("tr");addCell(row,i+1,0);addCell(row,times[i],0);addCell(row,schedules[day][i],0);table.appendChild(row);}
      cont.appendChild(table);
    }
  }
  function renderSchedule(){let root=document.getElementById("content");root.innerHTML="";document.getElementById("toggleBtn").textContent=showAll?"Один день":"Все дни";if(showAll){for(let d of days)renderDayBlock(root,d);}else{renderDayBlock(root,days[dayIndex]);}}
  window.prevDay=()=>{dayIndex=(dayIndex-1+days.length)%days.length;showAll=0;renderSchedule();};
  window.nextDay=()=>{dayIndex=(dayIndex+1)%days.length;showAll=0;renderSchedule();};
  window.toggleAll=()=>{showAll=!showAll;renderSchedule();};

  // ========== РЕКЛАМА (летающие плашки, упрощённо) ==========
  let adPanels=[], tariffOverlayActive=false, animFrame=null;
  function getRandPos(el){
    let w=el.offsetWidth||160,h=el.offsetHeight||120;
    let x=Math.random()*(window.innerWidth-w-20)+10, y=Math.random()*(window.innerHeight-h-20)+10;
    let vx=(Math.random()*1.2+0.4)*(Math.random()>0.5?1:-1);
    let vy=(Math.random()*1.2+0.4)*(Math.random()>0.5?1:-1);
    return {x,y,vx,vy};
  }
  function updateAdPos(ad){
    if(!ad.el||ad.closing)return;
    let w=ad.el.offsetWidth,h=ad.el.offsetHeight;
    let nx=ad.x+ad.vx, ny=ad.y+ad.vy;
    if(nx<=0){nx=0;ad.vx=Math.abs(ad.vx);}
    if(nx+w>=window.innerWidth){nx=window.innerWidth-w;ad.vx=-Math.abs(ad.vx);}
    if(ny<=0){ny=0;ad.vy=Math.abs(ad.vy);}
    if(ny+h>=window.innerHeight){ny=window.innerHeight-h;ad.vy=-Math.abs(ad.vy);}
    ad.x=nx;ad.y=ny;
    ad.el.style.left=ad.x+"px";ad.el.style.top=ad.y+"px";
  }
  function startAnim(){if(animFrame)cancelAnimationFrame(animFrame);function anim(){for(let a of adPanels)if(a&&!tariffOverlayActive&&!a.closing)updateAdPos(a);animFrame=requestAnimationFrame(anim);}anim();}
  function createAd(){
    let div=document.createElement("div");div.className="ad-float";
    let inner=document.createElement("div");inner.className="ad-inner";
    let img=document.createElement("img");img.className="ad-img";img.src="images/casebattle.png";
    let btn=document.createElement("button");btn.className="close-corner";btn.textContent="✖";
    inner.appendChild(img);inner.appendChild(btn);div.appendChild(inner);document.body.appendChild(div);
    let pos=getRandPos(div);div.style.left=pos.x+"px";div.style.top=pos.y+"px";
    let obj={el:div,img,btn,x:pos.x,y:pos.y,vx:pos.vx,vy:pos.vy,closing:false};
    btn.onclick=()=>{if(obj.closing||tariffOverlayActive)return;obj.closing=true;if(obj.el)obj.el.remove();};
    return obj;
  }
  function killAllAds(){for(let a of adPanels)if(a.el)a.el.remove();adPanels=[];if(animFrame)cancelAnimationFrame(animFrame);}
  for(let i=0;i<4;i++)adPanels.push(createAd());
  startAnim();
  renderSchedule();

  // ========== ВЗРЫВ ЧЁРНЫМИ ПИКСЕЛЯМИ И РУЛЕТКА ==========
  function explodeToRoulette(){
    let dust=document.createElement("div");dust.className="pixel-dust";document.body.appendChild(dust);
    let w=window.innerWidth,h=window.innerHeight,size=12;
    let cols=Math.ceil(w/size),rows=Math.ceil(h/size);
    for(let i=0;i<cols;i++)for(let j=0;j<rows;j++){
      let p=document.createElement("div");p.className="pixel";
      p.style.left=(i*size)+"px";p.style.top=(j*size)+"px";
      p.style.width=size+"px";p.style.height=size+"px";
      p.style.backgroundColor="#000000";
      let ang=Math.random()*Math.PI*2,dist=100+Math.random()*200;
      p.style.setProperty("--dx",Math.cos(ang)*dist+"px");
      p.style.setProperty("--dy",Math.sin(ang)*dist+"px");
      dust.appendChild(p);
      setTimeout(()=>p.remove(),500);
    }
    setTimeout(()=>{
      document.body.innerHTML="";
      document.body.style.background="#000";
      showRoulette();
    },300);
  }

  // ========== РУЛЕТКА (НАЛИВНАЯ, ЧЁРНО-БЕЛАЯ, СТРЕЛКА МЕДЛЕННО ОСТАНАВЛИВАЕТСЯ) ==========
  let inventory = [
    { name:"Твои яйки", price:50 },
    { name:"Мама", price:10 },
    { name:"Сифилис", price:100 }
  ];
  let selectedItemIdx = 0;
  let currentMultiplier = 2; // 2,5,10
  let spinning = false;
  let arrowAngle = 0;
  let animFrameArrow = null;

  function getChancePercent(mult){
    if(mult===2) return 50;
    if(mult===5) return 20;
    if(mult===10) return 10;
    return 50;
  }

  function drawFillCanvas(percent){
    let canvas = document.getElementById("fillCanvas");
    if(!canvas) return;
    let ctx = canvas.getContext("2d");
    let w=canvas.width=260, h=canvas.height=260;
    ctx.clearRect(0,0,w,h);
    let angle = (percent/100) * 360;
    let startAngle = -90;
    let endAngle = startAngle + angle;
    ctx.beginPath();
    ctx.moveTo(130,130);
    ctx.arc(130,130,120, startAngle*Math.PI/180, endAngle*Math.PI/180);
    ctx.fillStyle = "#ffffff";
    ctx.fill();
    ctx.beginPath();
    ctx.arc(130,130,120, endAngle*Math.PI/180, (startAngle+360)*Math.PI/180);
    ctx.fillStyle = "#1a1a1a";
    ctx.fill();
    ctx.strokeStyle = "#000";
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(130,130,120,0,2*Math.PI); ctx.stroke();
    ctx.fillStyle = "#000";
    ctx.font = "bold 28px monospace";
    ctx.fillText(percent+"%", 105, 150);
  }

  function updateFill(){
    let chance = getChancePercent(currentMultiplier);
    drawFillCanvas(chance);
  }

  function drawArrow(angleDeg){
    let canvas = document.getElementById("arrowCanvas");
    if(!canvas) return;
    let ctx = canvas.getContext("2d");
    let w=canvas.width=260, h=canvas.height=260;
    ctx.clearRect(0,0,w,h);
    ctx.save();
    ctx.translate(130,130);
    ctx.rotate(angleDeg * Math.PI/180);
    ctx.beginPath();
    ctx.moveTo(0, -110);
    ctx.lineTo(-12, -30);
    ctx.lineTo(0, -40);
    ctx.lineTo(12, -30);
    ctx.fillStyle = "#ffffff";
    ctx.fill();
    ctx.beginPath();
    ctx.arc(0,0,20,0,2*Math.PI);
    ctx.fillStyle = "#222";
    ctx.fill();
    ctx.strokeStyle = "white";
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(0,0,20,0,2*Math.PI); ctx.stroke();
    ctx.restore();
  }

  function spinArrow(targetAngle, duration){
    return new Promise((resolve)=>{
      let startAngle = arrowAngle;
      let diff = targetAngle - startAngle;
      let startTime = performance.now();
      function step(now){
        let t = Math.min(1, (now-startTime)/duration);
        let ease = 1 - Math.pow(1-t, 3);
        arrowAngle = startAngle + diff * ease;
        drawArrow(arrowAngle);
        if(t<1) requestAnimationFrame(step);
        else resolve();
      }
      requestAnimationFrame(step);
    });
  }

  async function doSpin(){
    if(spinning) return;
    spinning = true;
    let resultMsg = document.getElementById("resultMsg");
    resultMsg.innerHTML = "🎲 Крутим... 🎲";
    // пауза 0.3 сек
    await new Promise(r=>setTimeout(r,300));
    let chance = getChancePercent(currentMultiplier);
    let win = Math.random()*100 <= chance;
    let betItem = inventory[selectedItemIdx];
    let winAmount = betItem.price * currentMultiplier;
    // вращение стрелки: много оборотов + плавная остановка на случайном угле
    let spins = 8 + Math.random() * 6;
    let finalAngle = (Math.random() * 360);
    let totalAngle = spins * 360 + finalAngle;
    let startA = arrowAngle;
    let duration = 1800;
    let startTime = performance.now();
    await new Promise((resolve)=>{
      function stepAnim(now){
        let t = Math.min(1, (now-startTime)/duration);
        let easeOut = 1 - Math.pow(1-t, 2.5);
        let ang = startA + totalAngle * easeOut;
        arrowAngle = ang % 360;
        drawArrow(arrowAngle);
        if(t<1) requestAnimationFrame(stepAnim);
        else resolve();
      }
      requestAnimationFrame(stepAnim);
    });
    // результат
    if(win){
      let newItem = { name: betItem.name, price: winAmount };
      inventory.push(newItem);
      resultMsg.innerHTML = `🎉 МАЛАДЕЦ! ВЫ ВЫИГРАЛИ ${winAmount}₴ (${betItem.name} x${currentMultiplier}) 🎉\n➕ Предмет добавлен в инвентарь`;
      renderInventory();
    } else {
      if(inventory.length > 1){
        inventory.splice(selectedItemIdx,1);
        if(selectedItemIdx >= inventory.length) selectedItemIdx = 0;
      } else {
        inventory[0].price = Math.max(1, Math.floor(inventory[0].price / 2));
      }
      resultMsg.innerHTML = `😭 НЕ БЕДА! ВЫ ПРОИГРАЛИ ${betItem.price}₴ (${betItem.name}) 😭`;
      renderInventory();
    }
    spinning = false;
  }

  function renderInventory(){
    let container = document.getElementById("inventoryItems");
    if(!container) return;
    container.innerHTML = inventory.map((item,idx)=>`
      <div class="item-card ${selectedItemIdx===idx ? 'selected':''}" data-idx="${idx}">
        <div class="item-name">${item.name}</div>
        <div class="item-price">${item.price} ₴</div>
      </div>
    `).join('');
    document.querySelectorAll('.item-card').forEach(card=>{
      card.addEventListener('click',()=>{
        selectedItemIdx = parseInt(card.dataset.idx);
        renderInventory();
        let chance = getChancePercent(currentMultiplier);
        document.getElementById("resultMsg").innerHTML = `Выбрано: ${inventory[selectedItemIdx].name} (${inventory[selectedItemIdx].price}₴) | Множитель x${currentMultiplier} | Шанс ${chance}%`;
      });
    });
  }

  function showRoulette(){
    let container = document.createElement("div"); container.className = "roulette-overlay";
    container.innerHTML = `
      <div class="roulette-card">
        <div class="wheel-area">
          <canvas id="fillCanvas" width="260" height="260"></canvas>
          <canvas id="arrowCanvas" width="260" height="260"></canvas>
        </div>
        <div class="multipliers">
          <button class="mult-btn" data-mult="2">x2 (50%)</button>
          <button class="mult-btn" data-mult="5">x5 (20%)</button>
          <button class="mult-btn" data-mult="10">x10 (10%)</button>
        </div>
        <button id="spinBtn" class="spin-btn">🎡 КРУТИТЬ СТРЕЛКУ 🎡</button>
        <div class="inventory-panel">
          <div class="inventory-title">🎒 ИНВЕНТАРЬ (выбери предмет)</div>
          <div class="inventory-items" id="inventoryItems"></div>
        </div>
        <div class="result-area" id="resultMsg">Выберите предмет и множитель</div>
      </div>
    `;
    document.body.appendChild(container);
    
    // инициализация
    drawFillCanvas(50);
    arrowAngle = 0;
    drawArrow(0);
    selectedItemIdx = 0;
    renderInventory();
    
    // множители
    document.querySelectorAll('.mult-btn').forEach(btn=>{
      btn.addEventListener('click',()=>{
        currentMultiplier = parseInt(btn.dataset.mult);
        document.querySelectorAll('.mult-btn').forEach(b=>b.classList.remove('active'));
        btn.classList.add('active');
        updateFill();
        let chance = getChancePercent(currentMultiplier);
        document.getElementById("resultMsg").innerHTML = `Выбрано: ${inventory[selectedItemIdx].name} (${inventory[selectedItemIdx].price}₴) | Множитель x${currentMultiplier} | Шанс ${chance}%`;
      });
    });
    document.querySelector('.mult-btn[data-mult="2"]').classList.add('active');
    updateFill();
    
    document.getElementById("spinBtn").addEventListener("click", ()=>{
      if(spinning) return;
      if(inventory.length===0){
        document.getElementById("resultMsg").innerHTML = "❌ Инвентарь пуст! Начните заново (обновите страницу)";
        return;
      }
      doSpin();
    });
    document.getElementById("resultMsg").innerHTML = `Выбрано: ${inventory[0].name} (${inventory[0].price}₴) | Множитель x2 | Шанс 50%`;
  }

  // ========== КНОПКА ОТКЛЮЧЕНИЯ РЕКЛАМЫ ==========
  const killBtn = document.getElementById("adKillerBtn");
  killBtn.addEventListener("click", ()=>{
    killAllAds();
    killBtn.remove();
    explodeToRoulette();
  });
</script>
</body>
</html>
