<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
<title>Расписание — отключи рекламу и получи ЛСД</title>

<style>
  /* ===== ОРИГИНАЛЬНЫЙ СТИЛЬ РАСПИСАНИЯ ===== */
  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    padding: 0;
    font-family: system-ui, Arial, sans-serif;
    background: #121212;
    color: #e5e5e5;
    min-height: 100vh;
    position: relative;
  }

  /* ЛСД-эффекты (включаются только после кнопки) */
  body.lsd-active {
    animation: globalShake 0.06s infinite alternate;
  }

  @keyframes globalShake {
    0% { transform: translate(1px, -1px); }
    100% { transform: translate(-1px, 1px); }
  }

  body.lsd-active .container {
    animation: danceContainer 0.1s infinite alternate;
  }

  @keyframes danceContainer {
    0% { transform: translate(0px, 0px) rotate(0deg); }
    25% { transform: translate(5px, -3px) rotate(0.8deg); }
    50% { transform: translate(-4px, 4px) rotate(-0.5deg); }
    75% { transform: translate(3px, 5px) rotate(0.3deg); }
    100% { transform: translate(-3px, -2px) rotate(-0.7deg); }
  }

  body.lsd-active .card,
  body.lsd-active table,
  body.lsd-active .day-title {
    animation: colorCycle 0.15s infinite alternate;
  }

  @keyframes colorCycle {
    0% { background: #1c1c1c; color: #e5e5e5; border-color: #2a2a2a; }
    25% { background: #2a1a2a; color: #ff99cc; border-color: #ff66aa; }
    50% { background: #1a2a2a; color: #99ffcc; border-color: #66ffaa; }
    75% { background: #2a2a1a; color: #ffff99; border-color: #ffff66; }
    100% { background: #1c1c2a; color: #cc99ff; border-color: #aa66ff; }
  }

  body.lsd-active .btns button {
    animation: btnShake 0.1s infinite alternate;
  }

  @keyframes btnShake {
    0% { transform: scale(1); background: #2d2d2d; }
    100% { transform: scale(0.96); background: #6a1a6a; color: #ffccff; }
  }

  header {
    text-align: center;
    padding: 18px;
    font-size: 22px;
    background: #1c1c1c;
    border-bottom: 1px solid #2a2a2a;
  }

  .container {
    max-width: 900px;
    margin: 0 auto;
    padding: 14px;
    position: relative;
    z-index: 1;
  }

  .card {
    background: #1c1c1c;
    border-radius: 10px;
    padding: 14px 16px;
    margin-bottom: 12px;
    border: 1px solid #2a2a2a;
  }

  .card .time {
    opacity: 0.7;
    font-size: 14px;
    margin-bottom: 4px;
  }

  .card .subject {
    font-size: 17px;
    font-weight: 500;
  }

  .day-title {
    font-size: 19px;
    margin: 20px 0 10px;
    opacity: 0.85;
  }

  .btns {
    display: flex;
    gap: 10px;
    margin-top: 20px;
    margin-bottom: 20px;
  }

  button {
    flex: 1;
    padding: 14px 0;
    background: #2d2d2d;
    border: none;
    border-radius: 8px;
    color: #e5e5e5;
    font-size: 16px;
    cursor: pointer;
  }

  @media (min-width: 750px) {
    .card { display: none; }
    table { display: table; }
  }

  table {
    width: 100%;
    border-collapse: collapse;
    background: #1c1c1c;
    margin-bottom: 20px;
    border-radius: 10px;
    overflow: hidden;
  }

  th, td {
    padding: 12px;
    border-bottom: 1px solid #2a2a2a;
    text-align: center;
  }

  th {
    background: #222;
    font-weight: 600;
  }

  /* ===== РЕКЛАМНЫЕ ПЛАШКИ ===== */
  .ad-float {
    position: fixed;
    background: #0a0a0a;
    border: 3px solid white;
    border-radius: 20px;
    box-shadow: 0 0 20px rgba(255,255,255,0.3);
    z-index: 1000;
    overflow: hidden;
    backdrop-filter: blur(4px);
    max-width: 260px;
    width: auto;
    min-width: 140px;
    will-change: left, top;
  }

  @media (max-width: 700px) {
    .ad-float { max-width: 180px; border-width: 2px; }
    .close-corner { width: 26px; height: 26px; font-size: 16px; }
  }

  .ad-inner { position: relative; display: block; width: 100%; }
  .ad-img { width: 100%; height: auto; display: block; cursor: pointer; object-fit: cover; }
  .close-corner {
    position: absolute; top: 4px; right: 6px; background: #cc3333; border: none;
    color: white; font-size: 18px; width: 30px; height: 30px; border-radius: 30px;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    z-index: 20; font-family: monospace;
  }

  /* Пиксельный распад */
  .pixel-dust { position: fixed; width: 100%; height: 100%; top: 0; left: 0; pointer-events: none; z-index: 10001; }
  .pixel { position: absolute; background-color: #ffffff; border-radius: 2px; pointer-events: none; animation: flyAway 0.4s ease-out forwards; box-shadow: 0 0 4px rgba(255,255,255,0.8); }
  @keyframes flyAway {
    0% { transform: translate(0, 0) rotate(0deg); opacity: 1; }
    100% { transform: translate(var(--dx), var(--dy)) rotate(360deg); opacity: 0; }
  }

  /* КНОПКА ОТКЛЮЧЕНИЯ РЕКЛАМЫ */
  .ad-killer {
    position: fixed;
    top: 20px;
    left: 20px;
    background: #111;
    border: 2px solid white;
    border-radius: 40px;
    padding: 8px 18px 8px 14px;
    z-index: 9999;
    display: flex;
    align-items: center;
    gap: 8px;
    cursor: pointer;
    backdrop-filter: blur(4px);
    font-weight: bold;
    transition: 0.1s;
    box-shadow: 0 0 8px rgba(255,255,255,0.3);
  }

  .ad-killer .strike {
    font-size: 22px;
    font-weight: 800;
    color: #ff4444;
    text-decoration: line-through;
    text-decoration-thickness: 3px;
  }

  .ad-killer .label {
    font-size: 13px;
    color: white;
    font-family: monospace;
  }

  .ad-killer:active {
    transform: scale(0.95);
    background: #2a1a1a;
  }

  /* тарифы (сокращённо) */
  .tariff-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: #0a0c12;
    z-index: 20000;
    overflow-y: auto;
    padding: 20px;
    backdrop-filter: blur(10px);
  }
  .tariff-container { max-width: 600px; margin: 0 auto; }
  .tariff-title { font-size: 28px; text-align: center; margin: 20px 0; color: #ffffff; }
  .tariff-card { background: #1a1e2a; border-radius: 24px; padding: 20px; margin-bottom: 20px; border: 2px solid #ffffff; }
  .tariff-name { font-size: 26px; font-weight: bold; color: #ffffff; }
  .tariff-price { font-size: 32px; margin: 10px 0; color: #ffffff; }
  .tariff-features { list-style: none; padding: 0; margin: 15px 0; }
  .tariff-features li { padding: 6px 0; border-bottom: 1px solid #2a2e3a; color: #dddddd; }
  .buy-btn { background: #1a1e2a; border: 2px solid white; color: white; padding: 12px 20px; border-radius: 40px; width: 100%; margin-top: 10px; cursor: pointer; }
  .close-tariff { text-align: center; margin-top: 40px; color: #888; cursor: pointer; }
  .order-form { background: #0f111a; border-radius: 24px; padding: 20px; margin-top: 10px; }
  .order-form input, .order-form select { width: 100%; padding: 12px; margin: 8px 0; background: #1e2230; border: 1px solid #3a3e50; color: white; border-radius: 12px; }
  .invoice { background: #0a0c16; padding: 16px; border-radius: 16px; margin: 15px 0; }
  .invoice-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #2a2e3e; }
  .total-row { font-weight: bold; font-size: 20px; color: #ffffff; border-top: 2px solid #ffffff; margin-top: 8px; padding-top: 12px; }
</style>
</head>
<body>

<!-- КНОПКА ОТКЛЮЧЕНИЯ РЕКЛАМЫ -->
<div id="adKillerBtn" class="ad-killer">
  <span class="strike">AD</span>
  <span class="label">откл рекламу</span>
</div>

<header>Дима пьяный украинец</header>

<div class="container">
  <div id="content"></div>
  <div class="btns">
    <button onclick="prevDay()">← Пред.</button>
    <button onclick="toggleAll()" id="toggleBtn">Все дни</button>
    <button onclick="nextDay()">След. →</button>
  </div>
</div>

<script>
  // ========== РАСПИСАНИЕ ==========
  const schedules = {
    "понедельник": ["Разговоры о лудомании", "История", "Физкультура", "Алгебра", "География", "Обществознание", "Иностранный язык"],
    "вторник": ["Литература", "Русский язык", "ОБЖ", "Алгебра", "Физика", "Иностранный язык", "История"],
    "среда": ["Русский язык", "Литература", "География", "Химия", "Информатика", "Физкультура", "Труд"],
    "четверг": ["кейс батл", "Алгебра", "Геометрия", "Физика", "Биология", "Русский язык", "Литература"],
    "пятница": ["Вероятность и статистика", "Геометрия", "История", "Химия", "Биология", "Физика", "Иностранный язык"]
  };
  const times = ["8:30–9:15","9:35–10:20","10:40–11:25","11:50–12:35","12:55–13:40","13:50–14:35","14:40–15:25"];
  const days = ["понедельник","вторник","среда","четверг","пятница"];
  let dayIndex = (() => { let idx = new Date().getDay() - 1; return (idx >= 0 && idx <= 4) ? idx : 0; })();
  let showAll = false;

  function addCell(row, text, isHead) { let cell = document.createElement(isHead ? "th" : "td"); cell.textContent = text; row.appendChild(cell); }
  function renderDayBlock(container, day) {
    let title = document.createElement("div"); title.className = "day-title"; title.textContent = day.charAt(0).toUpperCase() + day.slice(1); container.appendChild(title);
    for (let i = 0; i < schedules[day].length; i++) {
      let card = document.createElement("div"); card.className = "card";
      let tSpan = document.createElement("div"); tSpan.className = "time"; tSpan.textContent = times[i];
      let sSpan = document.createElement("div"); sSpan.className = "subject"; sSpan.textContent = schedules[day][i];
      card.appendChild(tSpan); card.appendChild(sSpan); container.appendChild(card);
    }
    if (window.innerWidth >= 750) {
      let table = document.createElement("table"); let thead = document.createElement("tr");
      addCell(thead, "#", true); addCell(thead, "Время", true); addCell(thead, "Предмет", true); table.appendChild(thead);
      for (let i = 0; i < schedules[day].length; i++) {
        let row = document.createElement("tr"); addCell(row, i + 1, false); addCell(row, times[i], false); addCell(row, schedules[day][i], false); table.appendChild(row);
      }
      container.appendChild(table);
    }
  }
  function renderSchedule() { let root = document.getElementById("content"); root.innerHTML = ""; document.getElementById("toggleBtn").textContent = showAll ? "Один день" : "Все дни"; if (showAll) { for (let d of days) renderDayBlock(root, d); } else { renderDayBlock(root, days[dayIndex]); } }
  window.prevDay = () => { dayIndex = (dayIndex - 1 + days.length) % days.length; showAll = false; renderSchedule(); };
  window.nextDay = () => { dayIndex = (dayIndex + 1) % days.length; showAll = false; renderSchedule(); };
  window.toggleAll = () => { showAll = !showAll; renderSchedule(); };

  // ========== РЕКЛАМА (ЛЕТАЮЩИЕ ПЛАШКИ) ==========
  const adCampaigns = [
    { img: "images/casebattle.png", link: "https://case-battle.red/", alt: "Case Battle" },
    { img: "images/upgrader.png", link: "https://upgrader.pro/ru", alt: "Upgrader Pro" },
    { img: "images/gosuslugi.png", link: "https://contract.gosuslugi.ru/", alt: "Госуслуги" }
  ];
  
  let adPanels = [];
  let closedAdsCount = 0;
  let tariffOverlayActive = false;
  let animationFrameId = null;
  let adsActive = true;  // реклама активна изначально

  function getRandomPositionAndDirection(adElement) {
    if (!adElement) return { x: 20, y: 20, vx: 0.8, vy: 0.8 };
    const adWidth = adElement.offsetWidth || 180;
    const adHeight = adElement.offsetHeight || 140;
    const maxX = Math.max(10, window.innerWidth - adWidth - 10);
    const maxY = Math.max(10, window.innerHeight - adHeight - 10);
    let x = Math.random() * maxX, y = Math.random() * maxY;
    let vx = (Math.random() * 0.9 + 0.4) * (Math.random() > 0.5 ? 1 : -1);
    let vy = (Math.random() * 0.9 + 0.4) * (Math.random() > 0.5 ? 1 : -1);
    if (Math.abs(vx) < 0.4) vx = vx > 0 ? 0.5 : -0.5;
    if (Math.abs(vy) < 0.4) vy = vy > 0 ? 0.5 : -0.5;
    return { x, y, vx, vy };
  }

  function updateAdPosition(ad) {
    if (!ad.element || ad.isClosing) return;
    let rect = ad.element.getBoundingClientRect();
    let adWidth = rect.width, adHeight = rect.height;
    let newX = ad.x + ad.vx;
    let newY = ad.y + ad.vy;
    if (newX <= 0) { newX = 0; ad.vx = Math.abs(ad.vx); }
    if (newX + adWidth >= window.innerWidth) { newX = window.innerWidth - adWidth; ad.vx = -Math.abs(ad.vx); }
    if (newY <= 0) { newY = 0; ad.vy = Math.abs(ad.vy); }
    if (newY + adHeight >= window.innerHeight) { newY = window.innerHeight - adHeight; ad.vy = -Math.abs(ad.vy); }
    ad.x = newX; ad.y = newY;
    ad.element.style.left = ad.x + 'px';
    ad.element.style.top = ad.y + 'px';
  }

  function startFlying() {
    if (animationFrameId) cancelAnimationFrame(animationFrameId);
    function animate() {
      for (let ad of adPanels) {
        if (ad && ad.element && !tariffOverlayActive && !ad.isClosing && adsActive) {
          updateAdPosition(ad);
        }
      }
      animationFrameId = requestAnimationFrame(animate);
    }
    animate();
  }

  function updateAdImage(ad) {
    const campaign = adCampaigns[ad.imageIndex % adCampaigns.length];
    if (ad.imgElement) {
      ad.imgElement.src = campaign.img;
      ad.imgElement.alt = campaign.alt;
      ad.imgElement.onclick = (e) => { e.preventDefault(); window.open(campaign.link, "_blank"); };
    }
  }

  function pixelExplode(element, callback) {
    if (!element) { if(callback) callback(); return; }
    const rect = element.getBoundingClientRect();
    const width = rect.width, height = rect.height, left = rect.left, top = rect.top;
    const dustContainer = document.createElement('div'); dustContainer.className = 'pixel-dust'; document.body.appendChild(dustContainer);
    const pixelSize = 8, cols = Math.ceil(width / pixelSize), rows = Math.ceil(height / pixelSize);
    for (let i = 0; i < cols; i++) {
      for (let j = 0; j < rows; j++) {
        const pixel = document.createElement('div'); pixel.className = 'pixel';
        pixel.style.left = (left + i * pixelSize) + 'px'; pixel.style.top = (top + j * pixelSize) + 'px';
        pixel.style.width = pixelSize + 'px'; pixel.style.height = pixelSize + 'px';
        pixel.style.backgroundColor = '#ffffff';
        pixel.style.boxShadow = '0 0 4px rgba(255,255,255,0.8)';
        const angle = Math.random() * Math.PI * 2; const distance = 80 + Math.random() * 150;
        pixel.style.setProperty('--dx', Math.cos(angle) * distance + 'px'); pixel.style.setProperty('--dy', Math.sin(angle) * distance + 'px');
        dustContainer.appendChild(pixel);
        setTimeout(() => { if(pixel && pixel.remove) pixel.remove(); }, 450);
      }
    }
    element.style.visibility = 'hidden'; element.style.opacity = '0';
    setTimeout(() => { if(dustContainer && dustContainer.remove) dustContainer.remove(); if(callback) callback(); }, 200);
  }

  function closeAdWithAnimation(ad, onComplete) {
    if (!ad || !ad.element || ad.isClosing) { if(onComplete) onComplete(); return; }
    ad.isClosing = true;
    const element = ad.element;
    element.style.pointerEvents = 'none';
    pixelExplode(element, () => {
      element.classList.add('hidden-temp');
      element.style.visibility = 'hidden';
      ad.imageIndex = (ad.imageIndex + 1) % adCampaigns.length;
      updateAdImage(ad);
      const newPos = getRandomPositionAndDirection(ad.element);
      ad.x = newPos.x; ad.y = newPos.y; ad.vx = newPos.vx; ad.vy = newPos.vy;
      ad.element.style.left = ad.x + 'px'; ad.element.style.top = ad.y + 'px';
      element.classList.remove('hidden-temp');
      ad.isClosing = false;
      element.style.visibility = 'visible'; element.style.opacity = '1';
      element.style.animation = 'none'; element.offsetHeight;
      element.style.animation = 'popIn 0.2s cubic-bezier(0.34, 1.2, 0.64, 1)';
      element.style.pointerEvents = '';
      if (onComplete) onComplete();
    });
  }

  function createAdPanel() {
    const div = document.createElement("div"); div.className = "ad-float";
    const inner = document.createElement("div"); inner.className = "ad-inner";
    const img = document.createElement("img"); img.className = "ad-img";
    const closeBtn = document.createElement("button"); closeBtn.className = "close-corner"; closeBtn.textContent = "✖";
    inner.appendChild(img); inner.appendChild(closeBtn); div.appendChild(inner); document.body.appendChild(div);
    const initPos = getRandomPositionAndDirection(div);
    div.style.left = initPos.x + 'px'; div.style.top = initPos.y + 'px';
    const adObj = {
      element: div, imgElement: img, closeBtn,
      imageIndex: Math.floor(Math.random() * adCampaigns.length),
      isClosing: false, x: initPos.x, y: initPos.y, vx: initPos.vx, vy: initPos.vy
    };
    updateAdImage(adObj);
    closeBtn.addEventListener("click", (e) => {
      e.stopPropagation();
      if (adObj.isClosing || tariffOverlayActive || !adsActive) return;
      closedAdsCount++;
      closeAdWithAnimation(adObj, () => {
        if (closedAdsCount >= 3 && !tariffOverlayActive) showTariffMenu();
      });
    });
    return adObj;
  }

  function killAllAds() {
    adsActive = false;
    for (let ad of adPanels) {
      if (ad && ad.element) ad.element.remove();
    }
    adPanels = [];
    if (animationFrameId) cancelAnimationFrame(animationFrameId);
  }

  // ========== ТАРИФЫ ==========
  function showTariffMenu() {
    if (tariffOverlayActive) return;
    tariffOverlayActive = true;
    const overlay = document.createElement('div'); overlay.className = 'tariff-overlay';
    overlay.innerHTML = `<div class="tariff-container"><div class="tariff-title">💸 ТАРИФЫ ДЛЯ ПИЗДАТЫХ 💸</div>
      <div class="tariff-card"><div class="tariff-name">🚀 ZA SVO</div><div class="tariff-price">₴ 99 999</div><ul class="tariff-features"><li>✅ Доступ к расписанию</li><li>✅ Личный "Дима"</li><li>✅ Клеймо еблана</li></ul><button class="buy-btn" data-price="99999" data-name="ZA SVO">КУПИТЬ</button></div>
      <div class="tariff-card"><div class="tariff-name">👑 КОРОЛЬ ВОЗДУХА</div><div class="tariff-price">₴ 499 999</div><ul class="tariff-features"><li>✅ Все фишки</li><li>✅ Огромные ЯЙЦА</li></ul><button class="buy-btn" data-price="499999" data-name="КОРОЛЬ ВОЗДУХА">КУПИТЬ</button></div>
      <div class="tariff-card"><div class="tariff-name">⚡ ЧЕРВИ В ГЛАЗАХ</div><div class="tariff-price">₴ 1 337 000</div><ul class="tariff-features"><li>✅ Тимошина пожрет говна</li><li>✅ Стальные яйки</li></ul><button class="buy-btn" data-price="1337000" data-name="ЧЕРВИ В ГЛАЗАХ">КУПИТЬ</button></div>
      <div class="close-tariff" id="closeTariffBtn">❌ нет, спасибо ❌</div></div>`;
    document.body.appendChild(overlay);
    overlay.querySelectorAll('.buy-btn').forEach(btn => {
      btn.addEventListener('click', () => { alert("Оплата через Совкомбанк"); window.open("https://sovcombank.ru/apply/credit/city-spb/", "_blank"); });
    });
    overlay.querySelector('#closeTariffBtn').addEventListener('click', () => {
      overlay.remove(); tariffOverlayActive = false;
    });
  }

  // ========== ГЛАВНАЯ ЛОГИКА ==========
  // Запускаем рекламу
  for (let i = 0; i < 5; i++) { adPanels.push(createAdPanel()); }
  startFlying();
  renderSchedule();

  // Обработчик кнопки "откл рекламу"
  const killBtn = document.getElementById('adKillerBtn');
  killBtn.addEventListener('click', () => {
    // убиваем рекламу
    killAllAds();
    // удаляем кнопку навсегда
    killBtn.remove();
    // через 5 секунд включаем ЛСД-эффект
    setTimeout(() => {
      document.body.classList.add('lsd-active');
    }, 5000);
  });
</script>
</body>
</html>
