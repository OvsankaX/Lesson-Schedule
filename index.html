<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
<title>Расписание — реклама в рандомных местах</title>

<style>
  /* ===== ОРИГИНАЛЬНЫЙ СТИЛЬ РАСПИСАНИЯ (НЕ СДВИГАЕТСЯ) ===== */
  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    padding: 0;
    font-family: system-ui, Arial, sans-serif;
    background: #121212;
    color: #e5e5e5;
    min-height: 100vh;
    position: relative;
  }

  header {
    text-align: center;
    padding: 18px;
    font-size: 22px;
    background: #1c1c1c;
    border-bottom: 1px solid #2a2a2a;
  }

  /* ЦЕНТРИРУЕМ ТАБЛИЦУ — ВСЕГДА ПО СЕРЕДИНЕ, БЕЗ СМЕЩЕНИЙ */
  .container {
    max-width: 900px;
    margin: 0 auto;
    padding: 14px;
    position: relative;
    z-index: 1;
    background: transparent;
  }

  .card {
    background: #1c1c1c;
    border-radius: 10px;
    padding: 14px 16px;
    margin-bottom: 12px;
    border: 1px solid #2a2a2a;
  }

  .card .time {
    opacity: 0.7;
    font-size: 14px;
    margin-bottom: 4px;
  }

  .card .subject {
    font-size: 17px;
    font-weight: 500;
  }

  .day-title {
    font-size: 19px;
    margin: 20px 0 10px;
    opacity: 0.85;
  }

  .btns {
    display: flex;
    gap: 10px;
    margin-top: 20px;
    margin-bottom: 20px;
  }

  button {
    flex: 1;
    padding: 14px 0;
    background: #2d2d2d;
    border: none;
    border-radius: 8px;
    color: #e5e5e5;
    font-size: 16px;
    cursor: pointer;
  }

  button:active {
    background: #3a3a3a;
  }

  /* Таблица — ровно по центру */
  @media (min-width: 750px) {
    .card {
      display: none;
    }
    table {
      display: table;
    }
  }

  table {
    width: 100%;
    border-collapse: collapse;
    background: #1c1c1c;
    margin-bottom: 20px;
    border-radius: 10px;
    overflow: hidden;
  }

  th, td {
    padding: 12px;
    border-bottom: 1px solid #2a2a2a;
    text-align: center;
  }

  th {
    background: #222;
    font-weight: 600;
  }

  /* ===== РЕКЛАМНЫЕ ПЛАШКИ (РАНДОМНЫЕ ПОЗИЦИИ) ===== */
  .ad-float {
    position: fixed;
    background: #0a0a0a;
    border: 3px solid white;        /* БЕЛАЯ ОБВОДКА */
    border-radius: 20px;
    box-shadow: 0 0 20px rgba(255,255,200,0.4);
    z-index: 10000;
    overflow: hidden;
    transition: opacity 0.2s ease, visibility 0.2s ease;
    cursor: default;
    backdrop-filter: blur(4px);
    max-width: 260px;
    width: auto;
    min-width: 140px;
  }

  /* Адаптивный размер плашек: на телефоне поменьше */
  @media (max-width: 700px) {
    .ad-float {
      max-width: 180px;
      border-width: 2px;
    }
    .close-corner {
      width: 26px;
      height: 26px;
      font-size: 16px;
    }
  }

  .ad-inner {
    position: relative;
    display: block;
    width: 100%;
  }

  .ad-img {
    width: 100%;
    height: auto;
    display: block;
    cursor: pointer;
    object-fit: cover;
  }

  /* Крестик закрытия в правом верхнем углу */
  .close-corner {
    position: absolute;
    top: 4px;
    right: 6px;
    background: #cc3333;
    border: none;
    color: white;
    font-size: 18px;
    font-weight: bold;
    width: 30px;
    height: 30px;
    border-radius: 30px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 0 4px black;
    z-index: 20;
    font-family: monospace;
    transition: 0.05s linear;
  }

  .close-corner:active {
    background: #ff6666;
  }

  /* скрытый класс */
  .ad-float.hidden-ad {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
  }
</style>
</head>
<body>

<header>Дима пьяный украинец</header>

<div class="container">
  <div id="content"></div>
  <div class="btns">
    <button onclick="prevDay()">← Пред.</button>
    <button onclick="toggleAll()" id="toggleBtn">Все дни</button>
    <button onclick="nextDay()">След. →</button>
  </div>
</div>

<script>
  // ========== РАСПИСАНИЕ (ОРИГИНАЛ) ==========
  const schedules = {
    "понедельник": ["Разговоры о какашках", "История", "Физкультура", "Алгебра", "География", "Обществознание", "Иностранный язык"],
    "вторник": ["Литература", "Русский язык", "ОБЖ", "Алгебра", "Физика", "Иностранный язык", "История"],
    "среда": ["Русский язык", "Литература", "География", "Химия", "Информатика", "Физкультура", "Труд"],
    "четверг": ["Говно фуууу", "Алгебра", "Геометрия", "Физика", "Биология", "Русский язык", "Литература"],
    "пятница": ["Вероятность и статистика", "Геометрия", "История", "Химия", "Биология", "Физика", "Иностранный язык"]
  };
  const times = ["8:30–9:15","9:35–10:20","10:40–11:25","11:50–12:35","12:55–13:40","13:50–14:35","14:40–15:25"];
  const days = ["понедельник","вторник","среда","четверг","пятница"];
  let dayIndex = (() => {
    let idx = new Date().getDay() - 1;
    return (idx >= 0 && idx <= 4) ? idx : 0;
  })();
  let showAll = false;

  function addCell(row, text, isHead) {
    let cell = document.createElement(isHead ? "th" : "td");
    cell.textContent = text;
    row.appendChild(cell);
  }

  function renderDayBlock(container, day) {
    let title = document.createElement("div");
    title.className = "day-title";
    title.textContent = day.charAt(0).toUpperCase() + day.slice(1);
    container.appendChild(title);
    // карточки для мобилы
    for (let i = 0; i < schedules[day].length; i++) {
      let card = document.createElement("div");
      card.className = "card";
      let tSpan = document.createElement("div");
      tSpan.className = "time";
      tSpan.textContent = times[i];
      let sSpan = document.createElement("div");
      sSpan.className = "subject";
      sSpan.textContent = schedules[day][i];
      card.appendChild(tSpan);
      card.appendChild(sSpan);
      container.appendChild(card);
    }
    // таблица для ПК (широкие экраны)
    if (window.innerWidth >= 750) {
      let table = document.createElement("table");
      let thead = document.createElement("tr");
      addCell(thead, "#", true);
      addCell(thead, "Время", true);
      addCell(thead, "Предмет", true);
      table.appendChild(thead);
      for (let i = 0; i < schedules[day].length; i++) {
        let row = document.createElement("tr");
        addCell(row, i + 1, false);
        addCell(row, times[i], false);
        addCell(row, schedules[day][i], false);
        table.appendChild(row);
      }
      container.appendChild(table);
    }
  }

  function renderSchedule() {
    let root = document.getElementById("content");
    root.innerHTML = "";
    document.getElementById("toggleBtn").textContent = showAll ? "Один день" : "Все дни";
    if (showAll) {
      for (let d of days) renderDayBlock(root, d);
    } else {
      renderDayBlock(root, days[dayIndex]);
    }
  }

  window.prevDay = () => { dayIndex = (dayIndex - 1 + days.length) % days.length; showAll = false; renderSchedule(); };
  window.nextDay = () => { dayIndex = (dayIndex + 1) % days.length; showAll = false; renderSchedule(); };
  window.toggleAll = () => { showAll = !showAll; renderSchedule(); };

  // ========== РЕКЛАМА: РАНДОМНЫЕ МЕСТА, РАЗНЫЕ КАРТИНКИ, КРЕСТИК ==========
  // Три рекламных объявления (локальные файлы из папки images/)
  const adCampaigns = [
    { img: "images/casebattle.png",   link: "https://case-battle.red/",     alt: "Case Battle" },
    { img: "images/upgrader.png",     link: "https://upgrader.pro/ru",      alt: "Upgrader Pro" },
    { img: "images/gosuslugi.png",    link: "https://contract.gosuslugi.ru/", alt: "Госуслуги" }
  ];

  // КОЛИЧЕСТВО РЕКЛАМНЫХ ПЛАШЕК (всегда разное, появляются в разных местах)
  const AD_COUNT = 5;  // 5 плашек, которые будут скакать по экрану

  // Хранилище для плашек: DOM-элементы и их текущий индекс картинки
  let adPanels = [];
  let closeTimeouts = [];

  // Функция: получить случайные координаты в пределах окна (чтобы плашка не вылезала за границы)
  function getRandomPosition(adElement) {
    if (!adElement) return { left: 20, top: 20 };
    // ширина/высота плашки после рендера
    const rect = adElement.getBoundingClientRect();
    const adWidth = rect.width || 180;
    const adHeight = rect.height || 140;
    const maxX = Math.max(20, window.innerWidth - adWidth - 20);
    const maxY = Math.max(20, window.innerHeight - adHeight - 20);
    
    let left = Math.random() * maxX;
    let top = Math.random() * maxY;
    
    // Добавляем дикий рандом: иногда чуть выше, иногда прилипает к краям
    if (Math.random() > 0.7) left = 10;  // прижимаем к левому краю
    if (Math.random() > 0.8) left = window.innerWidth - adWidth - 10; // правый край
    if (Math.random() > 0.85) top = 10;  // верх
    if (Math.random() > 0.85) top = window.innerHeight - adHeight - 10; // низ
    
    // Ограничители
    left = Math.min(Math.max(5, left), window.innerWidth - adWidth - 5);
    top = Math.min(Math.max(5, top), window.innerHeight - adHeight - 5);
    
    return { left: left, top: top };
  }

  // Обновить позицию для конкретной плашки
  function relocateAd(ad) {
    if (!ad || !ad.element) return;
    const pos = getRandomPosition(ad.element);
    ad.element.style.left = pos.left + "px";
    ad.element.style.top = pos.top + "px";
    ad.element.style.right = "auto";
    ad.element.style.bottom = "auto";
  }

  // Обновить картинку в плашке (по индексу)
  function updateAdImage(ad) {
    const campaign = adCampaigns[ad.imageIndex % adCampaigns.length];
    if (ad.imgElement) {
      ad.imgElement.src = campaign.img;
      ad.imgElement.alt = campaign.alt;
      // Клик по картинке ведёт на ссылку
      ad.imgElement.onclick = (e) => {
        e.preventDefault();
        e.stopPropagation();
        window.open(campaign.link, "_blank");
      };
    }
  }

  // Создать новую плашку (с рандомной картинкой)
  function createAdPanel(indexSeed) {
    const div = document.createElement("div");
    div.className = "ad-float";
    
    const inner = document.createElement("div");
    inner.className = "ad-inner";
    
    const img = document.createElement("img");
    img.className = "ad-img";
    
    const closeBtn = document.createElement("button");
    closeBtn.className = "close-corner";
    closeBtn.textContent = "✖";
    
    inner.appendChild(img);
    inner.appendChild(closeBtn);
    div.appendChild(inner);
    document.body.appendChild(div);
    
    // Случайный начальный индекс картинки (чтобы все плашки разные)
    const startIdx = Math.floor(Math.random() * adCampaigns.length);
    const adObj = {
      element: div,
      imgElement: img,
      closeBtn: closeBtn,
      imageIndex: startIdx,
      timeoutId: null
    };
    
    updateAdImage(adObj);
    
    // Устанавливаем случайную позицию (сначала скрыто, потом покажем)
    div.style.visibility = "visible";
    div.style.opacity = "1";
    relocateAd(adObj);
    
    // событие на крестик: закрываем на 1 секунду, меняем картинку, появляемся в новом месте
    closeBtn.addEventListener("click", (e) => {
      e.stopPropagation();
      if (adObj.timeoutId) clearTimeout(adObj.timeoutId);
      // прячем плашку
      div.classList.add("hidden-ad");
      adObj.timeoutId = setTimeout(() => {
        // меняем картинку на следующую (цикл)
        adObj.imageIndex = (adObj.imageIndex + 1) % adCampaigns.length;
        updateAdImage(adObj);
        // перемещаем в НОВОЕ РАНДОМНОЕ МЕСТО (!!)
        relocateAd(adObj);
        // показываем снова
        div.classList.remove("hidden-ad");
        adObj.timeoutId = null;
      }, 1000);
    });
    
    // Также добавим ресайз окна — переставляем плашки, чтобы не вылезали
    return adObj;
  }
  
  // Переместить все плашки в новые рандомные места (при ресайзе)
  function relocateAllAds() {
    for (let ad of adPanels) {
      if (ad && ad.element && !ad.element.classList.contains("hidden-ad")) {
        relocateAd(ad);
      } else if (ad && ad.element) {
        // даже скрытым на всякий случай обновим позицию, чтобы после появления был норм
        relocateAd(ad);
      }
    }
  }
  
  // Инициализация всех плашек
  function initAds() {
    // удаляем старые, если есть
    for (let ad of adPanels) {
      if (ad && ad.element) ad.element.remove();
    }
    if (closeTimeouts.length) {
      for (let t of closeTimeouts) clearTimeout(t);
      closeTimeouts = [];
    }
    adPanels = [];
    
    // Создаём AD_COUNT плашек (штук 5)
    for (let i = 0; i < AD_COUNT; i++) {
      const newAd = createAdPanel(i);
      adPanels.push(newAd);
    }
  }
  
  // Обработчик ресайза: перерисовываем позиции всех плашек + не даём контенту сместиться
  let resizeTimeout = null;
  window.addEventListener("resize", () => {
    if (resizeTimeout) clearTimeout(resizeTimeout);
    resizeTimeout = setTimeout(() => {
      relocateAllAds();
      renderSchedule(); // расписание остаётся ровно по центру (контейнер auto margin)
    }, 150);
  });
  
  // Также при скролле нефик не двигаем — фикс элемент, все ок.
  // но на всякий случай проверим что плашки не наезжают на контент слишком, позиции рандомны.
  
  // Чтобы плашки не перекрывали кнопки управления, но это норм — юмористично.
  // Дополнительно: для телефонов размер плашек уменьшается через CSS, и координаты будут корректные.
  
  // ========== АДАПТАЦИЯ ПОД ТЕЛЕФОНЫ (рандомные места тоже работают) ==========
  // Никаких дополнительных условий — relocateAd сам подстроится под ширину экрана и размеры плашки.
  
  // Запускаем всё
  renderSchedule();
  initAds();
  
  // Периодический "прикол" — раз в 30 секунд можно менять позиции у всех плашек (чтобы бесило)
  setInterval(() => {
    for (let ad of adPanels) {
      if (ad && ad.element && !ad.element.classList.contains("hidden-ad")) {
        relocateAd(ad);
      } else if (ad && ad.element) {
        // скрытые тоже тихонько перемещаем, чтобы после выхода были в новом месте
        relocateAd(ad);
      }
    }
  }, 25000);
  
  // Дополнительно чтобы таблица оставалась по центру - фикс margin от рекламы не требуется.
  // Убираем возможные баги с z-index
  console.log("🔥 Упоротая реклама: плашки в рандомных местах, на телефоне тоже! Белая обводка, крестик, пропадают на 1 сек и меняют картинку + место");
</script>

</body>
</html>
