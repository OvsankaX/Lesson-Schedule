<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
<title>Дима Лудоман Edition</title>

<style>
  /* ===== ГЛОБАЛЬНЫЕ СТИЛИ ===== */
  * { box-sizing: border-box; }
  body { margin: 0; padding: 0; font-family: system-ui, Arial, sans-serif; background: #121212; color: #e5e5e5; min-height: 100vh; position: relative; overflow-x: hidden; }
  header { text-align: center; padding: 18px; font-size: 22px; background: #1c1c1c; border-bottom: 1px solid #2a2a2a; }
  .container { max-width: 900px; margin: 0 auto; padding: 14px; position: relative; z-index: 1; }
  
  /* Расписание */
  .card { background: #1c1c1c; border-radius: 10px; padding: 14px 16px; margin-bottom: 12px; border: 1px solid #2a2a2a; }
  .card .time { opacity: 0.7; font-size: 14px; margin-bottom: 4px; }
  .card .subject { font-size: 17px; font-weight: 500; }
  .day-title { font-size: 19px; margin: 20px 0 10px; opacity: 0.85; }
  .btns { display: flex; gap: 10px; margin-top: 20px; margin-bottom: 20px; }
  button { flex: 1; padding: 14px 0; background: #2d2d2d; border: none; border-radius: 8px; color: #e5e5e5; font-size: 16px; cursor: pointer; }
  
  table { width: 100%; border-collapse: collapse; background: #1c1c1c; margin-bottom: 20px; border-radius: 10px; overflow: hidden; display: none; }
  th, td { padding: 12px; border-bottom: 1px solid #2a2a2a; text-align: center; }
  @media (min-width: 750px) { .card { display: none; } table { display: table; } }

  /* ===== РЕКЛАМА ===== */
  .ad-float { position: fixed; background: #0a0a0a; border: 3px solid white; border-radius: 20px; z-index: 1000; overflow: hidden; max-width: 200px; cursor: default; }
  .close-corner { position: absolute; top: 4px; right: 6px; background: #cc3333; border: none; color: white; width: 28px; height: 28px; border-radius: 50%; cursor: pointer; }
  .ad-img { width: 100%; display: block; }

  /* Кнопка убийца рекламы */
  .kill-ads-btn { position: fixed; top: 10px; left: 10px; z-index: 9999; background: #000; border: 1px solid #fff; color: #fff; padding: 8px 12px; font-size: 12px; cursor: pointer; }
  .kill-ads-btn span { text-decoration: line-through; color: #ff4444; }

  /* Эффект взрыва */
  .pixel-dust { position: fixed; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index:10001; }
  .pixel { position: absolute; background: #fff; animation: fly 0.5s forwards; }
  @keyframes fly { 100% { transform: translate(var(--dx), var(--dy)); opacity: 0; } }

  /* ===== ЛУДОМАНИЯ (ФИОЛЕТОВАЯ) ===== */
  #ludo-screen { position: fixed; inset: 0; background: #0f0f0f; z-index: 10500; display: none; flex-direction: column; align-items: center; padding: 20px; overflow-y: auto; }
  .wheel-container { position: relative; width: 220px; height: 220px; border: 6px solid #222; border-radius: 50%; background: #1a1a1a; margin: 20px 0; overflow: hidden; }
  .wheel-fill { position: absolute; bottom: 0; width: 100%; background: #8a2be2; opacity: 0.7; transition: height 0.4s; }
  .wheel-percent { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 40px; font-weight: bold; color: #fff; z-index: 5; }
  #spinner { position: absolute; inset: 0; z-index: 6; transition: transform 3s cubic-bezier(0.1, 0, 0.1, 1); }
  .pointer { position: absolute; top: 5px; left: 50%; width: 12px; height: 12px; background: #fff; border-radius: 50%; box-shadow: 0 0 10px #fff; transform: translateX(-50%); }
  
  .chance-btns button { background: #1a1a1a; border: 2px solid #333; margin: 5px; padding: 10px 15px; width: 70px; color: #fff; }
  .chance-btns .active { border-color: #8a2be2; color: #8a2be2; }
  #upgrade-btn { background: #8a2be2; color: #fff; width: 220px; padding: 15px; margin: 20px 0; font-weight: bold; }

  .inventory { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; width: 100%; max-width: 400px; }
  .inv-item { background: #1a1a1a; border: 2px solid #333; padding: 10px; text-align: center; cursor: pointer; border-radius: 8px; }
  .inv-item.selected { border-color: #8a2be2; }

  /* Тарифы */
  .tariff-overlay { position: fixed; inset: 0; background: #0a0c12; z-index: 20000; padding: 20px; overflow-y: auto; }
  .tariff-card { background: #1a1e2a; border: 2px solid #fff; border-radius: 20px; padding: 20px; margin-bottom: 20px; }
  .buy-btn { background: #fff; color: #000; width: 100%; padding: 15px; border-radius: 30px; font-weight: bold; margin-top: 10px; }
</style>
</head>
<body>

<button class="kill-ads-btn" onclick="explodeToLudo()"><span>AD</span> откл рекламу</button>

<div id="main-ui">
  <header>Дима пьяный украинец</header>
  <div class="container">
    <div id="content"></div>
    <div class="btns">
      <button onclick="prevDay()">← Пред.</button>
      <button onclick="toggleAll()" id="toggleBtn">Все дни</button>
      <button onclick="nextDay()">След. →</button>
    </div>
  </div>
</div>

<div id="ludo-screen">
  <div style="font-size: 24px; color: #8a2be2;">UPGRADER</div>
  <div class="wheel-container">
    <div class="wheel-fill" id="fill"></div>
    <div class="wheel-percent" id="perc-val">50%</div>
    <div id="spinner"><div class="pointer"></div></div>
  </div>
  <div class="chance-btns">
    <button onclick="setChance(50)" id="c50" class="active">50%</button>
    <button onclick="setChance(20)" id="c20">20%</button>
    <button onclick="setChance(10)" id="c10">10%</button>
  </div>
  <button id="upgrade-btn" onclick="spin()">ПРОКАЧАТЬ</button>
  <div class="inventory" id="inv"></div>
  <button style="margin-top: 40px; background: none; font-size: 12px; color: #555;" onclick="location.reload()">Вернуться к расписанию</button>
</div>

<script>
  // РАСПИСАНИЕ
  const sch = {"понедельник": ["Разговоры о лудомании", "История", "Физкультура", "Алгебра", "География", "Обществознание", "Иностранный язык"],"вторник": ["Литература", "Русский язык", "ОБЖ", "Алгебра", "Физика", "Иностранный язык", "История"],"среда": ["Русский язык", "Литература", "География", "Химия", "Информатика", "Физкультура", "Труд"],"четверг": ["кейс батл", "Алгебра", "Геометрия", "Физика", "Биология", "Русский язык", "Литература"],"пятница": ["Вероятность и статистика", "Геометрия", "История", "Химия", "Биология", "Физика", "Иностранный язык"]};
  const times = ["8:30–9:15","9:35–10:20","10:40–11:25","11:50–12:35","12:55–13:40","13:50–14:35","14:40–15:25"];
  const days = Object.keys(sch);
  let dIdx = 0, showAll = false;

  function render() {
    const root = document.getElementById("content"); root.innerHTML = "";
    const renderDay = (d) => {
      root.innerHTML += `<div class="day-title">${d}</div>`;
      sch[d].forEach((s, i) => {
        root.innerHTML += `<div class="card"><div class="time">${times[i]}</div><div class="subject">${s}</div></div>`;
      });
    };
    if(showAll) days.forEach(renderDay); else renderDay(days[dIdx]);
  }
  window.prevDay = () => { dIdx = (dIdx-1+5)%5; showAll=false; render(); };
  window.nextDay = () => { dIdx = (dIdx+1)%5; showAll=false; render(); };
  window.toggleAll = () => { showAll = !showAll; render(); };

  // РЕКЛАМА (DVD)
  let ads = [];
  function createAd() {
    const div = document.createElement('div'); div.className = 'ad-float';
    div.innerHTML = `<button class="close-corner" onclick="this.parentElement.remove(); checkAdsCount();">✖</button>
                     <img src="https://via.placeholder.com/200x120/000/fff?text=CASE+BATTLE" class="ad-img">`;
    document.body.appendChild(div);
    let x = Math.random()*200, y = Math.random()*200, vx = 2, vy = 2;
    function move() {
      x += vx; y += vy;
      if(x <= 0 || x + 200 >= window.innerWidth) vx *= -1;
      if(y <= 0 || y + 150 >= window.innerHeight) vy *= -1;
      div.style.left = x+'px'; div.style.top = y+'px';
      requestAnimationFrame(move);
    }
    move();
  }
  for(let i=0; i<3; i++) createAd();

  let closedCount = 0;
  function checkAdsCount() { closedCount++; if(closedCount >= 3) showTariffs(); }

  // ТАРИФЫ
  function showTariffs() {
    const ov = document.createElement('div'); ov.className = 'tariff-overlay';
    ov.innerHTML = `<div class="tariff-card"><h2>ТАРИФ "ZA SVO"</h2><p>99 999 ₴</p>
                    <button class="buy-btn" onclick="alert('Денег нет, но вы держитесь')">КУПИТЬ</button></div>
                    <center onclick="this.parentElement.remove()">закрыть</center>`;
    document.body.appendChild(ov);
  }

  // ЛУДОМАНИЯ
  const pool = ["Сифилис", "Мама", "Твои яйца", "Сиськи", "Девственность", "Геморрой", "ВИЧ+", "Зубной налет"];
  let inv = [], selIdx = 0, chance = 50, spinning = false;

  function initInv() {
    inv = Array(3).fill(0).map(() => ({ name: pool[Math.floor(Math.random()*pool.length)], price: Math.floor(Math.random()*300) }));
    renderInv();
  }

  function renderInv() {
    const g = document.getElementById('inv'); g.innerHTML = "";
    inv.forEach((it, i) => {
      g.innerHTML += `<div class="inv-item ${selIdx==i?'selected':''}" onclick="selIdx=${i};renderInv()">${it.name}<br>${it.price}₴</div>`;
    });
  }

  function setChance(c) { 
    if(spinning) return; chance = c; 
    document.getElementById('perc-val').innerText = c+'%';
    document.getElementById('fill').style.height = c+'%';
    ['c50','c20','c10'].forEach(id => document.getElementById(id).className = '');
    document.getElementById('c'+c).className = 'active';
  }

  function spin() {
    if(spinning) return; spinning = true;
    const s = document.getElementById('spinner');
    const deg = 1800 + Math.random()*360;
    s.style.transform = `rotate(${deg}deg)`;
    setTimeout(() => {
      spinning = false;
      if(Math.random()*100 <= chance) {
        inv[selIdx].price = Math.round(inv[selIdx].price * (100/chance));
        inv[selIdx].name = pool[Math.floor(Math.random()*pool.length)];
        alert("ВЫИГРАЛ!");
      } else {
        alert("ПРОЕБАЛ!");
        inv[selIdx] = { name: "Мусор", price: 0 };
      }
      s.style.transition = 'none'; s.style.transform = 'rotate(0deg)';
      setTimeout(() => s.style.transition = '', 50);
      renderInv();
    }, 3000);
  }

  function explodeToLudo() {
    const d = document.createElement('div'); d.className = 'pixel-dust'; document.body.appendChild(d);
    for(let i=0; i<100; i++) {
      const p = document.createElement('div'); p.className = 'pixel';
      p.style.left = Math.random()*100+'%'; p.style.top = Math.random()*100+'%';
      p.style.width = '10px'; p.style.height = '10px';
      p.style.setProperty('--dx', (Math.random()-0.5)*1000+'px');
      p.style.setProperty('--dy', (Math.random()-0.5)*1000+'px');
      d.appendChild(p);
    }
    setTimeout(() => {
      document.getElementById('main-ui').style.display = 'none';
      document.querySelectorAll('.ad-float').forEach(a => a.remove());
      document.getElementById('ludo-screen').style.display = 'flex';
      initInv();
    }, 500);
  }

  render();
</script>
</body>
</html>
