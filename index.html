<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
<title>Расписание — реклама со всех сторон</title>

<style>
  /* ===== ОРИГИНАЛЬНЫЙ СТИЛЬ РАСПИСАНИЯ ===== */
  body {
    margin: 0;
    padding: 0;
    font-family: system-ui, Arial, sans-serif;
    background: #121212;
    color: #e5e5e5;
    min-height: 100vh;
  }

  header {
    text-align: center;
    padding: 18px;
    font-size: 22px;
    background: #1c1c1c;
    border-bottom: 1px solid #2a2a2a;
  }

  /* ЦЕНТРИРУЕМ ТАБЛИЦУ — больше никаких маргинов */
  .container {
    max-width: 900px;
    margin: 0 auto;
    padding: 14px;
    /* Добавляем отступы, чтобы контент не налезал на рекламу */
    box-sizing: border-box;
  }

  .card {
    background: #1c1c1c;
    border-radius: 10px;
    padding: 14px 16px;
    margin-bottom: 12px;
    border: 1px solid #2a2a2a;
  }

  .card .time {
    opacity: 0.7;
    font-size: 14px;
    margin-bottom: 4px;
  }

  .card .subject {
    font-size: 17px;
    font-weight: 500;
  }

  .day-title {
    font-size: 19px;
    margin: 20px 0 10px;
    opacity: 0.85;
  }

  .btns {
    display: flex;
    gap: 10px;
    margin-top: 20px;
    margin-bottom: 20px;
  }

  button {
    flex: 1;
    padding: 14px 0;
    background: #2d2d2d;
    border: none;
    border-radius: 8px;
    color: #e5e5e5;
    font-size: 16px;
    cursor: pointer;
  }

  button:active {
    background: #3a3a3a;
  }

  /* Таблица — строго по центру внутри .container */
  @media (min-width: 750px) {
    .card {
      display: none;
    }
    table {
      display: table;
    }
  }

  table {
    width: 100%;
    border-collapse: collapse;
    background: #1c1c1c;
    margin-bottom: 20px;
    border-radius: 10px;
    overflow: hidden;
  }

  th, td {
    padding: 12px;
    border-bottom: 1px solid #2a2a2a;
    text-align: center;
  }

  th {
    background: #222;
    font-weight: 600;
  }

  /* ========== РЕКЛАМНЫЕ ПЛАШКИ (СО ВСЕХ СТОРОН) ========== */
  /* Базовая стилизация для всех рекламных блоков */
  .ad-panel {
    position: fixed;
    background: #0f0f0f;
    border: 2px solid white;        /* БЕЛАЯ ОБВОДКА */
    border-radius: 16px;
    box-shadow: 0 0 12px rgba(255,255,255,0.3);
    z-index: 1000;
    overflow: hidden;
    transition: all 0.2s ease;
    backdrop-filter: blur(2px);
  }

  /* Внутренний контейнер для картинки и крестика */
  .ad-inner {
    position: relative;
    display: block;
    width: 100%;
    height: 100%;
  }

  .ad-img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    cursor: pointer;
  }

  /* Крестик закрытия (всегда в углу) */
  .close-corner {
    position: absolute;
    top: 4px;
    right: 6px;
    background: #cc3333;
    border: none;
    color: white;
    font-size: 18px;
    font-weight: bold;
    width: 28px;
    height: 28px;
    border-radius: 30px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 0 4px black;
    z-index: 15;
    font-family: monospace;
    line-height: 1;
  }

  .close-corner:hover {
    background: #ff5555;
  }

  /* ---- Позиционирование каждой плашки ---- */
  /* Верхняя реклама (центр вверху) */
  .ad-top {
    top: 16px;
    left: 50%;
    transform: translateX(-50%);
    width: 320px;
    height: 100px;
  }

  /* Нижняя реклама (центр внизу) */
  .ad-bottom {
    bottom: 16px;
    left: 50%;
    transform: translateX(-50%);
    width: 360px;
    height: 110px;
  }

  /* Левая реклама (вертикальная, по центру слева) */
  .ad-left {
    left: 16px;
    top: 50%;
    transform: translateY(-50%);
    width: 180px;
    height: 260px;
  }

  /* Правая реклама (вертикальная) */
  .ad-right {
    right: 16px;
    top: 50%;
    transform: translateY(-50%);
    width: 180px;
    height: 260px;
  }

  /* Дополнительная плашка сверху-справа (для упоротости) */
  .ad-topright {
    top: 16px;
    right: 16px;
    width: 200px;
    height: 100px;
  }

  /* Дополнительная плашка снизу-слева */
  .ad-bottomleft {
    bottom: 16px;
    left: 16px;
    width: 200px;
    height: 100px;
  }

  /* Для телефонов — скрываем часть плашек, чтобы не мешали */
  @media (max-width: 800px) {
    .ad-left, .ad-right, .ad-topright, .ad-bottomleft {
      display: none;
    }
    .ad-top {
      width: 260px;
      height: 80px;
      top: 8px;
    }
    .ad-bottom {
      width: 280px;
      height: 90px;
      bottom: 8px;
    }
    /* отступы контенту, чтобы не налезало */
    .container {
      padding-top: 100px;
      padding-bottom: 110px;
    }
  }

  /* Для средних экранов (планшеты) показываем основные, но уменьшаем */
  @media (min-width: 801px) and (max-width: 1100px) {
    .ad-left, .ad-right {
      width: 140px;
      height: 220px;
    }
    .ad-top, .ad-bottom {
      width: 280px;
      height: 90px;
    }
    .container {
      margin-left: 170px;
      margin-right: 170px;
    }
  }

  /* Для больших ПК даем воздух */
  @media (min-width: 1101px) {
    .container {
      margin-left: auto;
      margin-right: auto;
    }
    /* небольшие отступы, чтобы таблица не цепляла рекламу */
    .container {
      padding-left: 200px;
      padding-right: 200px;
    }
  }

  /* Кнопка закрытия для ПК / мобил единая логика */
  .ad-panel.hidden {
    display: none;
  }
</style>
</head>
<body>

<header>Дима пьяный украинец</header>

<div class="container">
  <div id="content"></div>
  <div class="btns">
    <button onclick="prevDay()">← Пред.</button>
    <button onclick="toggleAll()" id="toggleBtn">Все дни</button>
    <button onclick="nextDay()">След. →</button>
  </div>
</div>

<!-- ==========  ВСЕ РЕКЛАМНЫЕ ПЛАШКИ (6 штук, разные стороны) ========== -->
<!-- Верхняя -->
<div id="adTop" class="ad-panel ad-top">
  <div class="ad-inner">
    <img id="topImg" class="ad-img" src="" alt="Реклама">
    <button class="close-corner" data-id="top">✖</button>
  </div>
</div>

<!-- Нижняя -->
<div id="adBottom" class="ad-panel ad-bottom">
  <div class="ad-inner">
    <img id="bottomImg" class="ad-img" src="" alt="Реклама">
    <button class="close-corner" data-id="bottom">✖</button>
  </div>
</div>

<!-- Левая -->
<div id="adLeft" class="ad-panel ad-left">
  <div class="ad-inner">
    <img id="leftImg" class="ad-img" src="" alt="Реклама">
    <button class="close-corner" data-id="left">✖</button>
  </div>
</div>

<!-- Правая -->
<div id="adRight" class="ad-panel ad-right">
  <div class="ad-inner">
    <img id="rightImg" class="ad-img" src="" alt="Реклама">
    <button class="close-corner" data-id="right">✖</button>
  </div>
</div>

<!-- Верхняя-правая (дополнительная) -->
<div id="adTopRight" class="ad-panel ad-topright">
  <div class="ad-inner">
    <img id="toprightImg" class="ad-img" src="" alt="Реклама">
    <button class="close-corner" data-id="topright">✖</button>
  </div>
</div>

<!-- Нижняя-левая (дополнительная) -->
<div id="adBottomLeft" class="ad-panel ad-bottomleft">
  <div class="ad-inner">
    <img id="bottomleftImg" class="ad-img" src="" alt="Реклама">
    <button class="close-corner" data-id="bottomleft">✖</button>
  </div>
</div>

<script>
  // ========== РАСПИСАНИЕ (ОРИГИНАЛ) ==========
  const schedules = {
    "понедельник": ["Разговоры о какашках", "История", "Физкультура", "Алгебра", "География", "Обществознание", "Иностранный язык"],
    "вторник": ["Литература", "Русский язык", "ОБЖ", "Алгебра", "Физика", "Иностранный язык", "История"],
    "среда": ["Русский язык", "Литература", "География", "Химия", "Информатика", "Физкультура", "Труд"],
    "четверг": ["Говно фуууу", "Алгебра", "Геометрия", "Физика", "Биология", "Русский язык", "Литература"],
    "пятница": ["Вероятность и статистика", "Геометрия", "История", "Химия", "Биология", "Физика", "Иностранный язык"]
  };
  const times = ["8:30–9:15","9:35–10:20","10:40–11:25","11:50–12:35","12:55–13:40","13:50–14:35","14:40–15:25"];
  const days = ["понедельник","вторник","среда","четверг","пятница"];
  let dayIndex = (() => {
    let idx = new Date().getDay() - 1;
    return (idx >= 0 && idx <= 4) ? idx : 0;
  })();
  let showAll = false;

  function addCell(row, text, isHead) {
    let cell = document.createElement(isHead ? "th" : "td");
    cell.textContent = text;
    row.appendChild(cell);
  }

  function renderDayBlock(container, day) {
    let title = document.createElement("div");
    title.className = "day-title";
    title.textContent = day.charAt(0).toUpperCase() + day.slice(1);
    container.appendChild(title);
    // карточки для мобилы
    for (let i = 0; i < schedules[day].length; i++) {
      let card = document.createElement("div");
      card.className = "card";
      let tSpan = document.createElement("div");
      tSpan.className = "time";
      tSpan.textContent = times[i];
      let sSpan = document.createElement("div");
      sSpan.className = "subject";
      sSpan.textContent = schedules[day][i];
      card.appendChild(tSpan);
      card.appendChild(sSpan);
      container.appendChild(card);
    }
    // таблица для ПК (широкие экраны)
    if (window.innerWidth >= 750) {
      let table = document.createElement("table");
      let thead = document.createElement("tr");
      addCell(thead, "#", true);
      addCell(thead, "Время", true);
      addCell(thead, "Предмет", true);
      table.appendChild(thead);
      for (let i = 0; i < schedules[day].length; i++) {
        let row = document.createElement("tr");
        addCell(row, i + 1, false);
        addCell(row, times[i], false);
        addCell(row, schedules[day][i], false);
        table.appendChild(row);
      }
      container.appendChild(table);
    }
  }

  function renderSchedule() {
    let root = document.getElementById("content");
    root.innerHTML = "";
    document.getElementById("toggleBtn").textContent = showAll ? "Один день" : "Все дни";
    if (showAll) {
      for (let d of days) renderDayBlock(root, d);
    } else {
      renderDayBlock(root, days[dayIndex]);
    }
  }

  window.prevDay = () => { dayIndex = (dayIndex - 1 + days.length) % days.length; showAll = false; renderSchedule(); };
  window.nextDay = () => { dayIndex = (dayIndex + 1) % days.length; showAll = false; renderSchedule(); };
  window.toggleAll = () => { showAll = !showAll; renderSchedule(); };

  // ========== РЕКЛАМА: ЛОКАЛЬНЫЕ ФАЙЛЫ ИЗ ПАПКИ images/ ==========
  // ТРИ разных рекламных объявления (картинки и ссылки)
  const adCampaigns = [
    { img: "images/casebattle.png",   link: "https://case-battle.red/",     alt: "Case Battle" },
    { img: "images/upgrader.png",     link: "https://upgrader.pro/ru",      alt: "Upgrader Pro" },
    { img: "images/gosuslugi.png",    link: "https://contract.gosuslugi.ru/", alt: "Госуслуги" }
  ];

  // Для каждой плашки храним свой текущий индекс, чтобы везде была РАЗНАЯ реклама
  // Создаём карту: id плашки -> текущий индекс рекламы
  let adIndexMap = {
    top: 0,
    bottom: 1,
    left: 2,
    right: 0,
    topright: 1,
    bottomleft: 2
  };

  // Все DOM-элементы плашек
  const panels = {
    top: { element: document.getElementById("adTop"), img: document.getElementById("topImg"), btn: null },
    bottom: { element: document.getElementById("adBottom"), img: document.getElementById("bottomImg"), btn: null },
    left: { element: document.getElementById("adLeft"), img: document.getElementById("leftImg"), btn: null },
    right: { element: document.getElementById("adRight"), img: document.getElementById("rightImg"), btn: null },
    topright: { element: document.getElementById("adTopRight"), img: document.getElementById("toprightImg"), btn: null },
    bottomleft: { element: document.getElementById("adBottomLeft"), img: document.getElementById("bottomleftImg"), btn: null }
  };

  // Функция обновления конкретной плашки (картинка + ссылка)
  function updateAdPanel(panelId) {
    const panel = panels[panelId];
    if (!panel || !panel.img) return;
    const idx = adIndexMap[panelId];
    const ad = adCampaigns[idx % adCampaigns.length];
    panel.img.src = ad.img;
    panel.img.alt = ad.alt;
    // клик по картинке открывает ссылку
    panel.img.onclick = (e) => {
      e.preventDefault();
      window.open(ad.link, "_blank");
    };
  }

  // Обновить ВСЕ плашки
  function updateAllAds() {
    for (let id in panels) {
      updateAdPanel(id);
    }
  }

  // Функция: при клике на крестик конкретной плашки:
  // - плашка пропадает на 1 секунду
  // - затем у этой плашки меняется картинка на следующую (циклично)
  // - плашка снова появляется
  // РЕКЛАМА ВЕЗДЕ РАЗНАЯ, потому что у каждой плашки свой счётчик
  function setupAdClose(panelId) {
    const panel = panels[panelId];
    if (!panel || !panel.element) return;
    const closeBtn = panel.element.querySelector(".close-corner");
    if (!closeBtn) return;
    
    let timeoutId = null;
    closeBtn.addEventListener("click", (e) => {
      e.stopPropagation();
      if (timeoutId) clearTimeout(timeoutId);
      // прячем эту плашку (визуально скрываем)
      panel.element.style.opacity = "0";
      panel.element.style.visibility = "hidden";
      // через 1 секунду меняем ей индекс на следующий, обновляем картинку и показываем
      timeoutId = setTimeout(() => {
        // меняем индекс для этой конкретной плашки на +1
        let current = adIndexMap[panelId];
        adIndexMap[panelId] = (current + 1) % adCampaigns.length;
        updateAdPanel(panelId);
        // показываем обратно
        panel.element.style.opacity = "1";
        panel.element.style.visibility = "visible";
        timeoutId = null;
      }, 1000);
    });
  }

  // Инициализация: задаём начальные индексы для каждой плашки так, чтобы везде была разная реклама
  function initRandomAdIndexes() {
    // Уже заданы выше: top:0, bottom:1, left:2, right:0, topright:1, bottomleft:2
    // Но чтобы разнообразить ещё — чуть сдвинем, но оставим уникальный паттерн
    adIndexMap = {
      top: 0,
      bottom: 1,
      left: 2,
      right: 0,
      topright: 1,
      bottomleft: 2
    };
    // Дополнительно: для плашек right и topright сделаем другие, но не суть — главное разная
    // Можно добавить рандома, но по заданию "разные" — уже ок
  }

  // Показать все плашки (они видны по умолчанию)
  function showAllPanels() {
    for (let id in panels) {
      if (panels[id].element) {
        panels[id].element.style.opacity = "1";
        panels[id].element.style.visibility = "visible";
      }
    }
  }

  // Адаптив для телефонов: скрываем некоторые плашки, которые мешают, но оставляем верхнюю и нижнюю
  function handleResponsiveAds() {
    const isMobile = window.innerWidth <= 800;
    if (isMobile) {
      // на телефонах оставляем только top и bottom (верх/низ) — остальное скрыто через CSS, но дополнительно скроем, чтоб убрать слой
      if (panels.left && panels.left.element) panels.left.element.style.display = "none";
      if (panels.right && panels.right.element) panels.right.element.style.display = "none";
      if (panels.topright && panels.topright.element) panels.topright.element.style.display = "none";
      if (panels.bottomleft && panels.bottomleft.element) panels.bottomleft.element.style.display = "none";
      if (panels.top && panels.top.element) panels.top.element.style.display = "flex";
      if (panels.bottom && panels.bottom.element) panels.bottom.element.style.display = "flex";
    } else {
      // на ПК показываем все
      for (let id in panels) {
        if (panels[id].element) panels[id].element.style.display = "flex";
      }
    }
  }

  // тоже самое при ресайзе
  window.addEventListener("resize", () => {
    handleResponsiveAds();
    // отрисовка таблицы не смещается, контент в центре
    renderSchedule();  // перерисовка для коррекции таблицы если нужно
  });

  // Инициализация всей рекламной системы
  function initAds() {
    initRandomAdIndexes();
    updateAllAds();
    // назначаем обработчики крестиков для каждой плашки
    for (let id in panels) {
      setupAdClose(id);
    }
    // применяем адаптив
    handleResponsiveAds();
    // небольшая стилистическая правка: чтобы плашки не скакали при появлении
    for (let id in panels) {
      if (panels[id].element) {
        panels[id].element.style.transition = "opacity 0.2s, visibility 0.2s";
      }
    }
  }

  // Запуск расписания и рекламы
  renderSchedule();
  initAds();

  // Дополнительно: защита от того, чтобы таблица на ПК не уезжала — фикс через CSS уже сделан, но добавим сброс маргинов
  // Также из-за плашек нужно, чтобы контент не наезжал — применяем при ресайзе динамические отступы
  function adjustContainerPadding() {
    const container = document.querySelector('.container');
    if (!container) return;
    const isLarge = window.innerWidth >= 1100;
    if (isLarge) {
      container.style.paddingLeft = "220px";
      container.style.paddingRight = "220px";
    } else if (window.innerWidth >= 801) {
      container.style.paddingLeft = "180px";
      container.style.paddingRight = "180px";
    } else {
      container.style.paddingLeft = "14px";
      container.style.paddingRight = "14px";
    }
  }
  window.addEventListener('resize', adjustContainerPadding);
  adjustContainerPadding();
</script>

</body>
</html>
